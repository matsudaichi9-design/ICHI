<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;font-family:'Inter',system-ui,sans-serif;font-size:13px}
:root{
  --bg:#0F0A05;--pan:#181008;--pan2:#221708;--pan3:#2C1F0E;
  --acc:#C9922A;--acc-rgb:201,146,42;--accd:rgba(201,146,42,.12);--accb:rgba(201,146,42,.32);
  --tx:#EDE0C8;--tx2:#A8977A;--mu:#68583E;
  --bd:rgba(201,146,42,.22);--bd2:rgba(255,255,255,.06);
  --safe:#4A8A5E;--warn:#C9922A;--danger:#B33A3A;--info:#4A7EA8;
  --r:10px;--r2:6px;
  --fh:'Cinzel',serif;
}
#rpgwin{max-width:460px;margin:6px auto;background:var(--bg);border-radius:var(--r);overflow:hidden;border:1px solid var(--bd);box-shadow:0 12px 44px rgba(0,0,0,.6);position:relative;animation:rpi .25s ease both}
@keyframes rpi{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}

/* HEADER */
#rpg-head{position:relative;padding:13px 15px 11px;background:linear-gradient(150deg,var(--pan) 0%,var(--bg) 100%);border-bottom:1px solid var(--bd);cursor:pointer;user-select:none}
#rpg-head::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--acc),transparent);opacity:.4}
.rpg-hd-row{display:flex;align-items:center;gap:11px}
#rpg-avatar{position:relative;width:44px;height:44px;border-radius:8px;flex-shrink:0;background:var(--pan3);border:1.5px solid var(--accb);overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px -3px rgba(var(--acc-rgb),.5)}
#rpg-avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:2}
#rpg-avatar-glyph{font-size:19px}
.rpg-hd-txt{flex:1;min-width:0}
#rpg-name{font-family:var(--fh);font-size:15px;font-weight:700;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rpg-class{font-size:10.5px;color:var(--tx2);margin-top:2px}
.rpg-hd-right{text-align:right;flex-shrink:0}
#rpg-currency{font-family:var(--fh);font-size:13px;font-weight:700;color:var(--acc)}
#rpg-location-badge{font-size:9px;color:var(--tx2);margin-top:2px;white-space:nowrap}
#rpg-xp-wrap{margin-top:9px}
#rpg-xp-track{height:5px;border-radius:3px;background:var(--pan3);overflow:hidden}
#rpg-xp-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#8A661E,var(--acc));transition:width .4s}
#rpg-xp-lbl{display:flex;justify-content:space-between;margin-top:3px;font-size:8.5px;color:var(--mu)}
#rpg-chev{position:absolute;top:14px;right:14px;font-size:10px;color:var(--mu);transition:transform .3s}
#rpgwin.closed #rpg-chev{transform:rotate(180deg)}
#rpgbody{max-height:2400px;overflow:hidden;transition:max-height .35s ease}
#rpgwin.closed #rpgbody{max-height:0}

/* TABS */
#rpgtabs{display:flex;background:var(--pan);border-bottom:1px solid var(--bd2);overflow-x:auto}
#rpgtabs::-webkit-scrollbar{display:none}
.rpgtab{flex:1;min-width:0;padding:8px 4px;text-align:center;font-family:var(--fh);font-size:9.5px;font-weight:700;letter-spacing:.3px;color:var(--mu);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;user-select:none}
.rpgtab:hover{color:var(--tx2)}
.rpgtab.on{color:var(--acc);border-bottom-color:var(--acc);background:var(--accd)}
.rpgpane{display:none;padding:13px 15px 15px}
.rpgpane.on{display:block}
.rpgpane.nopad{padding:0}

.rpg-sec{font-family:var(--fh);font-size:9.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--acc);margin:0 0 8px;padding-bottom:5px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.rpg-sec.mt{margin-top:14px}

/* GRID / LINES */
.rpg-igrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:11px}
.rpg-icard{background:var(--pan2);border:1px solid var(--bd2);border-radius:var(--r2);padding:7px 10px}
.rpg-icard.full{grid-column:1/-1}
.rpg-icard-l{font-size:8.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--mu);margin-bottom:3px}
.rpg-icard-v{font-size:12px;color:var(--tx);font-weight:600}
.rpg-note{font-size:11.5px;color:var(--tx2);font-style:italic;line-height:1.55;background:var(--pan2);border-left:2px solid var(--acc);border-radius:0 6px 6px 0;padding:8px 11px;margin-bottom:11px}

/* MISSION / PROGRESS */
.rpg-mission-card{background:var(--pan2);border:1px solid var(--bd2);border-radius:var(--r2);padding:10px 12px;margin-bottom:11px}
.rpg-mission-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.rpg-mission-nm{font-size:12.5px;font-weight:700;color:var(--tx)}
.rpg-risk{font-size:8.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:2px 7px;border-radius:99px}
.rpg-prog-track{height:6px;border-radius:4px;background:var(--pan3);overflow:hidden;margin-bottom:5px}
.rpg-prog-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#8A661E,var(--acc))}
.rpg-mission-meta{display:flex;justify-content:space-between;font-size:10px;color:var(--mu)}

/* RELATIONS */
.rpg-npc-card{background:var(--pan2);border:1px solid var(--bd2);border-radius:var(--r2);padding:10px 12px;margin-bottom:8px}
.rpg-npc-top{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.rpg-npc-avatar{width:30px;height:30px;border-radius:50%;background:var(--pan3);border:1.5px solid var(--bd);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-weight:700;font-size:12px;color:var(--acc);overflow:hidden;position:relative}
.rpg-npc-avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}
.rpg-npc-nm{font-size:12.5px;font-weight:700;color:var(--tx);flex:1;min-width:0}
.rpg-npc-rel{font-size:9px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.rpg-npc-bar-track{height:5px;border-radius:3px;background:var(--pan3);overflow:hidden;margin-bottom:6px}
.rpg-npc-bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--acc),rgba(var(--acc-rgb),.6))}
.rpg-npc-note{font-size:10.5px;color:var(--tx2);line-height:1.5}

/* RECORDS (Aetheric Records) */
#rpg-rec-toolbar{display:flex;gap:6px;margin-bottom:10px;padding:0 15px}
#rpg-rec-search{flex:1;background:var(--pan2);border:1px solid var(--bd2);border-radius:var(--r2);padding:6px 10px;color:var(--tx);font-size:11.5px;outline:none}
#rpg-rec-search:focus{border-color:var(--accb)}
#rpg-rec-filter{background:var(--pan2);border:1px solid var(--bd2);border-radius:var(--r2);padding:6px 8px;color:var(--tx2);font-size:11px;outline:none}
#rpg-rec-count{font-size:9.5px;color:var(--mu);padding:0 15px 8px}
#rpg-rec-list{padding:0 15px}
.rpg-rec-card{background:var(--pan2);border:1px solid var(--bd2);border-left:2px solid var(--acc);border-radius:0 var(--r2) var(--r2) 0;padding:9px 11px;margin-bottom:7px}
.rpg-rec-top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.rpg-rec-ttl{font-size:12px;font-weight:700;color:var(--tx);flex:1;min-width:0}
.rpg-rec-tag{font-size:8px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:2px 7px;border-radius:99px;white-space:nowrap;flex-shrink:0}
.rpg-rec-desc{font-size:11px;color:var(--tx2);line-height:1.5}

/* MAP */
#rpg-map-wrap{position:relative;height:280px;background:radial-gradient(ellipse at 50% 40%,#141c2e 0%,#0a0e18 100%);overflow:hidden;touch-action:none;cursor:grab}
#rpg-map-wrap.grabbing{cursor:grabbing}
#rpg-map-svg{width:100%;height:100%;display:block}
.rpg-map-edge{stroke:rgba(201,146,42,.28);stroke-width:1.2;fill:none}
.rpg-map-node-dot{fill:#1a2338;stroke:var(--mu);stroke-width:1.4}
.rpg-map-node-dot.discovered{stroke:var(--acc);fill:#2a2010}
.rpg-map-node-dot.current{fill:var(--acc);stroke:#fff;stroke-width:1.6}
.rpg-map-node-lbl{font-size:6.5px;fill:#8a9ab0;font-family:'Inter',sans-serif;text-anchor:middle}
.rpg-map-node-lbl.discovered{fill:var(--tx2)}
.rpg-map-node-lbl.current{fill:var(--acc);font-weight:700}
#rpg-map-compass{position:absolute;top:10px;left:10px;width:30px;height:30px;opacity:.7;pointer-events:none}
#rpg-map-controls{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:5px}
.rpg-map-btn{width:26px;height:26px;border-radius:6px;background:rgba(20,25,40,.85);border:1px solid rgba(201,146,42,.3);color:var(--acc);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;cursor:pointer;user-select:none;backdrop-filter:blur(3px)}
.rpg-map-btn:hover{background:rgba(201,146,42,.15)}
#rpg-map-current-lbl{position:absolute;bottom:10px;left:10px;font-size:10px;color:var(--tx2);background:rgba(20,25,40,.75);padding:4px 9px;border-radius:99px;border:1px solid var(--bd2)}

.rpg-empty{font-size:11.5px;color:var(--mu);font-style:italic;text-align:center;padding:20px 0}
#rpgfoot{padding:8px 15px;font-size:8.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mu);text-align:center;border-top:1px solid var(--bd2);background:var(--pan)}
</style>
</head>
<body>
<textarea id="rpgraw" style="display:none;position:absolute;left:-9999px">$1</textarea>
<div id="rpgwin">
  <div id="rpg-head">
    <div class="rpg-hd-row">
      <div id="rpg-avatar"><span id="rpg-avatar-glyph">🧙</span></div>
      <div class="rpg-hd-txt">
        <div id="rpg-name">Unnamed</div>
        <div id="rpg-class">— · — · Lv —</div>
      </div>
      <div class="rpg-hd-right">
        <div id="rpg-currency">— —</div>
        <div id="rpg-location-badge">—</div>
      </div>
    </div>
    <div id="rpg-xp-wrap">
      <div id="rpg-xp-track"><div id="rpg-xp-fill" style="width:0%"></div></div>
      <div id="rpg-xp-lbl"><span id="rpg-xp-txt">EXP 0/100</span><span id="rpg-xp-lvl">Lv 1</span></div>
    </div>
    <div id="rpg-chev">▲</div>
  </div>

  <div id="rpgbody">
    <div id="rpgtabs">
      <div class="rpgtab on" data-t="overview">Overview</div>
      <div class="rpgtab" data-t="world">World</div>
      <div class="rpgtab" data-t="relations">Relations</div>
      <div class="rpgtab" data-t="records">Records</div>
      <div class="rpgtab" data-t="map">Map</div>
    </div>

    <div class="rpgpane on" data-p="overview">
      <div class="rpg-sec">Identity</div>
      <div class="rpg-igrid" id="ov-idgrid"></div>
      <div class="rpg-sec mt">Standing</div>
      <div class="rpg-igrid" id="ov-standing"></div>
      <div class="rpg-sec mt">Current Objective</div>
      <div id="ov-mission"></div>
    </div>

    <div class="rpgpane" data-p="world">
      <div class="rpg-sec">Current Location</div>
      <div class="rpg-igrid" id="w-locgrid"></div>
      <div class="rpg-sec mt">Time & Season</div>
      <div class="rpg-igrid" id="w-timegrid"></div>
      <div id="w-note-wrap"></div>
    </div>

    <div class="rpgpane" data-p="relations">
      <div class="rpg-sec">Known Faces</div>
      <div id="rel-list"></div>
    </div>

    <div class="rpgpane nopad" data-p="records">
      <div style="padding:13px 0 0">
        <div id="rpg-rec-toolbar">
          <input type="text" id="rpg-rec-search" placeholder="Search records...">
          <select id="rpg-rec-filter"><option value="">All</option></select>
        </div>
        <div id="rpg-rec-count"></div>
        <div id="rpg-rec-list"></div>
        <div style="height:13px"></div>
      </div>
    </div>

    <div class="rpgpane nopad" data-p="map">
      <div id="rpg-map-wrap">
        <svg id="rpg-map-compass" viewBox="0 0 30 30" fill="none">
          <circle cx="15" cy="15" r="12" stroke="#C9922A" stroke-width="1"/>
          <path d="M15 4 L18 14 L15 15.5 L12 14 Z" fill="#EDE0C8"/>
          <text x="15" y="9" font-size="6" fill="#EDE0C8" text-anchor="middle" font-weight="700">N</text>
        </svg>
        <svg id="rpg-map-svg" viewBox="0 0 300 280">
          <g id="rpg-map-g"></g>
        </svg>
        <div id="rpg-map-controls">
          <div class="rpg-map-btn" id="map-zoom-in">+</div>
          <div class="rpg-map-btn" id="map-zoom-out">−</div>
          <div class="rpg-map-btn" id="map-center" title="Center on current location">◎</div>
        </div>
        <div id="rpg-map-current-lbl">—</div>
      </div>
    </div>

    <div id="rpgfoot">RPG Companion</div>
  </div>
</div>

<script>
(function(){
function g(id){return document.getElementById(id)}
function esc(v){if(v==null)return'';return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function pct(c,m){c=parseFloat(c);m=parseFloat(m);if(!(m>0))return 0;return Math.max(0,Math.min(100,Math.round(c/m*100)))}
function hexRgb(h){h=h||'#C9922A';try{return parseInt(h.slice(1,3),16)+','+parseInt(h.slice(3,5),16)+','+parseInt(h.slice(5,7),16)}catch(e){return '201,146,42'}}

var raw=g('rpgraw');var d=null;
if(raw&&raw.value.trim()){
  var dec=document.createElement('textarea');dec.innerHTML=raw.value.trim();
  try{d=JSON.parse(dec.value.trim())}catch(e){}
}
if(!d)d={};

var acc=d.charColor||'#C9922A';
var root=document.documentElement;
root.style.setProperty('--acc',acc);
var rgb=hexRgb(acc);
root.style.setProperty('--acc-rgb',rgb);
root.style.setProperty('--accd','rgba('+rgb+',.12)');
root.style.setProperty('--accb','rgba('+rgb+',.32)');

function riskColor(r){
  r=(r||'').toLowerCase();
  if(r==='low')return 'var(--safe)';
  if(r==='medium'||r==='moderate')return 'var(--warn)';
  if(r==='high'||r==='extreme')return 'var(--danger)';
  return 'var(--mu)';
}
function relColor(v){
  v=parseFloat(v)||0;
  if(v>=60)return 'var(--safe)';
  if(v>=30)return 'var(--warn)';
  return 'var(--danger)';
}
var TAG_COLORS={Economy:'var(--info)',NPC:'var(--warn)',Mystery:'#8A5FBF',War:'var(--danger)',Lore:'var(--acc)',Quest:'var(--safe)'};
function tagColor(t){return TAG_COLORS[t]||'var(--mu)'}

/* HEADER */
g('rpg-name').textContent=d.name||'Unnamed';
g('rpg-class').textContent=[d.class,d.race].filter(Boolean).join(' · ')+(d.level!=null?' · Lv '+d.level:'');
if(d.avatar){
  var img=document.createElement('img');
  img.src='https://files.catbox.moe/'+d.avatar;
  img.onerror=function(){this.style.display='none'};
  g('rpg-avatar').appendChild(img);
}
var cur=d.currency||{};
g('rpg-currency').textContent=(cur.label||'')+' '+(cur.amount!=null?cur.amount:0);
g('rpg-location-badge').textContent=d.location||'—';
var xp=d.xp||{cur:0,max:100};
g('rpg-xp-fill').style.width=pct(xp.cur,xp.max)+'%';
g('rpg-xp-txt').textContent='EXP '+esc(xp.cur)+'/'+esc(xp.max);
g('rpg-xp-lvl').textContent='Lv '+(d.level!=null?d.level:1);

/* OVERVIEW */
var ov=d.overview||{};
var idRows=[['Nickname',ov.nickname],['Language',ov.language],['Origin',ov.origin],['Race Detail',ov.raceDetail]];
g('ov-idgrid').innerHTML=idRows.map(function(r){return '<div class="rpg-icard"><div class="rpg-icard-l">'+esc(r[0])+'</div><div class="rpg-icard-v">'+esc(r[1]||'—')+'</div></div>';}).join('');
var stRows=[['MP Regen',ov.mpRegen],['Affiliation',ov.affiliation],['First Race',ov.firstRace],['Status',ov.status]];
g('ov-standing').innerHTML=stRows.map(function(r){return '<div class="rpg-icard"><div class="rpg-icard-l">'+esc(r[0])+'</div><div class="rpg-icard-v">'+esc(r[1]||'—')+'</div></div>';}).join('');

var mEl=g('ov-mission');
var mission=ov.mission;
if(mission&&mission.name){
  var rc=riskColor(mission.risk);
  mEl.innerHTML='<div class="rpg-mission-card">'+
    '<div class="rpg-mission-top"><span class="rpg-mission-nm">'+esc(mission.name)+'</span>'+
    (mission.risk?'<span class="rpg-risk" style="color:'+rc+';background:'+rc+'22;border:1px solid '+rc+'55">'+esc(mission.risk)+'</span>':'')+'</div>'+
    '<div class="rpg-prog-track"><div class="rpg-prog-fill" style="width:'+(mission.progress||0)+'%"></div></div>'+
    '<div class="rpg-mission-meta"><span>Progress '+(mission.progress||0)+'%</span><span>Followers: '+esc(mission.followers||'—')+'</span></div>'+
  '</div>';
}else{
  mEl.innerHTML='<div class="rpg-empty">No active objective.</div>';
}

/* WORLD */
var w=d.world||{};
var locRows=[['Location',w.location],['Area',w.area]];
g('w-locgrid').innerHTML=locRows.map(function(r){return '<div class="rpg-icard full"><div class="rpg-icard-l">'+esc(r[0])+'</div><div class="rpg-icard-v">'+esc(r[1]||'—')+'</div></div>';}).join('');
var timeRows=[['Day',w.day],['Time',w.time],['Season',w.season],['Weather',w.weather],['Year',w.year]];
g('w-timegrid').innerHTML=timeRows.map(function(r){return '<div class="rpg-icard"><div class="rpg-icard-l">'+esc(r[0])+'</div><div class="rpg-icard-v">'+esc(r[1]||'—')+'</div></div>';}).join('');
var noteEl=g('w-note-wrap');
noteEl.innerHTML=w.note?'<div class="rpg-sec mt">Notes</div><div class="rpg-note">'+esc(w.note)+'</div>':'';

/* RELATIONS */
var relEl=g('rel-list');
var npcs=d.npcs||[];
if(npcs.length){
  relEl.innerHTML=npcs.map(function(n){
    var col=relColor(n.closeness);
    var initial=(n.name||'?').trim().charAt(0).toUpperCase();
    var avatarInner=esc(initial)+(n.avatar?'<img src="https://files.catbox.moe/'+esc(n.avatar)+'" onerror="this.style.display=\'none\'">':'');
    return '<div class="rpg-npc-card">'+
      '<div class="rpg-npc-top"><div class="rpg-npc-avatar">'+avatarInner+'</div>'+
      '<div class="rpg-npc-nm">'+esc(n.name||'—')+'</div>'+
      (n.relation?'<span class="rpg-npc-rel" style="color:'+col+';background:'+col+'22;border:1px solid '+col+'55">'+esc(n.relation)+'</span>':'')+
      '</div>'+
      (n.closeness!=null?'<div class="rpg-npc-bar-track"><div class="rpg-npc-bar-fill" style="width:'+n.closeness+'%"></div></div>':'')+
      (n.note?'<div class="rpg-npc-note">'+esc(n.note)+'</div>':'')+
    '</div>';
  }).join('');
}else{
  relEl.innerHTML='<div class="rpg-empty">No NPCs recorded yet.</div>';
}

/* RECORDS (Aetheric Records) */
var records=d.records||[];
var recTags=[];
records.forEach(function(r){if(r.tag&&recTags.indexOf(r.tag)<0)recTags.push(r.tag)});
var filterEl=g('rpg-rec-filter');
recTags.forEach(function(t){
  var o=document.createElement('option');o.value=t;o.textContent=t;filterEl.appendChild(o);
});
var curSearch='',curFilter='';
function renderRecords(){
  var listEl=g('rpg-rec-list');
  var filtered=records.filter(function(r){
    var matchSearch=!curSearch||((r.title||'')+' '+(r.desc||'')).toLowerCase().indexOf(curSearch.toLowerCase())>=0;
    var matchFilter=!curFilter||r.tag===curFilter;
    return matchSearch&&matchFilter;
  });
  g('rpg-rec-count').textContent=filtered.length+' record'+(filtered.length===1?'':'s');
  if(filtered.length){
    listEl.innerHTML=filtered.map(function(r){
      var tc=tagColor(r.tag);
      return '<div class="rpg-rec-card">'+
        '<div class="rpg-rec-top"><span class="rpg-rec-ttl">'+esc(r.title||'—')+'</span>'+
        (r.tag?'<span class="rpg-rec-tag" style="color:'+tc+';background:'+tc+'22;border:1px solid '+tc+'55">'+esc(r.tag)+'</span>':'')+
        '</div>'+
        (r.desc?'<div class="rpg-rec-desc">'+esc(r.desc)+'</div>':'')+
      '</div>';
    }).join('');
  }else{
    listEl.innerHTML='<div class="rpg-empty">No records match.</div>';
  }
}
g('rpg-rec-search').addEventListener('input',function(){curSearch=this.value;renderRecords()});
filterEl.addEventListener('change',function(){curFilter=this.value;renderRecords()});
renderRecords();

/* MAP */
var mapData=d.map||{};
var nodes=mapData.nodes||[];
var edges=mapData.edges||[];
var mapScale=1,mapTx=0,mapTy=0;
var svgG=g('rpg-map-g');

function nodeById(id){for(var i=0;i<nodes.length;i++){if(nodes[i].id===id)return nodes[i]}return null}

function renderMap(){
  if(!nodes.length){
    svgG.innerHTML='';
    g('rpg-map-current-lbl').textContent='No map data yet';
    return;
  }
  var vbW=300,vbH=280;
  var h='';
  edges.forEach(function(e){
    var a=nodeById(e[0]),b=nodeById(e[1]);
    if(!a||!b)return;
    var ax=(a.x/100)*vbW,ay=(a.y/100)*vbH,bx=(b.x/100)*vbW,by=(b.y/100)*vbH;
    h+='<line class="rpg-map-edge" x1="'+ax+'" y1="'+ay+'" x2="'+bx+'" y2="'+by+'"/>';
  });
  nodes.forEach(function(n){
    var nx=(n.x/100)*vbW,ny=(n.y/100)*vbH;
    var cls=n.current?'current':(n.discovered?'discovered':'');
    var label=n.discovered||n.current?(n.name||'—'):'???';
    h+='<circle class="rpg-map-node-dot '+cls+'" cx="'+nx+'" cy="'+ny+'" r="'+(n.current?5:3.6)+'"/>';
    h+='<text class="rpg-map-node-lbl '+cls+'" x="'+nx+'" y="'+(ny-8)+'">'+esc(label)+'</text>';
  });
  svgG.innerHTML=h;
  var cur=nodes.find(function(n){return n.current});
  g('rpg-map-current-lbl').textContent=cur?('At: '+(cur.name||cur.id)):'Location unknown';
  applyMapTransform();
}
function applyMapTransform(){
  svgG.setAttribute('transform','translate('+mapTx+','+mapTy+') scale('+mapScale+')');
}
function centerOnCurrent(){
  var cur=nodes.find(function(n){return n.current});
  mapScale=1;
  if(cur){
    mapTx=(150-(cur.x/100)*300)*1;
    mapTy=(140-(cur.y/100)*280)*1;
  }else{
    mapTx=0;mapTy=0;
  }
  applyMapTransform();
}
g('map-zoom-in').addEventListener('click',function(){mapScale=Math.min(3,mapScale+.25);applyMapTransform()});
g('map-zoom-out').addEventListener('click',function(){mapScale=Math.max(.4,mapScale-.25);applyMapTransform()});
g('map-center').addEventListener('click',centerOnCurrent);

var mapWrap=g('rpg-map-wrap');
var dragging=false,dragStartX,dragStartY,dragOrigTx,dragOrigTy;
function mapDown(x,y){dragging=true;dragStartX=x;dragStartY=y;dragOrigTx=mapTx;dragOrigTy=mapTy;mapWrap.classList.add('grabbing')}
function mapMove(x,y){if(!dragging)return;mapTx=dragOrigTx+(x-dragStartX);mapTy=dragOrigTy+(y-dragStartY);applyMapTransform()}
function mapUp(){dragging=false;mapWrap.classList.remove('grabbing')}
mapWrap.addEventListener('mousedown',function(e){mapDown(e.clientX,e.clientY)});
window.addEventListener('mousemove',function(e){mapMove(e.clientX,e.clientY)});
window.addEventListener('mouseup',mapUp);
mapWrap.addEventListener('touchstart',function(e){var t=e.touches[0];mapDown(t.clientX,t.clientY)},{passive:true});
mapWrap.addEventListener('touchmove',function(e){var t=e.touches[0];mapMove(t.clientX,t.clientY)},{passive:true});
mapWrap.addEventListener('touchend',mapUp);
mapWrap.addEventListener('wheel',function(e){
  e.preventDefault();
  mapScale=Math.max(.4,Math.min(3,mapScale+(e.deltaY<0?.15:-.15)));
  applyMapTransform();
},{passive:false});

renderMap();
centerOnCurrent();

/* TABS + COLLAPSE */
document.querySelectorAll('.rpgtab').forEach(function(t){
  t.addEventListener('click',function(){
    var target=this.getAttribute('data-t');
    document.querySelectorAll('.rpgtab').forEach(function(x){x.classList.toggle('on',x===t)});
    document.querySelectorAll('.rpgpane').forEach(function(p){p.classList.toggle('on',p.getAttribute('data-p')===target)});
  });
});
var head=g('rpg-head');
if(head)head.addEventListener('click',function(e){
  g('rpgwin').classList.toggle('closed');
});
})();
</script>
