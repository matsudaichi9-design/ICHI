/* ── Render ── */
function render(){
  var pg=gel('fcc-prog'),ct=gel('fcc-ct'),ti=gel('fcc-t'),cn=gel('fcc-cn'),bk=gel('fcc-bk'),nx=gel('fcc-nx');
  if(!pg||!ct)return;
  pg.innerHTML=STEPS.map(function(s,i){
    var dc='fcc-dot'+(i===step?' act':'')+(i<step?' done':'');
    var lc='fcc-ln'+(i<step?' done':'');
    return '<div class="'+dc+'" onclick="'+U+'_go('+i+')">'
      +'<div class="fcc-di">'+s.i+'</div><div class="fcc-dl">'+s.t+'</div></div>'
      +(i<STEPS.length-1?'<div class="'+lc+'"></div>':'');
  }).join('');
  ti.textContent=STEPS[step].t;
  cn.textContent=(step+1)+' / '+STEPS.length;
  bk.style.visibility=step===0?'hidden':'visible';
  nx.textContent=step===STEPS.length-1?'✦ เสร็จสิ้น':'ถัดไป →';
  nx.className='fcc-btn fcc-next'+(step===STEPS.length-1?' fcc-fin':'');
  var pn=document.createElement('div');pn.className='fcc-pn';pn.innerHTML=shtml(step);
  ct.innerHTML='';ct.appendChild(pn);bindStep(step);
}

/* ── Character Sheet Generator ── */
function gen(){
  var b=C.b,cl=C.cl,mg=C.mg,st=C.st,bg=C.bg,eq=C.eq;
  var race=RACES.find(function(r){return r.id===b.race;});
  var cls=CLASSES.find(function(c){return c.id===cl.id;});
  var affs=mg.aff.map(function(id){var a=AFFS.find(function(x){return x.id===id;});return a?a.n:id;});
  function pad(n){return n<10?'  '+n:n<100?' '+n:''+n;}
  var s='';
  s+='═══════════════════════════════════════════════\n';
  s+='   【キャラクターシート / Character Sheet】\n';
  s+='         ✦ '+(b.name||'(ยังไม่ได้ตั้งชื่อ)')+' ✦\n';
  s+='═══════════════════════════════════════════════\n\n';
  s+='■ 基本情報 / Basic Info\n';
  s+='  Name       : '+(b.name||'—')+'\n';
  s+='  Age        : '+(b.age||'—')+'\n';
  s+='  Gender     : '+(b.gender||'—')+'\n';
  s+='  Race       : '+(race?race.n:b.race||'—')+'\n';
  s+='  Height     : '+(b.ht||'—')+'\n';
  s+='  Eyes       : '+(b.eye||'—')+'\n';
  s+='  Hair       : '+(b.hair||'—')+'\n';
  if(b.ap)s+='  Appearance :\n  '+b.ap.replace(/\n/g,'\n  ')+'\n';
  s+='\n■ クラス / Class & Rank\n';
  s+='  Class      : '+(cls?cls.n:cl.id||'—')+'\n';
  s+='  Subclass   : '+(cl.sub||'—')+'\n';
  s+='  Rank       : '+(cl.rk||'—')+'\n';
  s+='  Guild      : '+(cl.guild||'—')+'\n';
  s+='  Level      : '+cl.lv+'\n';
  s+='\n■ 魔法・能力 / Magic & Abilities\n';
  s+='  Affinity   : '+(affs.length?affs.join(', '):'—')+'\n';
  s+='  Mana Pool  : '+mg.mana+'\n';
  if(mg.spells.length){s+='\n  【Signature Spells】\n';mg.spells.forEach(function(sp,i){s+='  '+(i+1)+'. '+(sp.name||'?')+' ['+sp.level+']\n';if(sp.desc)s+='     └ '+sp.desc+'\n';});}
  if(mg.uniq)s+='\n  【Unique Ability】\n  '+mg.uniq.replace(/\n/g,'\n  ')+'\n';
  if(C.sk.length){s+='\n■ スキル / Skills\n';C.sk.forEach(function(sk){s+='  • '+sk+'\n';});}
  s+='\n■ ステータス / Stats\n';
  s+='  STR '+pad(st.STR)+'  INT '+pad(st.INT)+'  WIS '+pad(st.WIS)+'\n';
  s+='  DEX '+pad(st.DEX)+'  CON '+pad(st.CON)+'  CHA '+pad(st.CHA)+'\n';
  s+='  HP: '+hp()+'  MP: '+mp()+'  Speed: '+spd()+'\n';
  if(race&&Object.keys(race.sb).length){var bn=Object.entries(race.sb).map(function(kv){return kv[0]+(kv[1]>0?'+':'')+kv[1];}).join(' ');s+='  (Racial Bonus: '+bn+')\n';}
  s+='\n■ 性格・背景 / Personality & Background\n';
  if(bg.pers.length)s+='  Personality: '+bg.pers.join('・')+'\n';
  if(bg.orig)s+='  Origin     : '+bg.orig+'\n';
  if(bg.goals)s+='  Goals      : '+bg.goals+'\n';
  if(bg.fears)s+='  Fears      : '+bg.fears+'\n';
  if(bg.story)s+='\n  【Backstory】\n  '+bg.story.replace(/\n/g,'\n  ')+'\n';
  if(C.rl.length){s+='\n■ 人間関係 / Relationships\n';C.rl.forEach(function(r,i){if(!r.name&&!r.type)return;s+='  '+(i+1)+'. '+(r.name||'?')+' ['+(r.type||'—')+']\n';if(r.desc)s+='     └ '+r.desc+'\n';});}
  s+='\n■ 装備 / Equipment\n';
  if(eq.w1)s+='  Primary    : '+eq.w1+'\n';if(eq.w2)s+='  Secondary  : '+eq.w2+'\n';
  if(eq.ar)s+='  Armor      : '+eq.ar+'\n';if(eq.st2)s+='  Staff      : '+eq.st2+'\n';
  if(eq.ac)s+='  Accessories: '+eq.ac+'\n';if(eq.sp)s+='  Special    : '+eq.sp+'\n';
  s+='\n═══════════════════════════════════════════════\n';
  s+='Generated by Frieren RPG Character Creator\n';
  s+='葬送のフリーレン — Beyond Journey\'s End\n';
  s+='═══════════════════════════════════════════════';
  return s;
}
