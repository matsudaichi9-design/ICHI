<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;font-family:'Spectral',serif;font-size:13.5px}
:root{
  --acc:#8B5FBF;--acc-rgb:139,95,191;--accd:rgba(139,95,191,.15);--accb:rgba(139,95,191,.45);
  --gold:#C9A84C;--spirit:#8FD8D0;
  --bg:#08060F;--pan:#120E1E;--pan2:#1A1430;--pan3:#241C3E;
  --tx:#E9E2F5;--tx2:#9A8FBF;--mu:#524C78;
  --bd:rgba(201,168,76,.22);--bd2:rgba(255,255,255,.05);
  --r:8px;--r2:4px;--fh:'Cinzel Decorative',serif;
}
#dfwrap{max-width:480px;margin:8px auto;position:relative}
#df{position:relative;background:linear-gradient(170deg,var(--pan) 0%,var(--bg) 100%);border:1px solid var(--bd);
  border-radius:var(--r);overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.7),inset 0 0 0 1px rgba(201,168,76,.05);
  animation:dfi .3s ease both}
@keyframes dfi{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
#df::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(1.4px 1.4px at 10% 14%,rgba(233,226,245,.85),transparent),
    radial-gradient(1px 1px at 26% 58%,rgba(233,226,245,.55),transparent),
    radial-gradient(1.6px 1.6px at 44% 9%,rgba(233,226,245,.75),transparent),
    radial-gradient(1px 1px at 61% 38%,rgba(233,226,245,.45),transparent),
    radial-gradient(1.3px 1.3px at 76% 16%,rgba(233,226,245,.8),transparent),
    radial-gradient(1px 1px at 86% 50%,rgba(233,226,245,.5),transparent),
    radial-gradient(1.5px 1.5px at 18% 78%,rgba(233,226,245,.65),transparent),
    radial-gradient(1px 1px at 52% 85%,rgba(233,226,245,.45),transparent),
    radial-gradient(1.2px 1.2px at 91% 80%,rgba(233,226,245,.6),transparent);
  animation:dftwinkle 5.5s ease-in-out infinite}
@keyframes dftwinkle{0%,100%{opacity:.5}50%{opacity:1}}
.df-corner{position:absolute;width:32px;height:32px;z-index:2;opacity:.85;pointer-events:none}
.df-corner.tl{top:6px;left:6px}
.df-corner.tr{top:6px;right:6px;transform:scaleX(-1)}
.df-corner.bl{bottom:6px;left:6px;transform:scaleY(-1)}
.df-corner.br{bottom:6px;right:6px;transform:scale(-1,-1)}

/* HEADER */
#df-head{position:relative;z-index:1;padding:20px 24px 16px;border-bottom:1px solid var(--bd);cursor:pointer;user-select:none}
.df-hd-row{display:flex;align-items:center;gap:14px}
#df-avatar{position:relative;width:54px;height:54px;flex-shrink:0;border-radius:50%;overflow:hidden;
  background:radial-gradient(circle at 35% 30%,#241a3a,#08060F);border:1.5px solid var(--accb);
  box-shadow:0 0 18px -3px var(--acc);display:flex;align-items:center;justify-content:center}
#df-avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}
.df-hd-txt{flex:1;min-width:0;padding-right:58px}
#df-name{font-family:var(--fh);font-size:17px;letter-spacing:.8px;color:var(--tx);line-height:1.2;
  text-shadow:0 0 14px rgba(139,95,191,.4)}
#df-alias{font-size:11px;font-style:italic;color:var(--tx2);margin-top:4px}
#df-tier-badge{display:inline-block;margin-top:7px;font-family:var(--fh);font-size:8.5px;letter-spacing:.8px;
  padding:4px 9px;border-radius:99px;white-space:nowrap}
#df-chev{position:absolute;bottom:-2px;right:24px;font-size:9px;color:var(--mu);transition:transform .3s}
#dfwrap.closed #df-chev{transform:rotate(180deg)}
#dfbody{max-height:2800px;overflow:hidden;transition:max-height .35s ease}
#dfwrap.closed #dfbody{max-height:0}

/* ASTRAL SEAL (replaces ink stamp) */
#df-seal{position:absolute;top:14px;right:16px;width:56px;height:56px;z-index:2;pointer-events:none;
  animation:dfsealspin 40s linear infinite}
@keyframes dfsealspin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

.df-body-inner{position:relative;z-index:1;padding:19px 24px 6px}
.df-sec{display:flex;align-items:center;gap:9px;margin:0 0 13px}
.df-sec:not(:first-child){margin-top:20px}
.df-sec .dots{display:flex;gap:3px;flex-shrink:0}
.df-sec .dots i{width:3px;height:3px;border-radius:50%;background:var(--gold);display:block}
.df-sec .dots i:nth-child(2){width:4px;height:4px;margin-top:-.5px}
.df-sec .t{font-family:var(--fh);font-size:10.5px;letter-spacing:2px;color:var(--gold);text-transform:uppercase}
.df-sec .ln{flex:1;height:1px;background:linear-gradient(90deg,var(--bd),transparent)}

.df-igrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.df-icard{background:var(--pan2);border:1px solid var(--bd2);border-radius:var(--r2);padding:8px 9px}
.df-icard-l{font-family:var(--fh);font-size:7.5px;letter-spacing:1px;color:var(--mu);text-transform:uppercase;margin-bottom:4px}
.df-icard-v{font-size:12px;color:var(--tx);line-height:1.35}

/* STANDING */
#df-tier-plate{background:var(--pan2);border:1px solid var(--bd);border-radius:var(--r2);padding:12px 14px;margin-bottom:14px;
  display:flex;align-items:center;gap:12px}
#df-tier-ic{width:15px;height:15px;flex-shrink:0}
#df-tier-nm{font-family:var(--fh);font-size:11.5px;letter-spacing:.6px;color:var(--tx)}
#df-tier-ds{font-size:10px;color:var(--tx2);margin-top:2px;line-height:1.4}

/* ASCENSION LADDER (read-only display) */
#df-ladder-wrap{display:flex;gap:16px;align-items:flex-start;padding:16px 14px;background:var(--pan2);
  border:1px solid var(--bd);border-radius:6px}
#df-ladder-rail{display:flex;flex-direction:column-reverse;align-items:center;flex-shrink:0;padding:2px 0}
.df-lnode{width:8px;height:8px;border-radius:50%;background:var(--pan3);border:1px solid var(--bd)}
.df-lnode.on{width:15px;height:15px;background:var(--acc);border-color:var(--tx);box-shadow:0 0 12px 1px var(--acc)}
.df-lseg{width:1px;height:10px;background:linear-gradient(180deg,var(--bd),var(--acc))}
#df-seq{font-family:var(--fh);font-size:15px;color:var(--acc);text-shadow:0 0 10px var(--accb)}
#df-path-nm{font-family:var(--fh);font-size:14px;letter-spacing:1px;color:var(--tx);margin-top:3px}
#df-seq-title{font-size:10.5px;font-style:italic;color:var(--gold);margin-top:3px}

.df-note{font-size:12px;color:var(--tx2);font-style:italic;line-height:1.65;background:var(--pan2);
  border-left:2px solid var(--acc);border-radius:0 var(--r2) var(--r2) 0;padding:10px 13px;margin-bottom:10px}

.df-tags{display:flex;flex-wrap:wrap;gap:6px}
.df-tag{font-size:11px;color:var(--tx);background:var(--pan2);border:1px solid var(--bd);border-radius:2px;
  padding:3px 10px;font-style:italic}

.df-empty{font-size:11px;color:var(--mu);font-style:italic;text-align:center;padding:12px 0}

/* ASTRAL DIALS (read-only) */
.df-dial-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px;justify-items:center}
.df-dial-unit{display:flex;flex-direction:column;align-items:center;width:100%}
.df-dial-ring{position:relative;width:48px;height:48px}
.df-dial-ring svg{width:48px;height:48px;transform:rotate(-90deg)}
.df-dtrack{fill:none;stroke:var(--pan3);stroke-width:4}
.df-dfill{fill:none;stroke:var(--acc);stroke-width:4;stroke-linecap:round;filter:drop-shadow(0 0 3px var(--acc))}
.df-dval{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-size:11px;color:var(--tx)}
.df-dlbl{font-family:var(--fh);font-size:6.7px;letter-spacing:.3px;color:var(--tx2);text-transform:uppercase;text-align:center;margin-top:7px;line-height:1.3;min-height:16px}

#dffoot{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:13px 24px;font-size:9.5px;letter-spacing:.5px;color:var(--mu);border-top:1px solid var(--bd2);background:rgba(0,0,0,.24)}
#dffoot .mid{font-family:var(--fh);text-transform:uppercase;letter-spacing:2px;color:var(--tx2);font-style:normal}
</style>
</head>
<body>
<textarea id="dfraw" style="display:none;position:absolute;left:-9999px">$1</textarea>
<div id="dfwrap"><div id="df">
  <svg class="df-corner tl" viewBox="0 0 32 32" fill="none"><path d="M2 30 Q2 2 30 2 M2 19 Q2 8 11 8 M8 30 Q8 21 19 21" stroke="#C9A84C" stroke-width="1"/><circle cx="2" cy="30" r="1.3" fill="#C9A84C"/></svg>
  <svg class="df-corner tr" viewBox="0 0 32 32" fill="none"><path d="M2 30 Q2 2 30 2 M2 19 Q2 8 11 8 M8 30 Q8 21 19 21" stroke="#C9A84C" stroke-width="1"/><circle cx="2" cy="30" r="1.3" fill="#C9A84C"/></svg>
  <svg class="df-corner bl" viewBox="0 0 32 32" fill="none"><path d="M2 30 Q2 2 30 2 M2 19 Q2 8 11 8 M8 30 Q8 21 19 21" stroke="#C9A84C" stroke-width="1"/><circle cx="2" cy="30" r="1.3" fill="#C9A84C"/></svg>
  <svg class="df-corner br" viewBox="0 0 32 32" fill="none"><path d="M2 30 Q2 2 30 2 M2 19 Q2 8 11 8 M8 30 Q8 21 19 21" stroke="#C9A84C" stroke-width="1"/><circle cx="2" cy="30" r="1.3" fill="#C9A84C"/></svg>

  <div id="df-head">
    <svg id="df-seal" viewBox="0 0 56 56" fill="none">
      <circle cx="28" cy="28" r="25" stroke="#C9A84C" stroke-width=".7" opacity=".55"/>
      <circle cx="28" cy="28" r="19" stroke="#8B5FBF" stroke-width=".6" opacity=".7"/>
      <path d="M28 8 L31 22 L45 25 L31 28 L28 42 L25 28 L11 25 L25 22 Z" fill="none" stroke="#C9A0F0" stroke-width="1"/>
      <circle cx="28" cy="28" r="2.6" fill="#F0E8FF"/>
    </svg>
    <div class="df-hd-row">
      <div id="df-avatar"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="9" r="4" stroke="#8B5FBF" stroke-width="1.3"/><path d="M5 21 C5 16 8 14 12 14 C16 14 19 16 19 21" stroke="#8B5FBF" stroke-width="1.3"/></svg></div>
      <div class="df-hd-txt">
        <div id="df-name">Unnamed</div>
        <div id="df-alias"></div>
        <div id="df-tier-badge">&mdash;</div>
      </div>
    </div>
    <div id="df-chev">&#9650;</div>
  </div>

  <div id="dfbody">
    <div class="df-body-inner">
      <div class="df-sec"><span class="dots"><i></i><i></i><i></i></span><span class="t">Particulars</span><span class="ln"></span></div>
      <div class="df-igrid">
        <div class="df-icard"><div class="df-icard-l">Age</div><div class="df-icard-v" id="f-age">&mdash;</div></div>
        <div class="df-icard"><div class="df-icard-l">Origin</div><div class="df-icard-v" id="f-origin">&mdash;</div></div>
        <div class="df-icard"><div class="df-icard-l">Occupation</div><div class="df-icard-v" id="f-occ">&mdash;</div></div>
      </div>

      <div class="df-sec"><span class="dots"><i></i><i></i><i></i></span><span class="t">Ascension</span><span class="ln"></span></div>
      <div id="df-tier-plate">
        <svg id="df-tier-ic" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="6" stroke="#8B5FBF" stroke-width="1.1"/><circle cx="7.5" cy="7.5" r="1.7" fill="#8B5FBF"/></svg>
        <div><div id="df-tier-nm">&mdash;</div><div id="df-tier-ds"></div></div>
      </div>
      <div id="df-ladder-wrap">
        <div id="df-ladder-rail"></div>
        <div>
          <div id="df-seq">&mdash;</div>
          <div id="df-path-nm">&mdash;</div>
          <div id="df-seq-title"></div>
        </div>
      </div>

      <div id="spirit-wrap"></div>
      <div id="ties-wrap"></div>
      <div id="persona-wrap"></div>
      <div id="scene-wrap"></div>

      <div class="df-sec"><span class="dots"><i></i><i></i><i></i></span><span class="t">Vital Measures</span><span class="ln"></span></div>
      <div class="df-dial-grid" id="vitals-grid"></div>
    </div>

    <div id="dffoot"><span id="foot-file">File &mdash;</span><span class="mid">Astral Ledger</span><span id="foot-seq">&mdash;</span></div>
  </div>
</div></div>

<script>
(function(){
function g(id){return document.getElementById(id)}
function esc(v){if(v==null)return'';return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function hexRgb(h){h=h||'#8B5FBF';try{return parseInt(h.slice(1,3),16)+','+parseInt(h.slice(3,5),16)+','+parseInt(h.slice(5,7),16)}catch(e){return '139,95,191'}}

var raw=g('dfraw');var d=null;
if(raw&&raw.value.trim()){
  var dec=document.createElement('textarea');dec.innerHTML=raw.value.trim();
  try{d=JSON.parse(dec.value.trim())}catch(e){}
}
if(!d)d={};

var acc=d.charColor||'#8B5FBF';
var root=document.documentElement;
root.style.setProperty('--acc',acc);
var rgb=hexRgb(acc);
root.style.setProperty('--acc-rgb',rgb);
root.style.setProperty('--accd','rgba('+rgb+',.15)');
root.style.setProperty('--accb','rgba('+rgb+',.45)');

var TIER_INFO={
  'Mortal':{color:'#7A7A94',desc:'No power of their own — yet. The Beyonder world is a rumor glimpsed, not entered.'},
  'Free Beyonder':{color:'#8B5FBF',desc:'A Sequence 9 sorcerer operating alone, unclaimed by Church or cult — the black market only.'},
  'Church Unit':{color:'#C9A84C',desc:'A Sequence 9 sorcerer bound to a local Church branch — duties and protection both apply.'},
  'Cult Member':{color:'#C4568C',desc:'A Sequence 9 sorcerer affiliated with an underground cult — power bought at a rising risk.'}
};

/* HEADER */
g('df-name').textContent=d.name||'Unnamed';
g('df-alias').textContent=d.alias?'also known as "'+d.alias+'"':'';
if(d.avatar){
  var img=document.createElement('img');
  img.src='https://files.catbox.moe/'+d.avatar;
  img.onerror=function(){this.style.display='none'};
  g('df-avatar').appendChild(img);
}
var tier=d.tier||'';
var tierInfo=TIER_INFO[tier];
var tb=g('df-tier-badge');
if(tierInfo){
  tb.textContent=tier;
  tb.style.color=tierInfo.color;
  tb.style.background=tierInfo.color+'22';
  tb.style.border='1px solid '+tierInfo.color+'66';
}else{
  tb.textContent='Unregistered';
  tb.style.color='var(--mu)';
  tb.style.border='1px solid var(--bd2)';
}

/* PARTICULARS */
g('f-age').textContent=d.age!=null&&d.age!==''?d.age:'—';
g('f-origin').textContent=d.origin||'—';
g('f-occ').textContent=d.occupation||'—';

/* STANDING */
if(tierInfo){
  g('df-tier-nm').textContent=tier;
  g('df-tier-ds').textContent=tierInfo.desc;
}else{
  g('df-tier-nm').textContent='Unregistered';
  g('df-tier-ds').textContent='No standing has yet been declared.';
}
var seq=d.sequence!=null&&d.sequence!==''?parseInt(d.sequence,10):null;
g('df-seq').textContent=(d.pathway&&seq!=null)?('Sequence '+seq):'—';
g('df-path-nm').textContent=d.pathway||'No Pathway';
g('df-seq-title').textContent=d.sequenceTitle||'';

var rail=g('df-ladder-rail');
var lh='';
var activeSeq=(seq!=null?seq:-1);
for(var s=0;s<=9;s++){
  lh+='<div class="df-lnode'+(s===activeSeq?' on':'')+'"></div>';
  if(s<9)lh+='<div class="df-lseg"></div>';
}
rail.innerHTML=lh;

/* SPIRITUAL BODY */
var sb=d.spiritualBody||{};
function noteBlock(val){return val?('<div class="df-note">'+esc(val)+'</div>'):'';}
var spiritHtml='<div class="df-sec"><span class="dots"><i></i><i></i><i></i></span><span class="t">Spiritual Body</span><span class="ln"></span></div>';
spiritHtml+=noteBlock(sb.quality)||'<div class="df-empty">Quality not yet assessed.</div>';
if(sb.characteristic){spiritHtml+=noteBlock(sb.characteristic);}
if(sb.potionOrigin){spiritHtml+=noteBlock(sb.potionOrigin);}
g('spirit-wrap').innerHTML=spiritHtml;

/* TIES */
var af=d.affiliation||{};
var tiesHtml='<div class="df-sec"><span class="dots"><i></i><i></i><i></i></span><span class="t">Ties</span><span class="ln"></span></div>';
tiesHtml+='<div class="df-igrid" style="grid-template-columns:1fr 1fr">'+
  '<div class="df-icard"><div class="df-icard-l">Affiliation</div><div class="df-icard-v">'+esc(af.org||'None — walks alone')+'</div></div>'+
  '<div class="df-icard"><div class="df-icard-l">Mentor</div><div class="df-icard-v">'+esc(af.mentor||'—')+'</div></div>'+
'</div>';
var aliases=af.secretAliases||[];
if(aliases.length){
  tiesHtml+='<div style="margin-top:9px" class="df-tags">'+aliases.map(function(a){return '<span class="df-tag">'+esc(a)+'</span>';}).join('')+'</div>';
}
g('ties-wrap').innerHTML=tiesHtml;

/* PERSONA */
var personaHtml='';
if(d.appearance||d.nature||d.history){
  personaHtml+='<div class="df-sec"><span class="dots"><i></i><i></i><i></i></span><span class="t">Persona</span><span class="ln"></span></div>';
  personaHtml+=noteBlock(d.appearance);
  personaHtml+=noteBlock(d.nature);
  personaHtml+=noteBlock(d.history);
}
g('persona-wrap').innerHTML=personaHtml;

g('scene-wrap').innerHTML=d.openingScene?
  ('<div class="df-sec"><span class="dots"><i></i><i></i><i></i></span><span class="t">Opening Scene</span><span class="ln"></span></div><div class="df-note">'+esc(d.openingScene)+'</div>')
  :'';

/* VITALS */
var STATS=[
  ['spiritualResilience','Spirit. Resilience'],['reasoning','Reasoning'],['willpower','Willpower'],
  ['combat','Combat'],['occultKnowledge','Occult Know.'],['guile','Guile'],['resources','Resources']
];
var stats=d.stats||{};
var R=20,CIRC=2*Math.PI*R;
g('vitals-grid').innerHTML=STATS.map(function(s){
  var v=parseInt(stats[s[0]],10);if(isNaN(v))v=10;
  v=Math.max(0,Math.min(100,v));
  var off=CIRC-(v/100)*CIRC;
  return '<div class="df-dial-unit"><div class="df-dial-ring"><svg viewBox="0 0 48 48">'+
    '<circle class="df-dtrack" cx="24" cy="24" r="'+R+'"/>'+
    '<circle class="df-dfill" cx="24" cy="24" r="'+R+'" stroke-dasharray="'+CIRC+'" stroke-dashoffset="'+off+'"/></svg>'+
    '<div class="df-dval">'+v+'</div></div>'+
    '<div class="df-dlbl">'+s[1]+'</div></div>';
}).join('');

/* FOOTER */
g('foot-file').textContent='File — '+(d.name?d.name.split(' ')[0]:'Unnamed');
g('foot-seq').textContent=d.pathway?(d.pathway+' Seq.'+(seq!=null?seq:9)):'Unregistered';

/* COLLAPSE */
var head=g('df-head');
if(head)head.addEventListener('click',function(){g('dfwrap').classList.toggle('closed')});
})();
</script>
</body>
</html>
