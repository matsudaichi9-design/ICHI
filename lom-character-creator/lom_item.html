<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Noto+Serif+Thai:wght@400;500;600;700&family=Chonburi&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;font-family:'Spectral','Noto Serif Thai',serif;font-size:13.5px}
:root{
  --acc:#8B5FBF;--acc-rgb:139,95,191;--accd:rgba(139,95,191,.15);--accb:rgba(139,95,191,.45);
  --gold:#C0A050;--spirit:#7CC9C0;--seqc:#8B5FBF;
  --bg:#030207;--pan:#0D0916;--pan2:#150F26;--pan3:#1E1633;
  --tx:#E4DCF2;--tx2:#8F84B8;--mu:#463F6A;
  --bd:rgba(192,160,80,.2);--bd2:rgba(255,255,255,.04);
  --r:10px;--r2:4px;--fh:'Cinzel Decorative',serif;--fth:'Chonburi','Noto Serif Thai',serif;
}
@keyframes acspin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
#iawrap{max-width:440px;margin:12px auto;position:relative}
#iawrap::before{content:'';position:absolute;inset:0;z-index:0;border-radius:var(--r);pointer-events:none;
  box-shadow:0 0 0 1px var(--accb),0 0 26px 3px rgba(139,95,191,.4),0 0 48px 9px rgba(192,160,80,.15),0 0 68px 12px rgba(124,201,192,.08);
  animation:iaaura 3.4s ease-in-out infinite}
@keyframes iaaura{0%,100%{opacity:.75}50%{opacity:1}}
#ia{position:relative;z-index:1;background:
    radial-gradient(ellipse 140% 60% at 50% -10%,rgba(139,95,191,.22),transparent 60%),
    radial-gradient(ellipse 100% 60% at 50% 108%,rgba(0,0,0,.5),transparent 60%),
    linear-gradient(170deg,var(--pan) 0%,var(--bg) 100%);
  border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;
  box-shadow:0 26px 76px rgba(0,0,0,.82),inset 0 0 0 1px rgba(192,160,80,.05),inset 0 0 60px rgba(0,0,0,.5);
  animation:iai .4s cubic-bezier(.2,.8,.3,1.2) both}
@keyframes iai{from{opacity:0;transform:translateY(-10px) scale(.97)}to{opacity:1;transform:none}}
#ia-nebula{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.55;filter:blur(8px);
  background:
    radial-gradient(ellipse 60% 40% at 50% 0%,rgba(139,95,191,.28),transparent 70%),
    radial-gradient(ellipse 46% 30% at 90% 90%,rgba(124,201,192,.12),transparent 70%),
    radial-gradient(ellipse 55% 40% at 6% 90%,rgba(192,160,80,.12),transparent 70%)}
#ia::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(1.4px 1.4px at 12% 18%,rgba(228,220,242,.8),transparent),
    radial-gradient(1px 1px at 28% 62%,rgba(228,220,242,.5),transparent),
    radial-gradient(1.6px 1.6px at 46% 12%,rgba(228,220,242,.7),transparent),
    radial-gradient(1px 1px at 63% 44%,rgba(228,220,242,.4),transparent),
    radial-gradient(1.3px 1.3px at 78% 22%,rgba(228,220,242,.75),transparent),
    radial-gradient(1px 1px at 88% 58%,rgba(228,220,242,.45),transparent),
    radial-gradient(1.5px 1.5px at 20% 82%,rgba(228,220,242,.6),transparent),
    radial-gradient(1px 1px at 55% 88%,rgba(228,220,242,.4),transparent),
    radial-gradient(1.2px 1.2px at 92% 84%,rgba(228,220,242,.55),transparent);
  animation:iatwinkle 4.5s ease-in-out infinite}
@keyframes iatwinkle{0%,100%{opacity:.4}50%{opacity:.95}}
.ia-ember{position:absolute;width:2.4px;height:2.4px;border-radius:50%;background:var(--gold);
  box-shadow:0 0 7px 1.6px var(--gold);opacity:0;pointer-events:none;z-index:1;bottom:8%;animation:iaember 6s ease-in infinite}
.ia-ember.v{background:var(--spirit);box-shadow:0 0 7px 1.6px var(--spirit)}
@keyframes iaember{0%{opacity:0;transform:translate(0,0)}8%{opacity:.9}75%{opacity:.45}100%{opacity:0;transform:translate(var(--ex,10px),-280px)}}
.ia-corner{position:absolute;width:40px;height:40px;z-index:2;opacity:.9;pointer-events:none}
.ia-corner.tl{top:7px;left:7px}
.ia-corner.tr{top:7px;right:7px;transform:scaleX(-1)}
.ia-corner.bl{bottom:7px;left:7px;transform:scaleY(-1)}
.ia-corner.br{bottom:7px;right:7px;transform:scale(-1,-1)}

#ia-lang{position:absolute;top:12px;right:13px;z-index:3;display:flex;background:rgba(0,0,0,.4);
  border:1px solid var(--bd);border-radius:99px;padding:2px;gap:1px}
#ia-lang b{font-family:var(--fh);font-size:8px;letter-spacing:.4px;padding:4px 7px;border-radius:99px;
  color:var(--mu);cursor:pointer;font-weight:700;transition:all .2s}
#ia-lang b.on{color:#F5F0FF;background:linear-gradient(135deg,var(--acc),#5A3E8A);box-shadow:0 0 10px -2px var(--acc)}

#ia-head{position:relative;z-index:1;padding:22px 24px 4px;text-align:center;cursor:pointer;user-select:none}
#ia-eyebrow{font-family:var(--fh);font-size:9px;letter-spacing:3px;color:var(--tx2);text-transform:uppercase}
[lang-mode="th"] #ia-eyebrow{font-family:'Noto Serif Thai',serif;font-size:10.5px;letter-spacing:1px}
#ia-title{font-size:19px;letter-spacing:1.6px;margin-top:6px;position:relative;
  background:linear-gradient(100deg,var(--tx) 15%,#F3E4FF 32%,var(--gold) 50%,#F3E4FF 68%,var(--tx) 85%);
  background-size:260% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:iashimmer 6s linear infinite;filter:drop-shadow(0 0 16px rgba(139,95,191,.55))}
#ia-title[lang-mode="en"]{font-family:var(--fh)}
#ia-title[lang-mode="th"]{font-family:var(--fth);font-size:17px;letter-spacing:.5px}
@keyframes iashimmer{0%{background-position:0% center}100%{background-position:260% center}}
#ia-subtitle{font-size:10.5px;font-style:italic;color:var(--tx2);margin-top:5px}
[lang-mode="th"] #ia-subtitle{font-family:'Noto Serif Thai',serif;font-style:normal}
#ia-chev{position:absolute;bottom:2px;right:24px;font-size:9px;color:var(--mu);transition:transform .3s}
#iawrap.closed #ia-chev{transform:rotate(180deg)}
#iabody{max-height:1400px;overflow:hidden;transition:max-height .35s ease}
#iawrap.closed #iabody{max-height:0}

/* ITEM CENTERPIECE */
#ia-center{position:relative;padding:18px 24px 6px;display:flex;flex-direction:column;align-items:center}
#ia-frame-wrap{position:relative;width:90px;height:90px}
#ia-frame-bg{position:absolute;inset:0;clip-path:polygon(50% 3%,91% 26%,91% 74%,50% 97%,9% 74%,9% 26%);
  background:radial-gradient(circle at 35% 28%,#2a1f45,#0D0916 75%)}
#ia-frame-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;
  clip-path:polygon(50% 3%,91% 26%,91% 74%,50% 97%,9% 74%,9% 26%)}
#ia-gem{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#ia-frame-border{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
@keyframes iaframeglow{0%,100%{filter:drop-shadow(0 0 6px var(--seqc))}50%{filter:drop-shadow(0 0 13px var(--seqc))}}
#ia-frame-border polygon{animation:iaframeglow 2.6s ease-in-out infinite}
#ia-seq-badge{position:absolute;bottom:-6px;right:-6px;width:30px;height:30px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#2a1f45,var(--seqc) 140%);border:1.5px solid #F0E8FF;
  display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-size:12px;color:#F5F0FF;
  box-shadow:0 0 14px -1px var(--seqc);z-index:2}
#ia-name{font-size:17px;letter-spacing:.8px;margin-top:14px;text-align:center;color:var(--tx)}
#ia-name[lang-mode-x]{}
[lang-mode="th"] #ia-name{font-family:'Noto Serif Thai',serif;font-weight:700}
#ia-name:not([data-th-active]){font-family:var(--fh)}
#ia-category{display:inline-block;margin-top:8px;font-family:var(--fh);font-size:9px;letter-spacing:1px;
  padding:4px 11px;border-radius:99px;color:var(--gold);background:rgba(192,160,80,.12);border:1px solid rgba(192,160,80,.4)}
[lang-mode="th"] #ia-category{font-family:'Noto Serif Thai',serif;font-size:10.5px;letter-spacing:.2px}
#ia-seq-lbl{font-size:9px;color:var(--tx2);margin-top:7px;letter-spacing:.4px}
[lang-mode="th"] #ia-seq-lbl{font-family:'Noto Serif Thai',serif}

.ia-body-inner{position:relative;z-index:1;padding:16px 24px 6px}
.ia-sec{display:flex;align-items:center;gap:8px;margin:0 0 11px}
.ia-sec:not(:first-child){margin-top:18px}
.ia-sec svg{flex-shrink:0}
.ia-sec .t{font-family:var(--fh);font-size:10px;letter-spacing:2px;color:var(--gold);text-transform:uppercase}
[lang-mode="th"] .ia-sec .t{font-family:'Noto Serif Thai',serif;font-size:11.5px;letter-spacing:.3px}
.ia-sec .ln{flex:1;height:1px;background:linear-gradient(90deg,var(--bd),transparent)}
.ia-note{font-size:12px;color:var(--tx2);font-style:italic;line-height:1.65;background:var(--pan2);
  border-left:2px solid var(--seqc);border-radius:0 var(--r2) var(--r2) 0;padding:10px 13px}
[lang-mode="th"] .ia-note{font-family:'Noto Serif Thai',serif;font-style:normal}
.ia-tags{display:flex;flex-wrap:wrap;gap:6px}
.ia-tag{font-size:11px;color:var(--tx);background:var(--pan2);border:1px solid var(--bd);border-radius:2px;
  padding:3px 10px;font-style:italic}
[lang-mode="th"] .ia-tag{font-family:'Noto Serif Thai',serif;font-style:normal}

#ia-origin{position:relative;z-index:1;padding:14px 24px 22px;text-align:center;font-size:11px;
  font-style:italic;color:var(--mu);line-height:1.6;border-top:1px solid var(--bd2);margin-top:8px}
[lang-mode="th"] #ia-origin{font-family:'Noto Serif Thai',serif;font-style:normal}
</style>
</head>
<body>
<textarea id="iaraw" style="display:none;position:absolute;left:-9999px">$1</textarea>
<div id="iawrap"><div id="ia">
  <div id="ia-nebula"></div>
  <div class="ia-ember" style="left:16%;--ex:8px;animation-delay:0s"></div>
  <div class="ia-ember v" style="left:36%;--ex:-12px;animation-delay:1.2s"></div>
  <div class="ia-ember" style="left:60%;--ex:14px;animation-delay:2.4s"></div>
  <div class="ia-ember v" style="left:80%;--ex:-8px;animation-delay:3.6s"></div>
  <div class="ia-ember" style="left:24%;--ex:10px;animation-delay:.6s"></div>
  <svg class="ia-corner tl" viewBox="0 0 40 40" fill="none"><path d="M2 37 Q2 2 37 2" stroke="#C0A050" stroke-width="1"/><circle cx="2" cy="37" r="1.5" fill="#C0A050"/></svg>
  <svg class="ia-corner tr" viewBox="0 0 40 40" fill="none"><path d="M2 37 Q2 2 37 2" stroke="#C0A050" stroke-width="1"/><circle cx="2" cy="37" r="1.5" fill="#C0A050"/></svg>
  <svg class="ia-corner bl" viewBox="0 0 40 40" fill="none"><path d="M2 37 Q2 2 37 2" stroke="#C0A050" stroke-width="1"/><circle cx="2" cy="37" r="1.5" fill="#C0A050"/></svg>
  <svg class="ia-corner br" viewBox="0 0 40 40" fill="none"><path d="M2 37 Q2 2 37 2" stroke="#C0A050" stroke-width="1"/><circle cx="2" cy="37" r="1.5" fill="#C0A050"/></svg>

  <div id="ia-lang"><b id="lg-en" class="on" data-l="en">EN</b><b id="lg-th" data-l="th">ไทย</b></div>

  <div id="ia-head">
    <div id="ia-eyebrow" data-en="THE ASTRAL LEDGER" data-th="บันทึกใต้เงาดารา">THE ASTRAL LEDGER</div>
    <div id="ia-title" lang-mode="en" data-en="TREASURE UNSEALED" data-th="สมบัติถูกปลดผนึก">TREASURE UNSEALED</div>
    <div id="ia-subtitle" data-en="An Item Enters the Ledger" data-th="สิ่งของชิ้นหนึ่งเข้าสู่บันทึก">An Item Enters the Ledger</div>
    <div id="ia-chev">&#9650;</div>
  </div>

  <div id="iabody">
    <div id="ia-center">
      <div id="ia-frame-wrap">
        <div id="ia-frame-bg"></div>
        <img id="ia-frame-img" alt="">
        <div id="ia-gem">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none">
            <path d="M12 2 L20 9 L12 22 L4 9 Z" stroke="#C9A0F0" stroke-width="1.2"/>
            <path d="M4 9 L20 9 M8 9 L12 2 M16 9 L12 2 M8 9 L12 22 M16 9 L12 22" stroke="#C9A0F0" stroke-width=".6" opacity=".55"/>
          </svg>
        </div>
        <svg id="ia-frame-border" viewBox="0 0 90 90" fill="none">
          <polygon points="45,3 82,24 82,66 45,87 8,66 8,24" stroke="var(--seqc)" stroke-width="2"/>
        </svg>
        <div id="ia-seq-badge">&mdash;</div>
      </div>
      <div id="ia-name">Unknown Item</div>
      <div id="ia-category"></div>
      <div id="ia-seq-lbl" data-en="Sequence Rating" data-th="ระดับลำดับ">Sequence Rating</div>
    </div>

    <div class="ia-body-inner">
      <div id="desc-wrap"></div>
      <div id="props-wrap"></div>
    </div>

    <div id="ia-origin"></div>
  </div>
</div></div>

<script>
(function(){
function g(id){return document.getElementById(id)}
function esc(v){if(v==null)return'';return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function hexRgb(h){h=h||'#8B5FBF';try{return parseInt(h.slice(1,3),16)+','+parseInt(h.slice(3,5),16)+','+parseInt(h.slice(5,7),16)}catch(e){return '139,95,191'}}
function qa(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}

var L='en';

var raw=g('iaraw');var d=null;
if(raw&&raw.value.trim()){
  var dec=document.createElement('textarea');dec.innerHTML=raw.value.trim();
  try{d=JSON.parse(dec.value.trim())}catch(e){}
}
if(!d)d={};

var acc=d.charColor||'#8B5FBF';
var root=document.documentElement;
root.style.setProperty('--acc',acc);
var rgb=hexRgb(acc);
root.style.setProperty('--acc-rgb',rgb);
root.style.setProperty('--accd','rgba('+rgb+',.15)');
root.style.setProperty('--accb','rgba('+rgb+',.45)');

var STR={
  unknownItem:['Unknown Item','สิ่งของไม่ทราบชื่อ'],
  unrated:['Unrated','ยังไม่ได้จัดระดับ'],
  descHeader:['Description','คำอธิบาย'],
  propsHeader:['Properties','คุณสมบัติ']
};
function t(pair){return L==='th'?pair[1]:pair[0]}

/* Sequence rating -> colour tier (mirrors the Beyonder power-tier logic: 9-7 common, 6-4 uncommon, 3-1 legendary, 0 mythic) */
function seqColor(seq){
  if(seq==null)return '#7A7A94';
  if(seq<=0)return '#F5EEDD';
  if(seq<=3)return '#C0A050';
  if(seq<=6)return '#8B5FBF';
  return '#7A86A8';
}

function renderAll(){
  var seq=(d.sequence!=null&&d.sequence!=='')?parseInt(d.sequence,10):null;
  var sc=seqColor(seq);
  root.style.setProperty('--seqc',sc);

  g('ia-name').textContent=d.itemName||t(STR.unknownItem);
  g('ia-category').textContent=d.itemCategory||'';
  g('ia-category').style.display=d.itemCategory?'inline-block':'none';
  g('ia-seq-badge').textContent=seq!=null?seq:'—';

  if(d.image){
    var img=g('ia-frame-img');
    img.src='https://files.catbox.moe/'+d.image;
    img.style.display='block';
    img.onerror=function(){this.style.display='none';g('ia-gem').style.display='flex'};
    g('ia-gem').style.display='none';
  }else{
    g('ia-frame-img').style.display='none';
    g('ia-gem').style.display='flex';
  }

  var descHtml='';
  if(d.description){
    descHtml='<div class="ia-sec"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 0 L7 5 L12 6 L7 7 L6 12 L5 7 L0 6 L5 5 Z" fill="#C0A050"/></svg><span class="t">'+t(STR.descHeader)+'</span><span class="ln"></span></div>'+
      '<div class="ia-note">'+esc(d.description)+'</div>';
  }
  g('desc-wrap').innerHTML=descHtml;

  var props=d.properties||[];
  var propsHtml='';
  if(props.length){
    propsHtml='<div class="ia-sec"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 0 L7 5 L12 6 L7 7 L6 12 L5 7 L0 6 L5 5 Z" fill="#C0A050"/></svg><span class="t">'+t(STR.propsHeader)+'</span><span class="ln"></span></div>'+
      '<div class="ia-tags">'+props.map(function(p){return '<span class="ia-tag">'+esc(p)+'</span>';}).join('')+'</div>';
  }
  g('props-wrap').innerHTML=propsHtml;

  g('ia-origin').textContent=d.origin||'';
  g('ia-origin').style.display=d.origin?'block':'none';
}

function setLang(lang){
  L=lang;
  document.documentElement.setAttribute('lang-mode',lang);
  qa('#lg-en,#lg-th').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-l')===lang)});
  qa('[data-en]').forEach(function(el){
    var v=lang==='th'?el.getAttribute('data-th'):el.getAttribute('data-en');
    if(v!=null)el.textContent=v;
  });
  renderAll();
}
g('lg-en').addEventListener('click',function(){setLang('en')});
g('lg-th').addEventListener('click',function(){setLang('th')});

renderAll();

var head=g('ia-head');
if(head)head.addEventListener('click',function(){g('iawrap').classList.toggle('closed')});
})();
</script>
</body>
</html>
