<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Noto+Serif+Thai:wght@400;500;600;700&family=Chonburi&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;font-family:'Spectral','Noto Serif Thai',serif;font-size:13.5px}
:root{
  --acc:#8B5FBF;--acc-rgb:139,95,191;--accd:rgba(139,95,191,.15);--accb:rgba(139,95,191,.45);
  --gold:#C0A050;--spirit:#7CC9C0;
  --bg:#030207;--pan:#0D0916;--pan2:#150F26;--pan3:#1E1633;
  --tx:#E4DCF2;--tx2:#8F84B8;--mu:#463F6A;
  --bd:rgba(192,160,80,.2);--bd2:rgba(255,255,255,.04);
  --r:10px;--r2:4px;--fh:'Cinzel Decorative',serif;--fth:'Chonburi','Noto Serif Thai',serif;
}
@keyframes acspin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
#avwrap{max-width:440px;margin:12px auto;position:relative}
#avwrap::before{content:'';position:absolute;inset:0;z-index:0;border-radius:var(--r);pointer-events:none;
  box-shadow:0 0 0 1px var(--accb),0 0 26px 3px rgba(139,95,191,.45),0 0 48px 9px rgba(192,160,80,.16),0 0 68px 12px rgba(124,201,192,.08);
  animation:avaura 3.2s ease-in-out infinite}
@keyframes avaura{0%,100%{opacity:.75}50%{opacity:1}}
#av{position:relative;z-index:1;background:
    radial-gradient(ellipse 140% 60% at 50% -10%,rgba(139,95,191,.24),transparent 60%),
    radial-gradient(ellipse 100% 60% at 50% 108%,rgba(0,0,0,.5),transparent 60%),
    linear-gradient(170deg,var(--pan) 0%,var(--bg) 100%);
  border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;
  box-shadow:0 26px 76px rgba(0,0,0,.82),inset 0 0 0 1px rgba(192,160,80,.05),inset 0 0 60px rgba(0,0,0,.5);
  animation:avi .4s cubic-bezier(.2,.8,.3,1.2) both}
@keyframes avi{from{opacity:0;transform:translateY(-10px) scale(.97)}to{opacity:1;transform:none}}
#av-nebula{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.55;filter:blur(8px);
  background:
    radial-gradient(ellipse 60% 40% at 50% 0%,rgba(139,95,191,.3),transparent 70%),
    radial-gradient(ellipse 46% 30% at 90% 90%,rgba(124,201,192,.12),transparent 70%),
    radial-gradient(ellipse 55% 40% at 6% 90%,rgba(192,160,80,.12),transparent 70%)}
#av::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(1.4px 1.4px at 12% 18%,rgba(228,220,242,.8),transparent),
    radial-gradient(1px 1px at 28% 62%,rgba(228,220,242,.5),transparent),
    radial-gradient(1.6px 1.6px at 46% 12%,rgba(228,220,242,.7),transparent),
    radial-gradient(1px 1px at 63% 44%,rgba(228,220,242,.4),transparent),
    radial-gradient(1.3px 1.3px at 78% 22%,rgba(228,220,242,.75),transparent),
    radial-gradient(1px 1px at 88% 58%,rgba(228,220,242,.45),transparent),
    radial-gradient(1.5px 1.5px at 20% 82%,rgba(228,220,242,.6),transparent),
    radial-gradient(1px 1px at 55% 88%,rgba(228,220,242,.4),transparent),
    radial-gradient(1.2px 1.2px at 92% 84%,rgba(228,220,242,.55),transparent);
  animation:avtwinkle 4.5s ease-in-out infinite}
@keyframes avtwinkle{0%,100%{opacity:.4}50%{opacity:.95}}
.av-ember{position:absolute;width:2.4px;height:2.4px;border-radius:50%;background:var(--gold);
  box-shadow:0 0 7px 1.6px var(--gold);opacity:0;pointer-events:none;z-index:1;bottom:10%;animation:avember 5.5s ease-in infinite}
.av-ember.v{background:var(--spirit);box-shadow:0 0 7px 1.6px var(--spirit)}
@keyframes avember{0%{opacity:0;transform:translate(0,0)}8%{opacity:.95}75%{opacity:.5}100%{opacity:0;transform:translate(var(--ex,10px),-260px)}}
.av-corner{position:absolute;width:40px;height:40px;z-index:2;opacity:.9;pointer-events:none}
.av-corner.tl{top:7px;left:7px}
.av-corner.tr{top:7px;right:7px;transform:scaleX(-1)}
.av-corner.bl{bottom:7px;left:7px;transform:scaleY(-1)}
.av-corner.br{bottom:7px;right:7px;transform:scale(-1,-1)}

#av-lang{position:absolute;top:12px;right:13px;z-index:3;display:flex;background:rgba(0,0,0,.4);
  border:1px solid var(--bd);border-radius:99px;padding:2px;gap:1px}
#av-lang b{font-family:var(--fh);font-size:8px;letter-spacing:.4px;padding:4px 7px;border-radius:99px;
  color:var(--mu);cursor:pointer;font-weight:700;transition:all .2s}
#av-lang b.on{color:#F5F0FF;background:linear-gradient(135deg,var(--acc),#5A3E8A);box-shadow:0 0 10px -2px var(--acc)}

#av-head{position:relative;z-index:1;padding:22px 24px 8px;text-align:center;cursor:pointer;user-select:none}
#av-eyebrow{font-family:var(--fh);font-size:9px;letter-spacing:3px;color:var(--tx2);text-transform:uppercase}
[lang-mode="th"] #av-eyebrow{font-family:'Noto Serif Thai',serif;font-size:10.5px;letter-spacing:1px}
#av-title{font-size:20px;letter-spacing:2px;margin-top:6px;position:relative;
  background:linear-gradient(100deg,var(--tx) 15%,#F3E4FF 32%,var(--gold) 50%,#F3E4FF 68%,var(--tx) 85%);
  background-size:260% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:avshimmer 6s linear infinite;filter:drop-shadow(0 0 16px rgba(139,95,191,.55))}
#av-title[lang-mode="en"]{font-family:var(--fh)}
#av-title[lang-mode="th"]{font-family:var(--fth);font-size:18px;letter-spacing:.5px}
@keyframes avshimmer{0%{background-position:0% center}100%{background-position:260% center}}
#av-name{font-size:11.5px;color:var(--tx2);font-style:italic;margin-top:6px}
[lang-mode="th"] #av-name{font-family:'Noto Serif Thai',serif;font-style:normal}
#av-chev{position:absolute;bottom:2px;right:24px;font-size:9px;color:var(--mu);transition:transform .3s}
#avwrap.closed #av-chev{transform:rotate(180deg)}
#avbody{max-height:900px;overflow:hidden;transition:max-height .35s ease}
#avwrap.closed #avbody{max-height:0}

/* TRANSITION CENTERPIECE */
#av-trans-wrap{position:relative;padding:22px 24px 8px;display:flex;flex-direction:column;align-items:center}
#av-burst{position:absolute;top:34px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;
  background:radial-gradient(circle,rgba(240,232,255,.9),rgba(139,95,191,.4) 45%,transparent 72%);
  animation:avburst 1.3s ease-out 1 both;pointer-events:none}
@keyframes avburst{0%{transform:scale(0);opacity:1}70%{opacity:.5}100%{transform:scale(16);opacity:0}}
#av-nodes{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.av-node{display:flex;flex-direction:column;align-items:center;gap:6px}
.av-node-ring{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--fh);font-weight:700}
.av-node.old .av-node-ring{width:36px;height:36px;background:var(--pan3);border:1.5px solid var(--bd);color:var(--tx2);font-size:14px;opacity:.7}
.av-node.new .av-node-ring{background:radial-gradient(circle at 35% 30%,#C9A0F0,var(--acc) 60%,#3A2456);
  border:1.5px solid #F0E8FF;color:#F5F0FF;font-size:19px;box-shadow:0 0 22px -2px var(--acc),0 0 40px -6px var(--acc);
  animation:avnodepulse 2s ease-in-out infinite .4s both}
@keyframes avnodepulse{0%,100%{box-shadow:0 0 22px -2px var(--acc),0 0 40px -6px var(--acc)}50%{box-shadow:0 0 30px 2px var(--acc),0 0 54px 0px var(--acc)}}
.av-node-lbl{font-family:var(--fh);font-size:7px;letter-spacing:1px;color:var(--mu);text-transform:uppercase}
[lang-mode="th"] .av-node-lbl{font-family:'Noto Serif Thai',serif;font-size:8.5px;letter-spacing:0;text-transform:none}
#av-arrow{width:38px;height:14px;position:relative;overflow:hidden}
#av-arrow svg{position:absolute;inset:0}
.av-chev{opacity:0;animation:avchev 1.6s ease-in-out infinite}
.av-chev:nth-child(1){animation-delay:0s}
.av-chev:nth-child(2){animation-delay:.18s}
.av-chev:nth-child(3){animation-delay:.36s}
@keyframes avchev{0%{opacity:0;transform:translateX(-6px)}30%{opacity:1}70%{opacity:1}100%{opacity:0;transform:translateX(6px)}}

#av-pathway{font-family:var(--fh);font-size:16px;letter-spacing:1.4px;color:var(--tx);margin-top:16px;text-align:center}
[lang-mode="th"] #av-pathway{font-family:'Noto Serif Thai',serif;font-size:16px}
#av-title-new{font-size:11.5px;font-style:italic;color:var(--gold);margin-top:4px;text-align:center}
[lang-mode="th"] #av-title-new{font-family:'Noto Serif Thai',serif;font-style:normal}

.av-body-inner{position:relative;z-index:1;padding:14px 24px 6px}
.av-sec{display:flex;align-items:center;gap:8px;margin:16px 0 11px}
.av-sec svg{flex-shrink:0}
.av-sec .t{font-family:var(--fh);font-size:10px;letter-spacing:2px;color:var(--gold);text-transform:uppercase}
[lang-mode="th"] .av-sec .t{font-family:'Noto Serif Thai',serif;font-size:11.5px;letter-spacing:.3px}
.av-sec .ln{flex:1;height:1px;background:linear-gradient(90deg,var(--bd),transparent)}
.av-note{font-size:12px;color:var(--tx2);font-style:italic;line-height:1.65;background:var(--pan2);
  border-left:2px solid var(--acc);border-radius:0 var(--r2) var(--r2) 0;padding:10px 13px;margin-bottom:4px}
[lang-mode="th"] .av-note{font-family:'Noto Serif Thai',serif;font-style:normal}

#av-flavor{position:relative;z-index:1;padding:16px 24px 22px;text-align:center;font-size:11.5px;
  font-style:italic;color:var(--tx2);line-height:1.6;border-top:1px solid var(--bd2);margin-top:6px}
[lang-mode="th"] #av-flavor{font-family:'Noto Serif Thai',serif;font-style:normal}
</style>
</head>
<body>
<textarea id="avraw" style="display:none;position:absolute;left:-9999px">$1</textarea>
<div id="avwrap"><div id="av">
  <div id="av-nebula"></div>
  <div class="av-ember" style="left:16%;--ex:8px;animation-delay:0s"></div>
  <div class="av-ember v" style="left:36%;--ex:-12px;animation-delay:1.1s"></div>
  <div class="av-ember" style="left:60%;--ex:14px;animation-delay:2.2s"></div>
  <div class="av-ember v" style="left:80%;--ex:-8px;animation-delay:3.3s"></div>
  <div class="av-ember" style="left:24%;--ex:10px;animation-delay:.5s"></div>
  <svg class="av-corner tl" viewBox="0 0 40 40" fill="none">
    <path d="M2 37 Q2 2 37 2" stroke="#C0A050" stroke-width="1"/>
    <circle cx="2" cy="37" r="1.5" fill="#C0A050"/>
  </svg>
  <svg class="av-corner tr" viewBox="0 0 40 40" fill="none">
    <path d="M2 37 Q2 2 37 2" stroke="#C0A050" stroke-width="1"/>
    <circle cx="2" cy="37" r="1.5" fill="#C0A050"/>
  </svg>
  <svg class="av-corner bl" viewBox="0 0 40 40" fill="none">
    <path d="M2 37 Q2 2 37 2" stroke="#C0A050" stroke-width="1"/>
    <circle cx="2" cy="37" r="1.5" fill="#C0A050"/>
  </svg>
  <svg class="av-corner br" viewBox="0 0 40 40" fill="none">
    <path d="M2 37 Q2 2 37 2" stroke="#C0A050" stroke-width="1"/>
    <circle cx="2" cy="37" r="1.5" fill="#C0A050"/>
  </svg>

  <div id="av-lang"><b id="lg-en" class="on" data-l="en">EN</b><b id="lg-th" data-l="th">ไทย</b></div>

  <div id="av-head">
    <div id="av-eyebrow" data-en="THE ASTRAL LEDGER" data-th="บันทึกใต้เงาดารา">THE ASTRAL LEDGER</div>
    <div id="av-title" lang-mode="en" data-en="THE STARS REALIGN" data-th="ดวงดาวโคจรเปลี่ยน">THE STARS REALIGN</div>
    <div id="av-name">&mdash;</div>
    <div id="av-chev">&#9650;</div>
  </div>

  <div id="avbody">
    <div id="av-trans-wrap">
      <div id="av-burst"></div>
      <div id="av-nodes">
        <div class="av-node old">
          <div class="av-node-ring" id="av-old-num">9</div>
          <div class="av-node-lbl" data-en="Before" data-th="เดิม">Before</div>
        </div>
        <div id="av-arrow">
          <svg viewBox="0 0 38 14" fill="none">
            <polyline class="av-chev" points="4,11 10,7 4,3" stroke="#C0A050" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            <polyline class="av-chev" points="14,11 20,7 14,3" stroke="#8B5FBF" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            <polyline class="av-chev" points="24,11 30,7 24,3" stroke="#C0A050" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="av-node new">
          <div class="av-node-ring" id="av-new-num">8</div>
          <div class="av-node-lbl" data-en="Now" data-th="ปัจจุบัน">Now</div>
        </div>
      </div>
      <div id="av-pathway">&mdash;</div>
      <div id="av-title-new"></div>
    </div>

    <div class="av-body-inner">
      <div id="char-wrap"></div>
    </div>

    <div id="av-flavor"></div>
  </div>
</div></div>

<script>
(function(){
function g(id){return document.getElementById(id)}
function esc(v){if(v==null)return'';return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function hexRgb(h){h=h||'#8B5FBF';try{return parseInt(h.slice(1,3),16)+','+parseInt(h.slice(3,5),16)+','+parseInt(h.slice(5,7),16)}catch(e){return '139,95,191'}}
function qa(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}

var L='en';

var raw=g('avraw');var d=null;
if(raw&&raw.value.trim()){
  var dec=document.createElement('textarea');dec.innerHTML=raw.value.trim();
  try{d=JSON.parse(dec.value.trim())}catch(e){}
}
if(!d)d={};

var acc=d.charColor||'#8B5FBF';
var root=document.documentElement;
root.style.setProperty('--acc',acc);
var rgb=hexRgb(acc);
root.style.setProperty('--acc-rgb',rgb);
root.style.setProperty('--accd','rgba('+rgb+',.15)');
root.style.setProperty('--accb','rgba('+rgb+',.45)');

var PATHWAYS_TH={
  'Fool':'ผู้โง่เขลา','Door':'ประตู','Error':'ข้อผิดพลาด','Sun':'ดวงอาทิตย์','Tyrant':'ทรราช',
  'White Tower':'หอคอยสีขาว','Visionary':'ผู้ร่ายจินตนาการ','Hanged Man':'แฮงแมน','Darkness':'ความมืด',
  'Death':'ความตาย','Twilight Giant':'ยักษ์พลบค่ำ','Red Priest':'นักบวชแดง','Demoness':'แม่มด',
  'Paragon':'ปราชญ์','Hermit':'ฤาษี','Mother':'มารดา','Moon':'ดวงจันทร์','Chained':'ผู้ถูกล่ามโซ่',
  'Abyss':'อเวจี','Justiciar':'ผู้พิพากษา','Black Emperor':'จักรพรรดิมืด','Wheel of Fortune':'วงล้อแห่งโชคชะตา'
};
var STR={
  unnamed:['Unnamed Beyonder','ผู้วิเศษไม่มีชื่อ'],
  noPathway:['No Pathway on record','ไม่มีเส้นทางบันทึกไว้'],
  charHeader:['Characteristic Unlocked','คุณลักษณะที่ปลดล็อก']
};
function t(pair){return L==='th'?pair[1]:pair[0]}

function renderAll(){
  g('av-name').textContent=d.name||t(STR.unnamed);
  var oldSeq=(d.oldSequence!=null&&d.oldSequence!=='')?parseInt(d.oldSequence,10):null;
  var newSeq=(d.newSequence!=null&&d.newSequence!=='')?parseInt(d.newSequence,10):null;
  g('av-old-num').textContent=oldSeq!=null?oldSeq:'—';
  g('av-new-num').textContent=newSeq!=null?newSeq:'—';
  var pathTh=d.pathway?(PATHWAYS_TH[d.pathway]||d.pathway):null;
  g('av-pathway').textContent=d.pathway?(L==='th'?pathTh:d.pathway):t(STR.noPathway);
  g('av-title-new').textContent=d.newSequenceTitle||'';

  var charHtml='';
  if(d.newCharacteristic){
    charHtml='<div class="av-sec"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 0 L7 5 L12 6 L7 7 L6 12 L5 7 L0 6 L5 5 Z" fill="#C0A050"/></svg><span class="t">'+t(STR.charHeader)+'</span><span class="ln"></span></div>'+
      '<div class="av-note">'+esc(d.newCharacteristic)+'</div>';
  }
  g('char-wrap').innerHTML=charHtml;

  g('av-flavor').textContent=d.flavorLine||'';
  g('av-flavor').style.display=d.flavorLine?'block':'none';
}

function setLang(lang){
  L=lang;
  document.documentElement.setAttribute('lang-mode',lang);
  qa('#lg-en,#lg-th').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-l')===lang)});
  qa('[data-en]').forEach(function(el){
    var v=lang==='th'?el.getAttribute('data-th'):el.getAttribute('data-en');
    if(v!=null)el.textContent=v;
  });
  renderAll();
}
g('lg-en').addEventListener('click',function(){setLang('en')});
g('lg-th').addEventListener('click',function(){setLang('th')});

renderAll();

var head=g('av-head');
if(head)head.addEventListener('click',function(){g('avwrap').classList.toggle('closed')});
})();
</script>
</body>
</html>
