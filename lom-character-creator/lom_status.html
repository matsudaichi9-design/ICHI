<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Noto+Serif+Thai:wght@400;500;600;700&family=Chonburi&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;font-family:'Spectral','Noto Serif Thai',serif;font-size:13.5px}
:root{
  --ac:#8B5FBF;--ac-rgb:139,95,191;
  --gold:#C0A050;--tx:#E4DCF2;--tx2:#8F84B8;--mu:#463F6A;
  --bg:#050206;--pan:#0F0910;--pan2:#180F1C;--pan3:#221629;
  --bd:rgba(192,160,80,.22);--bd2:rgba(255,255,255,.05);
  --fh:'Cinzel Decorative',serif;--fth:'Chonburi','Noto Serif Thai',serif;
}
#stwrap{max-width:480px;margin:12px auto;position:relative}
#stwrap::before{content:'';position:absolute;inset:0;z-index:0;border-radius:11px;pointer-events:none;
  box-shadow:0 0 0 1px rgba(var(--ac-rgb),.4),0 0 18px 1px rgba(var(--ac-rgb),.24);
  animation:staura 3.4s ease-in-out infinite}
@keyframes staura{0%,100%{opacity:.7}50%{opacity:1}}
#st{position:relative;z-index:1;background:linear-gradient(175deg,var(--pan2) 0%,var(--bg) 100%);
  border:1px solid var(--bd);border-radius:11px;overflow:hidden;
  box-shadow:0 16px 40px rgba(0,0,0,.78),inset 0 0 0 1px rgba(255,255,255,.03);
  animation:sti .32s cubic-bezier(.2,.8,.3,1.15) both}
@keyframes sti{from{opacity:0;transform:translateY(-6px) scale(.985)}to{opacity:1;transform:none}}

/* COLLAPSED BAR — always visible */
#st-bar{display:flex;align-items:center;gap:11px;padding:10px 14px;cursor:pointer;position:relative;z-index:1}
#st-avatar{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.28),var(--ac) 78%);
  border:1.2px solid rgba(255,255,255,.5);box-shadow:0 0 10px -1px var(--ac)}
#st-bar-text{flex:1;min-width:0}
#st-bar-name{font-size:13px;font-weight:600;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#st-bar-level{font-size:10px;color:var(--tx2);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
[lang-mode="th"] #st-bar-level{font-family:'Noto Serif Thai',serif;font-style:normal}
#st-bar-funds{flex-shrink:0;display:flex;align-items:center;gap:4px;padding:4px 9px;border-radius:99px;
  background:rgba(192,160,80,.1);border:1px solid rgba(192,160,80,.35);font-size:11px;color:var(--gold);white-space:nowrap}
#st-chev{flex-shrink:0;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.04);border:1px solid var(--bd2);color:var(--mu);transition:transform .3s}
#stwrap.open #st-chev{transform:rotate(180deg)}

#st-panel{max-height:0;overflow:hidden;transition:max-height .35s ease}
#stwrap.open #st-panel{max-height:900px}

#st-lang{position:absolute;top:9px;right:11px;z-index:4;display:flex;background:rgba(0,0,0,.4);
  border:1px solid var(--bd);border-radius:99px;padding:2px;gap:1px}
#stwrap:not(.open) #st-lang{display:none}
#st-lang b{font-family:var(--fh);font-size:7.5px;letter-spacing:.4px;padding:3px 6px;border-radius:99px;
  color:var(--mu);cursor:pointer;font-weight:700}
#st-lang b.on{color:#fff;background:linear-gradient(135deg,var(--ac),#2A1F42);box-shadow:0 0 8px -2px var(--ac)}

/* TABS */
#sttabs{display:flex;background:rgba(0,0,0,.3);border-top:1px solid var(--bd2);border-bottom:1px solid var(--bd2);overflow-x:auto}
#sttabs::-webkit-scrollbar{display:none}
.sttab{flex:1;min-width:56px;padding:9px 2px 7px;text-align:center;cursor:pointer;user-select:none}
.sttab .ic{width:24px;height:24px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;
  border:1px solid transparent;transition:all .18s}
.sttab span{display:block;font-family:var(--fh);font-size:6.6px;letter-spacing:.4px;color:var(--mu);text-transform:uppercase;margin-top:3px}
[lang-mode="th"] .sttab span{font-family:'Noto Serif Thai',serif;font-size:8px;letter-spacing:0;text-transform:none}
.sttab.on .ic{border-color:var(--ac);background:rgba(var(--ac-rgb),.14);box-shadow:0 0 10px -3px var(--ac)}
.sttab.on span{color:var(--tx)}
.sttab[data-hide="1"]{display:none}

.stpanel{display:none;padding:14px 16px 15px}
.stpanel.on{display:block}
.st-scroll{max-height:320px;overflow-y:auto;padding-right:2px}

/* Character tab */
.st-kv{padding:8px 0;border-bottom:1px solid var(--bd2)}
.st-kv:last-child{border-bottom:none}
.st-kv .k{font-family:var(--fh);font-size:8.5px;letter-spacing:1.6px;color:var(--gold);text-transform:uppercase}
[lang-mode="th"] .st-kv .k{font-family:'Noto Serif Thai',serif;font-size:10px;letter-spacing:.2px}
.st-kv .v{font-size:12.5px;color:var(--tx);margin-top:3px;line-height:1.5}
[lang-mode="th"] .st-kv .v{font-family:'Noto Serif Thai',serif}

/* Abilities */
.st-ability{padding:9px 0;border-bottom:1px solid var(--bd2)}
.st-ability:last-child{border-bottom:none}
.st-ability .n{font-size:12.5px;font-weight:600;color:var(--tx)}
[lang-mode="th"] .st-ability .n{font-family:'Noto Serif Thai',serif}
.st-ability .d{font-size:11px;color:var(--tx2);font-style:italic;margin-top:3px;line-height:1.5}
[lang-mode="th"] .st-ability .d{font-family:'Noto Serif Thai',serif;font-style:normal}

/* Accordion (locations / inventory) */
.st-acc{border:1px solid var(--bd2);border-radius:5px;margin-bottom:7px;overflow:hidden;background:rgba(255,255,255,.015)}
.st-acc-head{display:flex;align-items:center;gap:9px;padding:9px 11px;cursor:pointer}
.st-acc-head .main{flex:1;min-width:0}
.st-acc-name{font-size:12px;font-weight:600;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[lang-mode="th"] .st-acc-name{font-family:'Noto Serif Thai',serif}
.st-acc-sub{font-size:10px;color:var(--tx2);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
[lang-mode="th"] .st-acc-sub{font-family:'Noto Serif Thai',serif;font-style:normal}
.st-acc-pill{flex-shrink:0;font-size:8.5px;letter-spacing:.5px;padding:2px 7px;border-radius:99px;color:var(--ac);
  background:rgba(var(--ac-rgb),.12);border:1px solid rgba(var(--ac-rgb),.35);text-transform:uppercase}
[lang-mode="th"] .st-acc-pill{font-family:'Noto Serif Thai',serif;text-transform:none}
.st-acc-chev{flex-shrink:0;width:16px;height:16px;color:var(--mu);transition:transform .25s}
.st-acc.open .st-acc-chev{transform:rotate(180deg)}
.st-acc-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
.st-acc.open .st-acc-body{max-height:260px}
.st-acc-body-inner{padding:0 11px 11px;font-size:11.5px;color:var(--tx2);line-height:1.6;font-style:italic;
  border-top:1px solid var(--bd2);padding-top:8px;margin:0 11px 11px}
[lang-mode="th"] .st-acc-body-inner{font-family:'Noto Serif Thai',serif;font-style:normal}

/* Bestiary */
.st-mon{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--bd2)}
.st-mon:last-child{border-bottom:none}
.st-mon-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;box-shadow:0 0 6px 0 var(--dc)}
.st-mon-name{font-size:12px;font-weight:600;color:var(--tx);flex-shrink:0;max-width:40%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[lang-mode="th"] .st-mon-name{font-family:'Noto Serif Thai',serif}
.st-mon-sum{font-size:10.5px;color:var(--tx2);font-style:italic;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[lang-mode="th"] .st-mon-sum{font-family:'Noto Serif Thai',serif;font-style:normal}

.st-empty{font-size:11px;font-style:italic;color:var(--mu);padding:6px 0}
[lang-mode="th"] .st-empty{font-family:'Noto Serif Thai',serif;font-style:normal}

.st-sub-title{font-family:var(--fh);font-size:9px;letter-spacing:1.6px;color:var(--gold);text-transform:uppercase;margin-bottom:9px}
[lang-mode="th"] .st-sub-title{font-family:'Noto Serif Thai',serif;font-size:10.5px;letter-spacing:.2px}

#st-foot{padding:9px 16px 12px;text-align:center;font-size:8.5px;letter-spacing:.6px;color:var(--mu);
  border-top:1px solid var(--bd2);text-transform:uppercase}
[lang-mode="th"] #st-foot{font-family:'Noto Serif Thai',serif;letter-spacing:.2px;text-transform:none}
</style>
</head>
<body>
<textarea id="straw" style="display:none;position:absolute;left:-9999px">$1</textarea>
<div id="stwrap"><div id="st">
  <div id="st-lang"><b id="lg-en" class="on" data-l="en">EN</b><b id="lg-th" data-l="th">ไทย</b></div>

  <div id="st-bar">
    <div id="st-avatar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.4" r="3.7"/><path d="M5 20a7 7 0 0 1 14 0"/></svg></div>
    <div id="st-bar-text">
      <div id="st-bar-name">Unnamed</div>
      <div id="st-bar-level"></div>
    </div>
    <div id="st-bar-funds" style="display:none"></div>
    <div id="st-chev"><svg width="9" height="9" viewBox="0 0 10 10" fill="none"><path d="M1.5 3 L5 6.5 L8.5 3" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  </div>

  <div id="st-panel">
    <div id="sttabs">
      <div class="sttab on" data-t="t1"><span class="ic"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--ac)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.4" r="3.7"/><path d="M5 20a7 7 0 0 1 14 0"/></svg></span><span data-en="Character" data-th="ตัวละคร">Character</span></div>
      <div class="sttab" data-t="t2"><span class="ic"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 2 L14.5 9.5 L22 12 L14.5 14.5 L12 22 L9.5 14.5 L2 12 L9.5 9.5 Z" stroke="var(--ac)" stroke-width="1.3"/></svg></span><span data-en="Abilities" data-th="ความสามารถ">Abilities</span></div>
      <div class="sttab" data-t="t3"><span class="ic"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="var(--ac)" stroke-width="1.2"/><path d="M12 3 L14 11 L12 21 L10 11 Z" fill="var(--ac)" opacity=".8"/></svg></span><span data-en="Locations" data-th="สถานที่">Locations</span></div>
      <div class="sttab" data-t="t4"><span class="ic"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 2 L21 7 V17 L12 22 L3 17 V7 Z" stroke="var(--ac)" stroke-width="1.3"/></svg></span><span data-en="Inventory" data-th="กระเป๋าเก็บของ">Inventory</span></div>
      <div class="sttab" data-t="t5"><span class="ic"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M2 12 C6 5 18 5 22 12 C18 19 6 19 2 12 Z" stroke="var(--ac)" stroke-width="1.3"/><circle cx="12" cy="12" r="3" fill="var(--ac)"/></svg></span><span data-en="Bestiary" data-th="มอนสเตอร์">Bestiary</span></div>
      <div class="sttab" data-t="t6" data-hide="1"><span class="ic"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M5 20 L5 6 L14 3 L19 6 L19 20 Z M5 6 L14 9 L19 6" stroke="var(--ac)" stroke-width="1.15"/></svg></span><span id="st-tab6-label" data-en="Notes" data-th="บันทึกเพิ่มเติม">Notes</span></div>
    </div>

    <div class="stpanel on" data-p="t1">
      <div class="st-scroll" id="char-wrap"></div>
    </div>
    <div class="stpanel" data-p="t2">
      <div class="st-scroll" id="abilities-wrap"></div>
    </div>
    <div class="stpanel" data-p="t3">
      <div class="st-scroll" id="locations-wrap"></div>
    </div>
    <div class="stpanel" data-p="t4">
      <div class="st-scroll" id="inventory-wrap"></div>
    </div>
    <div class="stpanel" data-p="t5">
      <div class="st-scroll" id="bestiary-wrap"></div>
    </div>
    <div class="stpanel" data-p="t6">
      <div class="st-scroll" id="extra-wrap"></div>
    </div>

    <div id="st-foot" data-en="The Astral Ledger — Living Record" data-th="บันทึกใต้เงาดารา — บันทึกที่มีชีวิต">The Astral Ledger — Living Record</div>
  </div>
</div></div>

<script>
(function(){
function g(id){return document.getElementById(id)}
function esc(v){if(v==null)return'';return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function qa(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}

var L='en';
var raw=g('straw');var d=null;
if(raw&&raw.value.trim()){
  var dec=document.createElement('textarea');dec.innerHTML=raw.value.trim();
  try{d=JSON.parse(dec.value.trim())}catch(e){}
}
if(!d)d={};

function t(en,th){return L==='th'?th:en}
function emptyMsg(en,th){return '<div class="st-empty">'+t(en,th)+'</div>';}

function dangerColor(v){
  v=Math.max(0,Math.min(10,parseFloat(v)||0));
  var stops=['#F0EDE8','#EAD79A','#E0A85C','#C4523A','#7A1A1E'];
  function hx(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
  function lerp(a,b,f){return Math.round(a+(b-a)*f)}
  var seg=v/10*(stops.length-1);
  var i=Math.min(stops.length-2,Math.floor(seg));
  var f=seg-i;
  var c1=hx(stops[i]),c2=hx(stops[i+1]);
  var r=lerp(c1[0],c2[0],f),gg=lerp(c1[1],c2[1],f),b=lerp(c1[2],c2[2],f);
  return 'rgb('+r+','+gg+','+b+')';
}

var accIdCounter=0;
function accordion(name,pillText,subText,bodyText){
  accIdCounter++;
  var id='stacc'+accIdCounter;
  return '<div class="st-acc" id="'+id+'">'+
    '<div class="st-acc-head" onclick="document.getElementById(\''+id+'\').classList.toggle(\'open\')">'+
      '<div class="main"><div class="st-acc-name">'+esc(name)+'</div>'+(subText?'<div class="st-acc-sub">'+esc(subText)+'</div>':'')+'</div>'+
      (pillText?'<div class="st-acc-pill">'+esc(pillText)+'</div>':'')+
      '<svg class="st-acc-chev" viewBox="0 0 10 10" fill="none"><path d="M1.5 3 L5 6.5 L8.5 3" stroke="var(--mu)" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>'+
    '</div>'+
    '<div class="st-acc-body"><div class="st-acc-body-inner">'+esc(bodyText||'')+'</div></div>'+
  '</div>';
}

function renderAll(){
  if(d.charColor){
    document.documentElement.style.setProperty('--ac',d.charColor);
    var h=d.charColor.replace('#','');
    if(h.length===6){
      var r=parseInt(h.slice(0,2),16),gg=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
      document.documentElement.style.setProperty('--ac-rgb',r+','+gg+','+b);
    }
  }

  var ch=d.character||{};
  g('st-bar-name').textContent=ch.name||t('Unnamed','ไม่มีชื่อ');
  g('st-bar-level').textContent=ch.level||'';
  if(ch.funds){
    g('st-bar-funds').style.display='flex';
    g('st-bar-funds').innerHTML='<svg width="10" height="10" viewBox="0 0 12 12" fill="none"><circle cx="6" cy="6" r="5" stroke="var(--gold)" stroke-width="1"/></svg>'+esc(ch.funds);
  }else{
    g('st-bar-funds').style.display='none';
  }

  // Character tab
  var kvs=[
    ['Name','ชื่อ',ch.name],
    ['Level','ระดับ',ch.level],
    ['Appearance','รูปร่างหน้าตา',ch.appearance],
    ['Outfit','การแต่งกาย',ch.outfit],
    ['Condition','สถานะร่างกาย',ch.condition],
    ['Funds','ทุนทรัพย์',ch.funds]
  ];
  var charHtml='';
  kvs.forEach(function(row){
    if(row[2]){
      charHtml+='<div class="st-kv"><div class="k">'+t(row[0],row[1])+'</div><div class="v">'+esc(row[2])+'</div></div>';
    }
  });
  (ch.extra||[]).forEach(function(x){
    if(x&&x.label){
      charHtml+='<div class="st-kv"><div class="k">'+esc(x.label)+'</div><div class="v">'+esc(x.value||'')+'</div></div>';
    }
  });
  if(!charHtml)charHtml=emptyMsg('No character data recorded yet.','ยังไม่มีข้อมูลตัวละคร');
  g('char-wrap').innerHTML=charHtml;

  // Abilities tab
  var abilities=d.abilities||[];
  var abHtml=abilities.length?abilities.map(function(a){
    return '<div class="st-ability"><div class="n">'+esc(a.name||'')+'</div>'+(a.description?'<div class="d">'+esc(a.description)+'</div>':'')+'</div>';
  }).join(''):emptyMsg('No abilities recorded yet.','ยังไม่มีความสามารถที่บันทึกไว้');
  g('abilities-wrap').innerHTML=abHtml;

  // Locations tab
  var locations=d.locations||[];
  var locHtml=locations.length?locations.map(function(l){
    return accordion(l.name||'',null,l.summary||'',l.details||l.summary||'');
  }).join(''):emptyMsg('No locations discovered yet.','ยังไม่มีสถานที่ที่ถูกค้นพบ');
  g('locations-wrap').innerHTML=locHtml;

  // Inventory tab
  var inventory=d.inventory||[];
  var invHtml=inventory.length?inventory.map(function(x){
    var pill=[x.category,x.tier].filter(Boolean).join(' · ');
    return accordion(x.name||'',pill||null,null,x.description||'');
  }).join(''):emptyMsg('The bag is empty.','กระเป๋ายังว่างเปล่า');
  g('inventory-wrap').innerHTML=invHtml;

  // Bestiary tab
  var bestiary=d.bestiary||[];
  var besHtml=bestiary.length?bestiary.map(function(m){
    var dc=dangerColor(m.dangerLevel);
    return '<div class="st-mon"><div class="st-mon-dot" style="background:'+dc+';--dc:'+dc+'"></div><div class="st-mon-name">'+esc(m.name||'')+'</div><div class="st-mon-sum">'+esc(m.summary||'')+'</div></div>';
  }).join(''):emptyMsg('No creatures logged yet.','ยังไม่มีบันทึกสิ่งมีชีวิตใดๆ');
  g('bestiary-wrap').innerHTML=besHtml;

  // Extra tab
  var extraTab=d.extraTab;
  var tab6=document.querySelector('.sttab[data-t="t6"]');
  if(extraTab&&(extraTab.title||(extraTab.items&&extraTab.items.length))){
    tab6.removeAttribute('data-hide');
    var lbl=g('st-tab6-label');
    if(extraTab.title){lbl.textContent=extraTab.title;lbl.removeAttribute('data-en');lbl.removeAttribute('data-th');}
    var items=extraTab.items||[];
    var exHtml=items.length?items.map(function(x){
      return '<div class="st-kv"><div class="k">'+esc(x.label||'')+'</div><div class="v">'+esc(x.value||'')+'</div></div>';
    }).join(''):emptyMsg('Nothing recorded yet.','ยังไม่มีข้อมูล');
    g('extra-wrap').innerHTML=exHtml;
  }else{
    tab6.setAttribute('data-hide','1');
    if(tab6.classList.contains('on'))go('t1');
  }
}

function setLang(lang){
  L=lang;
  document.documentElement.setAttribute('lang-mode',lang);
  qa('#lg-en,#lg-th').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-l')===lang)});
  qa('[data-en]').forEach(function(el){
    var v=lang==='th'?el.getAttribute('data-th'):el.getAttribute('data-en');
    if(v!=null)el.innerHTML=v;
  });
  renderAll();
}
g('lg-en').addEventListener('click',function(e){e.stopPropagation();setLang('en')});
g('lg-th').addEventListener('click',function(e){e.stopPropagation();setLang('th')});

g('st-bar').addEventListener('click',function(){g('stwrap').classList.toggle('open')});

qa('.sttab').forEach(function(tb){
  tb.addEventListener('click',function(){go(tb.getAttribute('data-t'))});
});
function go(target){
  qa('.sttab').forEach(function(x){x.classList.toggle('on',x.getAttribute('data-t')===target)});
  qa('.stpanel').forEach(function(p){p.classList.toggle('on',p.getAttribute('data-p')===target)});
}

renderAll();
})();
</script>
</body>
</html>
