<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;font-family:'Cormorant Garamond',serif;font-size:15px}
:root{
  --bg:#140D07;--pan:#1F150C;--pan2:#2A1D11;--pan3:#332412;
  --acc:#7A1220;--acc-rgb:122,18,32;
  --gold:#B8862E;--goldd:rgba(184,134,46,.14);
  --ink:#E8D9B8;--ink2:#B8A585;--mu:#7A6448;
  --bd:rgba(184,134,46,.22);--bd2:rgba(255,255,255,.06);
  --safe:#4A6B4A;--caution:#B8862E;--concern:#A24868;--danger:#7A1220;
}
#wtwin{max-width:460px;margin:6px auto;background:var(--bg);border-radius:3px;overflow:hidden;border:1px solid var(--bd);box-shadow:0 14px 50px rgba(0,0,0,.8);position:relative;animation:wti .3s ease both}
@keyframes wti{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
#wtwin::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:5;opacity:.045;background-image:repeating-radial-gradient(circle at 25% 20%,#000 0,transparent 2px),repeating-radial-gradient(circle at 75% 80%,#000 0,transparent 2px);background-size:40px 40px,54px 54px}

/* MASTHEAD */
#mast{position:relative;padding:20px 20px 14px;text-align:center;background:linear-gradient(180deg,var(--pan) 0%,var(--bg) 100%);border-bottom:1px solid var(--bd);cursor:pointer;user-select:none}
.corner-flourish{position:absolute;width:22px;height:22px;color:var(--gold);opacity:.5;font-size:17px;line-height:1}
.cf-tl{top:8px;left:10px}.cf-tr{top:8px;right:10px;transform:scaleX(-1)}
#compass{width:42px;height:42px;margin:0 auto 8px}
#mast-title{font-family:'UnifrakturMaguntia',cursive;font-size:23px;color:var(--ink);letter-spacing:.5px;text-shadow:0 0 16px rgba(var(--acc-rgb),.3)}
#mast-sub{font-size:11px;font-style:italic;color:var(--ink2);margin-top:4px}
#danger-badge{position:absolute;top:14px;right:14px;display:flex;flex-direction:column;align-items:center;gap:2px}
#db-ring{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--gold);font-size:9px;font-weight:700;color:var(--ink)}
#db-lbl{font-size:7px;letter-spacing:1px;text-transform:uppercase;color:var(--mu)}
#chev{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--mu);transition:transform .3s}
#wtwin.closed #chev{transform:translateX(-50%) rotate(180deg)}

/* COLLAPSIBLE BODY */
#wtbody{max-height:2000px;overflow:hidden;transition:max-height .4s ease}
#wtwin.closed #wtbody{max-height:0}

/* NAV */
#navrib{display:flex;justify-content:center;gap:4px;padding:8px 10px;background:var(--pan);border-bottom:1px solid var(--bd2);flex-wrap:wrap}
.nav-a{font-size:9.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--mu);cursor:pointer;padding:3px 4px;transition:color .2s;user-select:none}
.nav-a:hover{color:var(--ink2)}
.nav-a.on{color:var(--gold)}
.nav-sep{color:var(--bd);font-size:9px;align-self:center}

#page{padding:6px 20px 18px;max-height:520px;overflow-y:auto}
#page::-webkit-scrollbar{width:4px}
#page::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}

.leaf{padding:16px 0 4px;border-bottom:1px dashed var(--bd2)}
.leaf:last-of-type{border-bottom:none}
.leaf-hd{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.leaf-hd .lh-ico{font-size:14px}
.leaf-hd .lh-txt{font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);font-weight:600}
.leaf-hd::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--goldd),transparent)}

/* WAYPOINT */
#loc-name{font-size:20px;color:var(--ink);margin-bottom:2px}
#loc-region{font-size:11px;color:var(--gold);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
#loc-desc{font-size:12.5px;font-style:italic;color:var(--ink2);line-height:1.6;margin-bottom:14px}
.lline{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.lline-lbl{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--mu);flex-shrink:0;width:70px}
.lline-dots{flex:1;border-bottom:1px dotted var(--bd);transform:translateY(-3px);min-width:8px}
.lline-val{font-size:12.5px;color:var(--ink2);text-align:right;flex-shrink:0;max-width:60%}

/* GAUGES */
#gauge-row{display:flex;justify-content:space-around;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.gcol{display:flex;flex-direction:column;align-items:center;width:78px}
.gcol-ico{font-size:15px;margin-bottom:4px}
.gcol-lbl{font-size:8.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--mu);text-align:center;margin-bottom:6px;line-height:1.3;height:22px}
.tube{width:15px;height:88px;border-radius:8px;background:var(--pan3);border:1px solid var(--bd2);position:relative;overflow:hidden}
.tube-fill{position:absolute;bottom:0;left:0;width:100%;border-radius:8px;transition:height .5s,background .5s}
.tube-bulb{width:22px;height:22px;border-radius:50%;background:var(--pan3);border:1px solid var(--bd2);margin-top:-5px;position:relative;z-index:2}
.tube-bulb-fill{position:absolute;inset:2px;border-radius:50%;transition:background .5s}
.gcol-state{font-size:9.5px;font-weight:600;margin-top:7px;text-align:center}
.gcol-note{font-size:9px;color:var(--mu);font-style:italic;text-align:center;margin-top:3px;line-height:1.35}

/* ASPETT SHADOW */
.shadow-box{background:linear-gradient(135deg,rgba(122,18,32,.14),rgba(122,18,32,.04));border:1px solid rgba(122,18,32,.4);border-radius:3px;padding:13px 15px;position:relative}
.shadow-box::before{content:'👁';position:absolute;top:-10px;left:14px;background:var(--bg);padding:0 6px;font-size:14px}
.shadow-ttl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--danger);margin-bottom:7px;text-align:right}
.shadow-txt{font-size:12.5px;color:var(--ink2);line-height:1.6}
.shadow-inactive{font-size:11.5px;color:var(--mu);font-style:italic;text-align:center;padding:6px 0}

/* ROLL CALL */
.person-row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd2)}
.person-row:last-child{border-bottom:none}
.person-dot{width:7px;height:7px;border-radius:50%;background:var(--gold);flex-shrink:0;margin-top:6px}
.person-nm{font-size:13.5px;color:var(--ink);font-weight:600}
.person-role{font-size:10px;color:var(--gold);letter-spacing:.5px;margin-left:6px}
.person-note{font-size:11px;color:var(--mu);font-style:italic;margin-top:2px;line-height:1.4}

/* WHISPERS */
.whisper{position:relative;background:var(--pan2);border:1px solid var(--bd2);border-radius:2px;padding:10px 13px 10px 15px;margin-bottom:11px;transform:rotate(var(--rot,-.5deg));box-shadow:0 4px 10px rgba(0,0,0,.3)}
.whisper::before{content:'📍';position:absolute;top:-9px;left:12px;font-size:12px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.whisper-tag{font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.whisper-txt{font-size:12px;color:var(--ink2);font-style:italic;line-height:1.55}

.empty-note{font-size:11px;color:var(--mu);font-style:italic;text-align:center;padding:12px 0}
#wtfoot{padding:9px 20px;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--mu);text-align:center;border-top:1px solid var(--bd2);background:var(--pan)}
</style>
</head>
<body>
<textarea id="wtraw" style="display:none;position:absolute;left:-9999px">$1</textarea>
<div id="wtwin">
  <div id="mast">
    <div class="corner-flourish cf-tl">❦</div>
    <div class="corner-flourish cf-tr">❦</div>
    <div id="danger-badge">
      <div id="db-ring"><span id="db-val">—</span></div>
      <div id="db-lbl">Peril</div>
    </div>
    <svg id="compass" viewBox="0 0 42 42" fill="none">
      <circle cx="21" cy="21" r="17" stroke="#B8862E" stroke-width="1.3" opacity=".6"/>
      <circle cx="21" cy="21" r="2" fill="#B8862E"/>
      <path d="M21 6 L24 19 L21 21 L18 19 Z" fill="#E8D9B8" opacity=".85"/>
      <path d="M21 36 L18 23 L21 21 L24 23 Z" fill="#7A6448" opacity=".65"/>
      <path d="M6 21 L19 18 L21 21 L19 24 Z" fill="#7A6448" opacity=".5"/>
      <path d="M36 21 L23 24 L21 21 L23 18 Z" fill="#7A6448" opacity=".5"/>
    </svg>
    <div id="mast-title">The Route Ledger</div>
    <div id="mast-sub">Wheresoever the wagons stop, so stops the tale.</div>
    <div id="chev">▲</div>
  </div>

  <div id="wtbody">
    <div id="navrib">
      <span class="nav-a on" data-jump="leaf-waypoint">Waypoint</span><span class="nav-sep">✦</span>
      <span class="nav-a" data-jump="leaf-omens">Omens</span><span class="nav-sep">✦</span>
      <span class="nav-a" data-jump="leaf-shadow">Shadow</span><span class="nav-sep">✦</span>
      <span class="nav-a" data-jump="leaf-rollcall">Roll Call</span><span class="nav-sep">✦</span>
      <span class="nav-a" data-jump="leaf-whispers">Whispers</span>
    </div>

    <div id="page">
      <div class="leaf" id="leaf-waypoint">
        <div class="leaf-hd"><span class="lh-ico">🗺️</span><span class="lh-txt">Waypoint</span></div>
        <div id="loc-name">—</div>
        <div id="loc-region"></div>
        <div id="loc-desc"></div>
        <div class="lline"><span class="lline-lbl">Date</span><span class="lline-dots"></span><span class="lline-val" id="v-date">—</span></div>
        <div class="lline"><span class="lline-lbl">Season</span><span class="lline-dots"></span><span class="lline-val" id="v-season">—</span></div>
        <div class="lline"><span class="lline-lbl">Weather</span><span class="lline-dots"></span><span class="lline-val" id="v-weather">—</span></div>
      </div>

      <div class="leaf" id="leaf-omens">
        <div class="leaf-hd"><span class="lh-ico">⚖️</span><span class="lh-txt">Omens</span></div>
        <div id="gauge-row"></div>
      </div>

      <div class="leaf" id="leaf-shadow">
        <div class="leaf-hd"><span class="lh-ico">🕸️</span><span class="lh-txt">Aspett's Shadow</span></div>
        <div id="shadow-content"></div>
      </div>

      <div class="leaf" id="leaf-rollcall">
        <div class="leaf-hd"><span class="lh-ico">🎭</span><span class="lh-txt">Roll Call</span></div>
        <div id="rollcall-list"></div>
      </div>

      <div class="leaf" id="leaf-whispers">
        <div class="leaf-hd"><span class="lh-ico">✉️</span><span class="lh-txt">Whispers & Rumors</span></div>
        <div id="whispers-list"></div>
      </div>
    </div>
  </div>

  <div id="wtfoot">✦ Marionetta · world almanac ✦</div>
</div>

<script>
(function(){
function g(id){return document.getElementById(id)}
function esc(v){if(v==null)return'';return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function hexRgb(h){return parseInt(h.slice(1,3),16)+','+parseInt(h.slice(3,5),16)+','+parseInt(h.slice(5,7),16)}

var raw=g('wtraw');var d=null;
if(raw&&raw.value.trim()){
  var dec=document.createElement('textarea');dec.innerHTML=raw.value.trim();
  try{d=JSON.parse(dec.value.trim())}catch(e){}
}
if(!d)d={};

function tierColor(pct){
  if(pct<25)return 'var(--safe)';
  if(pct<50)return 'var(--caution)';
  if(pct<75)return 'var(--concern)';
  return 'var(--danger)';
}
function tierColorInv(pct){return tierColor(100-pct)}

/* WAYPOINT */
var loc=d.location||{};
g('loc-name').textContent=loc.name||'Unknown Waypoint';
g('loc-region').textContent=loc.region||'';
g('loc-desc').textContent=loc.description||'';
g('v-date').textContent=d.date||'—';
g('v-season').textContent=d.season||'—';
g('v-weather').textContent=d.weather||'—';

/* GAUGES */
var GAUGES=[
  {key:'warStatus',ico:'⚔️',lbl:'War Abroad',fn:tierColor},
  {key:'troupeWelcome',ico:'🎪',lbl:"Troupe's Welcome",fn:tierColorInv},
  {key:'ahkonWatch',ico:'👁️',lbl:"Ah'kon Watch",fn:tierColor}
];
var gRow=g('gauge-row');
if(gRow){
  var gh='';
  GAUGES.forEach(function(gg){
    var obj=d[gg.key]||{};
    var lvl=obj.level!=null?obj.level:0;
    var lbl=obj.label||'Unknown';
    var col=gg.fn(lvl);
    gh+='<div class="gcol">'+
      '<span class="gcol-ico">'+gg.ico+'</span>'+
      '<div class="gcol-lbl">'+gg.lbl+'</div>'+
      '<div class="tube"><div class="tube-fill" style="height:'+lvl+'%;background:'+col+'"></div></div>'+
      '<div class="tube-bulb"><div class="tube-bulb-fill" style="background:'+col+'"></div></div>'+
      '<div class="gcol-state" style="color:'+col+'">'+esc(lbl)+'</div>'+
      (obj.note?'<div class="gcol-note">'+esc(obj.note)+'</div>':'')+
    '</div>';
  });
  gRow.innerHTML=gh;
}

/* DANGER BADGE */
var dl=d.dangerLevel||{};
var dlVal=dl.level!=null?dl.level:0;
var dlCol=tierColor(dlVal);
var ring=g('db-ring');
if(ring){ring.style.borderColor=dlCol;ring.style.boxShadow='0 0 10px -2px '+dlCol;}
g('db-val').textContent=dlVal;
g('db-val').style.color=dlCol;

/* ASPETT SHADOW */
var shEl=g('shadow-content');
var sh=d.aspettShadow||{};
if(sh.active&&sh.scheme){
  shEl.innerHTML='<div class="shadow-box"><div class="shadow-ttl">Threat: '+esc(sh.threatLevel||'Unknown')+'</div>'+
    '<div class="shadow-txt">'+esc(sh.scheme)+'</div></div>';
}else{
  shEl.innerHTML='<div class="shadow-inactive">No known activity from Aspett at this time.</div>';
}

/* ROLL CALL */
var rcEl=g('rollcall-list');
var present=d.present||[];
if(present.length){
  rcEl.innerHTML=present.map(function(p){
    return '<div class="person-row"><div class="person-dot"></div><div>'+
      '<span class="person-nm">'+esc(p.name||'—')+'</span>'+
      (p.role?'<span class="person-role">'+esc(p.role)+'</span>':'')+
      (p.note?'<div class="person-note">'+esc(p.note)+'</div>':'')+
    '</div></div>';
  }).join('');
}else{
  rcEl.innerHTML='<div class="empty-note">No one of note nearby.</div>';
}

/* WHISPERS */
var wEl=g('whispers-list');
var rumors=d.rumors||[];
if(rumors.length){
  wEl.innerHTML=rumors.map(function(r,i){
    var rot=(i%2===0?-1:1)*(0.4+Math.random()*0.6);
    return '<div class="whisper" style="--rot:'+rot.toFixed(2)+'deg">'+
      (r.tag?'<div class="whisper-tag">'+esc(r.tag)+'</div>':'')+
      '<div class="whisper-txt">'+esc(r.text||'')+'</div>'+
    '</div>';
  }).join('');
}else{
  wEl.innerHTML='<div class="empty-note">The town keeps quiet, for now.</div>';
}

/* NAV + COLLAPSE */
document.querySelectorAll('.nav-a').forEach(function(a){
  a.addEventListener('click',function(e){
    e.stopPropagation();
    var target=g(this.getAttribute('data-jump'));
    if(target)target.scrollIntoView({behavior:'smooth',block:'start'});
  });
});
var page=g('page');
var leaves=document.querySelectorAll('.leaf');
if(page)page.addEventListener('scroll',function(){
  var best=null,bestDist=1e9;
  leaves.forEach(function(l){
    var dd=Math.abs(l.getBoundingClientRect().top-page.getBoundingClientRect().top-4);
    if(dd<bestDist){bestDist=dd;best=l}
  });
  if(best)document.querySelectorAll('.nav-a').forEach(function(a){a.classList.toggle('on',a.getAttribute('data-jump')===best.id)});
});

var mast=g('mast');
if(mast)mast.addEventListener('click',function(){g('wtwin').classList.toggle('closed')});
})();
</script>
</body>
</html>
