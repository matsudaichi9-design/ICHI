<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LoL Status Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;font-family:'Segoe UI',system-ui,sans-serif;font-size:13px}
.lol-st-root{--acc:#C89B3C;--abg:rgba(200,155,60,.13);--abd:rgba(200,155,60,.28);--bg:#0d0e10;--bg2:#14161a;--bg3:#1c1f25;--bg4:#242830;--tx:#d8c9a8;--tx2:#9a8f7a;--tx3:#5a5548;--bd:rgba(200,155,60,.30);--r:6px;--r2:3px}
.lol-st-root .lolst-win{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);max-width:520px;margin:0 auto;overflow:hidden;box-shadow:0 4px 32px rgba(0,0,0,.7),0 0 0 1px rgba(200,155,60,.08);color:var(--tx)}
.lol-st-root .lolst-wh{display:flex;align-items:center;gap:8px;padding:10px 14px;background:linear-gradient(135deg,var(--bg2),var(--bg3));border-bottom:1px solid var(--bd);cursor:pointer;user-select:none}
.lol-st-root .lolst-sigil{width:28px;height:28px;flex-shrink:0}
.lol-st-root .lolst-title{flex:1;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--acc)}
.lol-st-root .lolst-name{font-size:14px;font-weight:700;color:var(--tx);letter-spacing:.5px}
.lol-st-root .lolst-arr{font-size:16px;color:var(--tx3);transition:transform .3s}
.lol-st-root .lolst-win.closed .lolst-arr{transform:rotate(180deg)}
.lol-st-root .lolst-body{max-height:2000px;overflow:hidden;transition:max-height .35s ease}
.lol-st-root .lolst-win.closed .lolst-body{max-height:0}
.lol-st-root .lolst-tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--bd)}
.lol-st-root .lolst-tab{flex:1;padding:10px 2px;text-align:center;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--tx3);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
.lol-st-root .lolst-tab:hover{color:var(--tx2)}
.lol-st-root .lolst-tab.active{color:var(--acc);border-bottom-color:var(--acc);background:var(--abg)}
.lol-st-root .lolst-panel{display:none;padding:14px}
.lol-st-root .lolst-panel.active{display:block}
.lol-st-root .lolst-sec{display:flex;align-items:center;gap:6px;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--acc);margin-bottom:8px}
.lol-st-root .lolst-sec::before,.lol-st-root .lolst-sec::after{content:'';flex:1;height:1px;background:var(--abd)}
.lol-st-root .igrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.lol-st-root .icard{background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--r2);padding:7px 10px}
.lol-st-root .icard-l{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--tx3);margin-bottom:2px}
.lol-st-root .icard-v{font-size:12px;color:var(--tx);font-weight:600}
.lol-st-root .icard.full{grid-column:1/-1}
.lol-st-root .lolst-bars{margin-bottom:12px}
.lol-st-root .bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.lol-st-root .bar-label{font-size:9px;letter-spacing:1px;color:var(--tx3);width:32px;text-align:right;flex-shrink:0}
.lol-st-root .bar-track{flex:1;height:8px;background:var(--bg4);border-radius:4px;overflow:hidden}
.lol-st-root .bar-fill{height:100%;border-radius:4px;width:0;transition:width .6s ease}
.lol-st-root .bar-hp{background:linear-gradient(90deg,#c85050,#e87070)}
.lol-st-root .bar-mp{background:linear-gradient(90deg,#3a5a9b,#5a88d8)}
.lol-st-root .bar-val{font-size:10px;color:var(--tx2);width:60px;text-align:right;flex-shrink:0}
.lol-st-root .lolst-badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.lol-st-root .lolst-badge{padding:3px 8px;border-radius:99px;font-size:10px;background:var(--bg4);border:1px solid var(--bg3);color:var(--tx2)}
.lol-st-root .lolst-badge.condition{border-color:rgba(200,130,40,.4);color:#d4903a;background:rgba(200,130,40,.1)}
.lol-st-root .lolst-badge.injury{border-color:rgba(200,50,50,.4);color:#e07070;background:rgba(200,50,50,.1)}
.lol-st-root .lolst-badge.empty{color:var(--tx3);font-style:italic}
.lol-st-root .ability-card{background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--r2);padding:10px;margin-bottom:7px;display:flex;gap:10px;align-items:flex-start}
.lol-st-root .rank-badge{width:28px;height:28px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex-shrink:0;border:1px solid currentColor}
.lol-st-root .rank-S{color:#d4af37;background:rgba(212,175,55,.15)}
.lol-st-root .rank-A{color:#c870a0;background:rgba(200,112,160,.15)}
.lol-st-root .rank-B{color:#6090d0;background:rgba(96,144,208,.15)}
.lol-st-root .rank-C{color:#60a870;background:rgba(96,168,112,.15)}
.lol-st-root .rank-D{color:#8a8a8a;background:rgba(138,138,138,.15)}
.lol-st-root .ab-name{font-size:12px;font-weight:700;color:var(--tx);margin-bottom:3px}
.lol-st-root .ab-desc{font-size:11px;color:var(--tx2);line-height:1.5}
.lol-st-root .inv-group{margin-bottom:10px}
.lol-st-root .inv-type-label{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--acc);padding:3px 0;border-bottom:1px solid var(--abd);margin-bottom:6px}
.lol-st-root .inv-item{display:flex;align-items:center;gap:8px;padding:5px 8px;background:var(--bg3);border-radius:var(--r2);margin-bottom:4px}
.lol-st-root .inv-qty{font-size:11px;font-weight:700;color:var(--acc);min-width:24px;text-align:center}
.lol-st-root .inv-name{flex:1;font-size:12px;color:var(--tx);font-weight:600}
.lol-st-root .inv-desc{font-size:10px;color:var(--tx3);margin-top:1px}
.lol-st-root .eq-slot{display:flex;gap:10px;align-items:center;padding:8px 10px;background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--r2);margin-bottom:6px}
.lol-st-root .eq-slot-label{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--tx3);width:68px;flex-shrink:0;text-align:right}
.lol-st-root .eq-slot-line{width:1px;height:28px;background:var(--bd);flex-shrink:0}
.lol-st-root .eq-item{flex:1}
.lol-st-root .eq-name{font-size:12px;font-weight:700;color:var(--tx)}
.lol-st-root .eq-desc{font-size:10px;color:var(--tx3);margin-top:2px}
.lol-st-root .eq-cond{font-size:9px;padding:1px 6px;border-radius:99px;font-weight:700;margin-left:6px;display:inline-block}
.lol-st-root .cond-pristine{color:#70d490;border:1px solid rgba(112,212,144,.4);background:rgba(112,212,144,.1)}
.lol-st-root .cond-good{color:#8a9ab8;border:1px solid rgba(138,154,184,.4);background:rgba(138,154,184,.1)}
.lol-st-root .cond-worn{color:#d9c089;border:1px solid rgba(217,192,137,.4);background:rgba(217,192,137,.1)}
.lol-st-root .cond-damaged{color:#d4883a;border:1px solid rgba(212,136,58,.4);background:rgba(212,136,58,.1)}
.lol-st-root .cond-broken{color:#c8506a;border:1px solid rgba(200,80,106,.4);background:rgba(200,80,106,.1)}
.lol-st-root .eq-empty{font-size:11px;color:var(--tx3);font-style:italic}
.lol-st-root .craft-section{margin-bottom:12px}
.lol-st-root .craft-label{font-size:10px;color:var(--tx3);letter-spacing:.5px;margin-bottom:6px}
.lol-st-root .craft-pills{display:flex;flex-wrap:wrap;gap:5px;min-height:34px}
.lol-st-root .craft-pill{padding:4px 10px;border-radius:99px;font-size:11px;cursor:pointer;background:var(--bg3);border:1px solid var(--bg4);color:var(--tx2);transition:all .15s;user-select:none}
.lol-st-root .craft-pill:hover{border-color:var(--acc);color:var(--acc)}
.lol-st-root .craft-pill.selected{background:var(--abg);border-color:var(--acc);color:var(--acc);font-weight:700}
.lol-st-root .pill-qty{font-size:9px;opacity:.7}
.lol-st-root .craft-sel-box{background:var(--bg3);border:1px dashed var(--abd);border-radius:var(--r2);padding:8px;min-height:36px;font-size:11px;color:var(--tx3);margin-bottom:8px}
.lol-st-root .craft-sel-box.has-items{color:var(--tx2)}
.lol-st-root .craft-intent{width:100%;background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--r2);color:var(--tx);padding:8px 10px;font-size:12px;font-family:inherit;outline:none;resize:none;margin-bottom:8px}
.lol-st-root .craft-intent:focus{border-color:var(--acc)}
.lol-st-root .craft-intent::placeholder{color:var(--tx3)}
.lol-st-root .btn-craft{width:100%;padding:10px;border-radius:var(--r2);font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;background:linear-gradient(135deg,var(--acc),#e8c060);color:#0d0e10;border:none;transition:opacity .2s}
.lol-st-root .btn-craft:hover{opacity:.85}
.lol-st-root .recipe-card{background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--r2);padding:10px;margin-bottom:7px}
.lol-st-root .recipe-hdr{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.lol-st-root .recipe-name{flex:1;font-size:12px;font-weight:700;color:var(--tx)}
.lol-st-root .recipe-q{font-size:9px;font-weight:700;padding:2px 7px;border-radius:99px}
.lol-st-root .q-excellent{color:#d4af37;border:1px solid rgba(212,175,55,.4);background:rgba(212,175,55,.1)}
.lol-st-root .q-good{color:#70b870;border:1px solid rgba(112,184,112,.4);background:rgba(112,184,112,.1)}
.lol-st-root .q-ok{color:#8a8aaa;border:1px solid rgba(138,138,170,.4);background:rgba(138,138,170,.1)}
.lol-st-root .q-bad{color:#c87a3a;border:1px solid rgba(200,122,58,.4);background:rgba(200,122,58,.1)}
.lol-st-root .q-failed{color:#a83838;border:1px solid rgba(168,56,56,.4);background:rgba(168,56,56,.1)}
.lol-st-root .recipe-ingr{font-size:10px;color:var(--tx3);margin-bottom:3px}
.lol-st-root .recipe-result{font-size:11px;color:var(--tx2)}
.lol-st-root .recipe-notes{font-size:10px;color:var(--tx3);font-style:italic;margin-top:3px}
.lol-st-root .btn-del{padding:3px 8px;font-size:10px;border-radius:var(--r2);cursor:pointer;background:rgba(168,56,56,.15);border:1px solid rgba(168,56,56,.35);color:#c87070;flex-shrink:0;transition:all .15s}
.lol-st-root .btn-del:hover{background:rgba(168,56,56,.3)}
.lol-st-root .empty-state{text-align:center;padding:24px 0;color:var(--tx3);font-size:11px;letter-spacing:1px}
.lol-st-root .lolst-foot{border-top:1px solid var(--bd);padding:8px 14px;font-size:9px;color:var(--tx3);text-align:center;letter-spacing:1px;background:var(--bg2);text-transform:uppercase}
.lol-st-root .ln-btn{float:right;font-size:9px;padding:2px 7px;border-radius:99px;cursor:pointer;background:var(--bg4);border:1px solid var(--bd);color:var(--tx3);letter-spacing:1px;user-select:none;transition:all .15s}
.lol-st-root .ln-btn:hover{color:var(--acc);border-color:var(--acc)}
</style>
</head>
<body>
<div class="lol-st-root">
  <textarea class="lolst-data" style="display:none;position:absolute;left:-9999px">$1</textarea>
  <div class="lolst-win">
    <div class="lolst-wh">
      <svg class="lolst-sigil lolst-hdr-sigil" viewBox="0 0 28 28"></svg>
      <div>
        <div class="lolst-title lolst-hdr-title">STATUS TRACKER</div>
        <div class="lolst-name lolst-hdr-name">—</div>
      </div>
      <div class="ln-btn lolst-ln-btn">EN</div>
      <div class="lolst-arr">▲</div>
    </div>
    <div class="lolst-body">
      <div class="lolst-tabs">
        <div class="lolst-tab active"><span class="lolst-t0">STAT</span></div>
        <div class="lolst-tab"><span class="lolst-t1">SKILL</span></div>
        <div class="lolst-tab"><span class="lolst-t2">ITEMS</span></div>
        <div class="lolst-tab"><span class="lolst-t3">GEAR</span></div>
        <div class="lolst-tab"><span class="lolst-t4">CRAFT</span></div>
        <div class="lolst-tab"><span class="lolst-t5">LOG</span></div>
      </div>
      <div class="lolst-panel active">
        <div class="igrid lolst-info-grid"></div>
        <div class="lolst-sec lolst-sec-vital">VITALS</div>
        <div class="lolst-bars lolst-bars-el"></div>
        <div class="lolst-sec lolst-sec-cond">CONDITIONS</div>
        <div class="lolst-badges lolst-cond-el"></div>
      </div>
      <div class="lolst-panel">
        <div class="lolst-sec lolst-sec-skills">ABILITIES</div>
        <div class="lolst-ab-list"></div>
      </div>
      <div class="lolst-panel">
        <div class="lolst-sec lolst-sec-items">INVENTORY</div>
        <div class="lolst-inv-list"></div>
      </div>
      <div class="lolst-panel">
        <div class="lolst-sec lolst-sec-gear">EQUIPMENT</div>
        <div class="lolst-gear-list"></div>
      </div>
      <div class="lolst-panel">
        <div class="lolst-sec lolst-sec-craft">CRAFTING</div>
        <div class="craft-section">
          <div class="craft-label lolst-lbl-ing">Select ingredients from inventory:</div>
          <div class="craft-pills lolst-craft-pills"></div>
        </div>
        <div class="craft-section">
          <div class="craft-label lolst-lbl-sel">Selected:</div>
          <div class="craft-sel-box lolst-craft-sel">—</div>
          <textarea class="craft-intent lolst-craft-intent" rows="2" placeholder="What are you trying to craft?"></textarea>
          <button class="btn-craft lolst-btn-craft">⚒ CRAFT</button>
        </div>
      </div>
      <div class="lolst-panel">
        <div class="lolst-sec lolst-sec-log">RECIPE LOG</div>
        <div class="lolst-recipes-list"></div>
      </div>
    </div>
    <div class="lolst-foot lolst-foot-el">RUNETERRA STATUS SYSTEM</div>
  </div>
</div>

<script>
(function(){
  var roots=document.querySelectorAll('.lol-st-root');
  var R=roots[roots.length-1];
  if(!R)return;

  var S={lang:'en',data:{},sel:[]};

  var RC={demacia:'#4A70B0',noxus:'#9B2020',freljord:'#5FA8C8',ionia:'#9870C0',piltover:'#D4A830',zaun:'#4A8A60',shurima:'#C8A84B',ixtal:'#3A8A50',targon:'#7A8EC8',camavor:'#A83848',shadow_isles:'#2A8060',bilgewater:'#C87840',bandle:'#D4B870',void:'#8A4AC8'};

  var L={
    stat:['STAT','สถานะ'],skill:['SKILL','ทักษะ'],items:['ITEMS','ของ'],gear:['GEAR','อุปกรณ์'],craft:['CRAFT','คราฟ'],log:['LOG','บันทึก'],
    vital:['VITALS','พลังงาน'],cond:['CONDITIONS','สภาพ'],skills:['ABILITIES','ความสามารถ'],inv:['INVENTORY','กระเป๋า'],
    eq:['EQUIPMENT','อาวุธ/ชุด'],cr:['CRAFTING','คราฟ'],lg:['RECIPE LOG','บันทึกสูตร'],
    ing:['Select ingredients from inventory:','เลือกวัตถุดิบจากกระเป๋า:'],
    sel:['Selected:','เลือกแล้ว:'],iph:['What are you trying to craft?','คุณต้องการคราฟอะไร?'],
    cbtn:['⚒ CRAFT','⚒ คราฟ'],del:['DEL','ลบ'],
    no_ab:['No abilities recorded.','ไม่มีความสามารถ'],no_inv:['Inventory is empty.','กระเป๋าว่างเปล่า'],
    no_gear:['No equipment.','ไม่มีอุปกรณ์'],no_rec:['No recipes logged yet.','ยังไม่มีสูตรที่บันทึก'],
    no_craf:['No inventory items available.','ไม่มีวัตถุดิบในกระเป๋า'],
    none:['—','—'],ilbl:['Ingredients:','วัตถุดิบ:'],rlbl:['Result:','ผลลัพธ์:'],
    hp:['HP','HP'],mp:['MP','MP'],
    nm:['Name','ชื่อ'],ag:['Age','อายุ'],gd:['Gender','เพศ'],rg:['Region','ภูมิภาค'],bg:['Background','ภูมิหลัง'],gl:['Goal','เป้าหมาย'],
    foot:['RUNETERRA STATUS SYSTEM','ระบบติดตามสถานะ รูนเทอร์รา'],norm:['Normal','ปกติ']
  };
  function T(k){var a=L[k];if(!a)return k;return S.lang==='th'?a[1]:a[0];}

  function q(cls){return R.querySelector('.'+cls);}
  function qa(sel){return R.querySelectorAll(sel);}

  function hex2rgb(h){var n=parseInt(h.replace('#',''),16);return ((n>>16)&255)+','+((n>>8)&255)+','+(n&255);}

  function applyTheme(col){
    var rgb=hex2rgb(col);
    R.style.setProperty('--acc',col);
    R.style.setProperty('--abg','rgba('+rgb+',.13)');
    R.style.setProperty('--abd','rgba('+rgb+',.28)');
    R.style.setProperty('--bd','rgba('+rgb+',.30)');
  }

  function sigil(r,c){
    var s={
      demacia:'<polygon points="14,2 22,10 22,24 6,24 6,10" fill="none" stroke="'+c+'" stroke-width="1.5"/><line x1="14" y1="2" x2="14" y2="24" stroke="'+c+'" stroke-width="1"/><line x1="6" y1="14" x2="22" y2="14" stroke="'+c+'" stroke-width="1"/>',

      ionia:'<circle cx="14" cy="10" r="4" fill="'+c+'"/><circle cx="14" cy="18" r="4" fill="none" stroke="'+c+'" stroke-width="1.5"/><circle cx="14" cy="14" r="8" fill="none" stroke="'+c+'" stroke-width="1.2"/><circle cx="14" cy="10" r="1.5" fill="#0d0e10"/><circle cx="14" cy="18" r="1.5" fill="'+c+'"/>',
      piltover:'<circle cx="14" cy="14" r="8" fill="none" stroke="'+c+'" stroke-width="1.5"/><circle cx="14" cy="14" r="3" fill="'+c+'"/><line x1="14" y1="2" x2="14" y2="6" stroke="'+c+'" stroke-width="1.5"/><line x1="14" y1="22" x2="14" y2="26" stroke="'+c+'" stroke-width="1.5"/><line x1="2" y1="14" x2="6" y2="14" stroke="'+c+'" stroke-width="1.5"/><line x1="22" y1="14" x2="26" y2="14" stroke="'+c+'" stroke-width="1.5"/>',
      zaun:'<rect x="9" y="4" width="10" height="14" rx="5" fill="none" stroke="'+c+'" stroke-width="1.5"/><line x1="11" y1="18" x2="11" y2="24" stroke="'+c+'" stroke-width="1"/><line x1="17" y1="18" x2="17" y2="24" stroke="'+c+'" stroke-width="1"/><line x1="8" y1="22" x2="20" y2="22" stroke="'+c+'" stroke-width="1.5"/><circle cx="14" cy="10" r="2.5" fill="'+c+'" opacity=".5"/>',
      shurima:'<circle cx="14" cy="14" r="9" fill="none" stroke="'+c+'" stroke-width="1.2"/><polygon points="14,5 16.5,11.5 23,11.5 17.5,15.5 19.5,22 14,18 8.5,22 10.5,15.5 5,11.5 11.5,11.5" fill="'+c+'" opacity=".6"/>',
      ixtal:'<circle cx="14" cy="14" r="6" fill="none" stroke="'+c+'" stroke-width="1.5"/><ellipse cx="14" cy="8" rx="3" ry="5" fill="'+c+'" opacity=".5"/><ellipse cx="14" cy="20" rx="3" ry="5" fill="'+c+'" opacity=".5"/><ellipse cx="8" cy="14" rx="5" ry="3" fill="'+c+'" opacity=".5"/><ellipse cx="20" cy="14" rx="5" ry="3" fill="'+c+'" opacity=".5"/>',
      targon:'<polygon points="14,2 20,24 8,24" fill="none" stroke="'+c+'" stroke-width="1.5"/><circle cx="14" cy="8" r="2" fill="'+c+'"/><circle cx="10" cy="18" r="1.2" fill="'+c+'" opacity=".7"/><circle cx="18" cy="16" r="1" fill="'+c+'" opacity=".5"/>',
      camavor:'<circle cx="14" cy="10" r="7" fill="none" stroke="'+c+'" stroke-width="1.5"/><line x1="10" y1="7" x2="10" y2="3" stroke="'+c+'" stroke-width="1.5"/><line x1="14" y1="6" x2="14" y2="2" stroke="'+c+'" stroke-width="1.5"/><line x1="18" y1="7" x2="18" y2="3" stroke="'+c+'" stroke-width="1.5"/><line x1="14" y1="17" x2="14" y2="26" stroke="'+c+'" stroke-width="1.5"/>',
      shadow_isles:'<circle cx="14" cy="14" r="5" fill="none" stroke="'+c+'" stroke-width="1.5"/><circle cx="8" cy="10" r="2.5" fill="none" stroke="'+c+'" stroke-width="1"/><circle cx="20" cy="10" r="2.5" fill="none" stroke="'+c+'" stroke-width="1"/><circle cx="14" cy="22" r="2.5" fill="none" stroke="'+c+'" stroke-width="1"/><line x1="12" y1="12" x2="9.5" y2="11.5" stroke="'+c+'" stroke-width=".8"/><line x1="16" y1="12" x2="18.5" y2="11.5" stroke="'+c+'" stroke-width=".8"/><line x1="14" y1="19" x2="14" y2="16" stroke="'+c+'" stroke-width=".8"/>',
      bilgewater:'<line x1="14" y1="3" x2="14" y2="26" stroke="'+c+'" stroke-width="1.5"/><line x1="6" y1="9" x2="22" y2="9" stroke="'+c+'" stroke-width="1.5"/><path d="M6,9 Q4,14 6,19 Q10,22 14,26 Q18,22 22,19 Q24,14 22,9" fill="none" stroke="'+c+'" stroke-width="1"/>',
      bandle:'<ellipse cx="14" cy="22" rx="9" ry="3" fill="none" stroke="'+c+'" stroke-width="1"/><rect x="8" y="10" width="12" height="14" rx="2" fill="none" stroke="'+c+'" stroke-width="1.2"/><polygon points="14,2 22,10 6,10" fill="none" stroke="'+c+'" stroke-width="1.5"/><circle cx="14" cy="16" r="2" fill="'+c+'" opacity=".6"/>',
      void:'<ellipse cx="14" cy="14" rx="10" ry="10" fill="none" stroke="'+c+'" stroke-width="1.5"/><ellipse cx="14" cy="14" rx="5" ry="8" fill="'+c+'" opacity=".3"/><ellipse cx="14" cy="14" rx="8" ry="3" fill="'+c+'" opacity=".2"/><circle cx="14" cy="14" r="2.5" fill="'+c+'"/>'
    };
    var def='<circle cx="14" cy="14" r="9" fill="none" stroke="'+c+'" stroke-width="1.2"/><line x1="14" y1="5" x2="14" y2="23" stroke="'+c+'" stroke-width="1"/><line x1="5" y1="14" x2="23" y2="14" stroke="'+c+'" stroke-width="1"/>';
    return s[r]||def;
  }

  function esc(v){if(!v)return '';return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

  function sendToChat(txt){
    setTimeout(function(){
      try{
        var w=window.parent||window;
        var ta=w.document.getElementById('send_textarea')||w.document.querySelector('textarea.chat-input,#textareaAutosize,textarea');
        if(ta){
          var d=Object.getOwnPropertyDescriptor(w.HTMLTextAreaElement.prototype,'value');
          if(d&&d.set)d.set.call(ta,txt);else ta.value=txt;
          ta.dispatchEvent(new Event('input',{bubbles:true}));
          setTimeout(function(){
            try{var sb=w.document.getElementById('send_but');if(sb)sb.click();else ta.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',keyCode:13,bubbles:true}));}catch(e){}
          },150);
          return;
        }
      }catch(e){}
      try{navigator.clipboard.writeText(txt);}catch(e){}
    },450);
  }

  function renderStat(){
    var d=S.data;
    var col=d.theme_color||RC[d.region]||'#C89B3C';
    applyTheme(col);
    q('lolst-hdr-sigil').innerHTML=sigil(d.region,col);
    q('lolst-hdr-name').textContent=d.name||'—';
    q('lolst-t0').textContent=T('stat');q('lolst-t1').textContent=T('skill');
    q('lolst-t2').textContent=T('items');q('lolst-t3').textContent=T('gear');
    q('lolst-t4').textContent=T('craft');q('lolst-t5').textContent=T('log');
    q('lolst-sec-vital').textContent=T('vital');q('lolst-sec-cond').textContent=T('cond');
    q('lolst-sec-skills').textContent=T('skills');q('lolst-sec-items').textContent=T('inv');
    q('lolst-sec-gear').textContent=T('eq');q('lolst-sec-craft').textContent=T('cr');
    q('lolst-sec-log').textContent=T('lg');
    q('lolst-lbl-ing').textContent=T('ing');q('lolst-lbl-sel').textContent=T('sel');
    q('lolst-craft-intent').placeholder=T('iph');q('lolst-btn-craft').textContent=T('cbtn');
    q('lolst-foot-el').textContent=T('foot');
    q('lolst-ln-btn').textContent=S.lang==='en'?'EN':'TH';

    var rows=[[T('nm'),d.name],[T('ag'),d.age],[T('gd'),d.gender],[T('rg'),d.region],[T('bg'),d.background],[T('gl'),d.goal]];
    var gh=q('lolst-info-grid');gh.innerHTML='';
    rows.forEach(function(r,i){
      gh.innerHTML+='<div class="icard'+(i>=4?' full':'')+'"><div class="icard-l">'+esc(r[0])+'</div><div class="icard-v">'+esc(r[1]||'—')+'</div></div>';
    });

    var hp=d.hp||{cur:0,max:100};var mp=d.mana||{cur:0,max:100};
    var bh=q('lolst-bars-el');
    bh.innerHTML='<div class="bar-row"><div class="bar-label">'+T('hp')+'</div><div class="bar-track"><div class="bar-fill bar-hp lolst-bar-hp" data-pct="'+Math.min(100,Math.round(hp.cur/Math.max(1,hp.max)*100))+'"></div></div><div class="bar-val">'+hp.cur+'/'+hp.max+'</div></div>'+
      '<div class="bar-row"><div class="bar-label">'+T('mp')+'</div><div class="bar-track"><div class="bar-fill bar-mp lolst-bar-mp" data-pct="'+Math.min(100,Math.round(mp.cur/Math.max(1,mp.max)*100))+'"></div></div><div class="bar-val">'+mp.cur+'/'+mp.max+'</div></div>';
    setTimeout(function(){
      ['lolst-bar-hp','lolst-bar-mp'].forEach(function(cls){var el=q(cls);if(el)el.style.width=el.getAttribute('data-pct')+'%';});
    },100);

    var conds=d.conditions||[];var injs=d.injuries||[];
    var cb=q('lolst-cond-el');cb.innerHTML='';
    if(!conds.length&&!injs.length){cb.innerHTML='<span class="lolst-badge empty">'+esc(T('norm'))+'</span>';}
    else{
      conds.forEach(function(c){cb.innerHTML+='<span class="lolst-badge condition">'+esc(c)+'</span>';});
      injs.forEach(function(c){cb.innerHTML+='<span class="lolst-badge injury">⚠ '+esc(c)+'</span>';});
    }
  }

  function renderSkills(){
    var ab=S.data.abilities||[];
    var el=q('lolst-ab-list');
    el.innerHTML=ab.length?ab.map(function(a){
      var rk=a.rank||'D';
      return '<div class="ability-card"><div class="rank-badge rank-'+rk+'">'+esc(rk)+'</div><div><div class="ab-name">'+esc(a.name)+'</div><div class="ab-desc">'+esc(a.desc)+'</div></div></div>';
    }).join(''):'<div class="empty-state">'+T('no_ab')+'</div>';
  }

  function renderInventory(){
    var inv=S.data.inventory||[];
    var el=q('lolst-inv-list');
    if(!inv.length){el.innerHTML='<div class="empty-state">'+T('no_inv')+'</div>';return;}
    var gr={};inv.forEach(function(it){var tp=it.type||'Other';if(!gr[tp])gr[tp]=[];gr[tp].push(it);});
    var h='';
    Object.keys(gr).forEach(function(tp){
      h+='<div class="inv-group"><div class="inv-type-label">'+esc(tp)+'</div>';
      gr[tp].forEach(function(it){h+='<div class="inv-item"><div class="inv-qty">×'+esc(it.qty||1)+'</div><div><div class="inv-name">'+esc(it.name)+'</div>'+(it.desc?'<div class="inv-desc">'+esc(it.desc)+'</div>':'')+'</div></div>';});
      h+='</div>';
    });
    el.innerHTML=h;
  }

  function renderGear(){
    var eq=S.data.equipment||[];
    var el=q('lolst-gear-list');
    if(!eq.length){el.innerHTML='<div class="empty-state">'+T('no_gear')+'</div>';return;}
    var sm={};eq.forEach(function(e){sm[e.slot]=e;});
    el.innerHTML=['Main Hand','Off Hand','Armor','Head','Feet','Accessory'].map(function(sl){
      var e=sm[sl];
      var cc=e?'<span class="eq-cond cond-'+(e.condition||'good')+'">'+esc(e.condition||'good')+'</span>':'';
      var cnt=e?'<div class="eq-name">'+esc(e.name)+cc+'</div>'+(e.desc?'<div class="eq-desc">'+esc(e.desc)+'</div>':''):'<div class="eq-empty">—</div>';
      return '<div class="eq-slot"><div class="eq-slot-label">'+esc(sl)+'</div><div class="eq-slot-line"></div><div class="eq-item">'+cnt+'</div></div>';
    }).join('');
  }

  function renderCraft(){
    var inv=S.data.inventory||[];
    var el=q('lolst-craft-pills');
    if(!inv.length){el.innerHTML='<span class="lolst-badge empty">'+T('no_craf')+'</span>';updateCraftSel();return;}
    el.innerHTML=inv.map(function(it,i){
      return '<div class="craft-pill'+(S.sel.indexOf(i)>=0?' selected':'')+'" data-idx="'+i+'">'+esc(it.name)+' <span class="pill-qty">×'+esc(it.qty||1)+'</span></div>';
    }).join('');
    updateCraftSel();
  }

  function updateCraftSel(){
    var inv=S.data.inventory||[];
    var el=q('lolst-craft-sel');
    if(!S.sel.length){el.textContent=T('none');el.classList.remove('has-items');return;}
    el.classList.add('has-items');
    el.textContent=S.sel.map(function(i){var it=inv[i];return it?it.name+' ×'+(it.qty||1):'?';}).join(' + ');
  }

  function renderRecipes(){
    var rc=S.data.recipes||[];
    var el=q('lolst-recipes-list');
    el.innerHTML=rc.length?rc.map(function(r){
      return '<div class="recipe-card"><div class="recipe-hdr"><div class="recipe-name">'+esc(r.name)+'</div><span class="recipe-q q-'+(r.quality||'ok')+'">'+esc(r.quality||'ok')+'</span><button class="btn-del" data-rid="'+r.id+'" data-rname="'+esc(r.name)+'">'+T('del')+'</button></div>'+
        '<div class="recipe-ingr">'+T('ilbl')+' '+esc((r.ingredients||[]).join(', '))+'</div>'+
        '<div class="recipe-result">'+T('rlbl')+' '+esc(r.result||'—')+'</div>'+
        (r.notes?'<div class="recipe-notes">'+esc(r.notes)+'</div>':'')+
      '</div>';
    }).join(''):'<div class="empty-state">'+T('no_rec')+'</div>';
  }

  function renderAll(){renderStat();renderSkills();renderInventory();renderGear();renderCraft();renderRecipes();}

  function doTab(n){
    qa('.lolst-tab').forEach(function(el,i){el.classList.toggle('active',i===n);});
    qa('.lolst-panel').forEach(function(el,i){el.classList.toggle('active',i===n);});
  }

  function safeQ(cls){var el=R.querySelector('.'+cls);return el;}

  function init(){
    var raw=R.querySelector('.lolst-data');
    if(raw&&raw.value&&raw.value.trim()&&raw.value.trim()!=='$1'){
      try{S.data=JSON.parse(raw.value.trim());if(S.data&&S.data.lang)S.lang=S.data.lang;}catch(e){S.data={};}
    }
    try{renderAll();}catch(e){console.warn('[LOL]',e);}

    // Header toggle
    var wh=safeQ('lolst-wh');if(wh)wh.addEventListener('click',function(){var w=safeQ('lolst-win');if(w)w.classList.toggle('closed');});

    // Lang toggle
    var ln=safeQ('lolst-ln-btn');
    if(ln)ln.addEventListener('click',function(e){e.stopPropagation();S.lang=S.lang==='en'?'th':'en';try{renderAll();}catch(e2){}});

    // Tabs
    qa('.lolst-tab').forEach(function(el,i){el.addEventListener('click',function(){doTab(i);});});

    // Craft button
    var cb=safeQ('lolst-btn-craft');
    if(cb)cb.addEventListener('click',function(){
      var inv=S.data.inventory||[];
      if(!S.sel.length){alert(S.lang==='th'?'เลือกวัตถุดิบก่อน':'Select ingredients first.');return;}
      var ci=safeQ('lolst-craft-intent');
      var intent=ci?ci.value.trim():'';
      if(!intent){alert(S.lang==='th'?'ระบุสิ่งที่ต้องการคราฟ':'Describe what you want to craft.');return;}
      var ingr=S.sel.map(function(i){var it=inv[i];return it?it.name+' ×'+(it.qty||1):'?';});
      sendToChat('<'+'LOL_CRAFT>'+JSON.stringify({ingredients:ingr,intent:intent})+'<'+'/LOL_CRAFT>');
      S.sel=[];if(ci)ci.value='';try{renderCraft();}catch(e2){}
    });

    // Craft pill click (event delegation)
    var cp=safeQ('lolst-craft-pills');
    if(cp)cp.addEventListener('click',function(e){
      var pill=e.target.closest('.craft-pill');
      if(!pill)return;
      var idx=parseInt(pill.getAttribute('data-idx'));
      var pos=S.sel.indexOf(idx);
      if(pos>=0)S.sel.splice(pos,1);else S.sel.push(idx);
      try{renderCraft();}catch(e2){}
    });

    // Delete recipe (event delegation)
    var rl=safeQ('lolst-recipes-list');
    if(rl)rl.addEventListener('click',function(e){
      var btn=e.target.closest('.btn-del');
      if(!btn)return;
      var rid=parseInt(btn.getAttribute('data-rid'));
      var rname=btn.getAttribute('data-rname');
      sendToChat('<'+'LOL_RECIPE_DELETE>'+JSON.stringify({recipe_id:rid,recipe_name:rname})+'<'+'/LOL_RECIPE_DELETE>');
    });
  }

  setTimeout(init,0);
})();
</script>
</body>
