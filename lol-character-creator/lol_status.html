<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LoL Status Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --acc:#C89B3C;--abg:rgba(200,155,60,.13);--abd:rgba(200,155,60,.28);
  --bg:#0d0e10;--bg2:#14161a;--bg3:#1c1f25;--bg4:#242830;
  --tx:#d8c9a8;--tx2:#9a8f7a;--tx3:#5a5548;
  --bd:rgba(200,155,60,.30);--r:6px;--r2:3px;
  --font:'Segoe UI',system-ui,sans-serif;
}
html,body{background:transparent;font-family:var(--font);font-size:13px;color:var(--tx)}
.win{
  background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);
  max-width:520px;margin:0 auto;overflow:hidden;
  box-shadow:0 4px 32px rgba(0,0,0,.7),0 0 0 1px rgba(200,155,60,.08);
}
/* HEADER */
.wh{
  display:flex;align-items:center;gap:8px;padding:10px 14px;
  background:linear-gradient(135deg,var(--bg2),var(--bg3));
  border-bottom:1px solid var(--bd);cursor:pointer;user-select:none;
}
.wh-sigil{width:28px;height:28px;flex-shrink:0}
.wh-title{flex:1;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--acc)}
.wh-name{font-size:14px;font-weight:700;color:var(--tx);letter-spacing:.5px}
.wh-toggle{font-size:16px;color:var(--tx3);transition:transform .3s}
.win.closed .wh-toggle{transform:rotate(180deg)}
.wbody{max-height:2000px;overflow:hidden;transition:max-height .35s ease}
.win.closed .wbody{max-height:0}
/* TABS */
.tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--bd)}
.tab{
  flex:1;padding:10px 2px;text-align:center;font-size:9px;letter-spacing:1px;
  text-transform:uppercase;color:var(--tx3);cursor:pointer;
  border-bottom:2px solid transparent;transition:all .2s;
}
.tab:hover{color:var(--tx2)}
.tab.active{color:var(--acc);border-bottom-color:var(--acc);background:var(--abg)}
/* PANELS */
.panel{display:none;padding:14px}
.panel.active{display:block}
/* SECTION HEADERS */
.sec{
  display:flex;align-items:center;gap:6px;
  font-size:9px;letter-spacing:2px;text-transform:uppercase;
  color:var(--acc);margin-bottom:8px;
}
.sec::before{content:'';flex:1;height:1px;background:var(--abd)}
.sec::after{content:'';flex:1;height:1px;background:var(--abd)}
/* INFO GRID */
.igrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.icard{background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--r2);padding:7px 10px}
.icard-l{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--tx3);margin-bottom:2px}
.icard-v{font-size:12px;color:var(--tx);font-weight:600}
.icard.full{grid-column:1/-1}
/* HP/MANA BARS */
.bars{margin-bottom:12px}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bar-label{font-size:9px;letter-spacing:1px;color:var(--tx3);width:32px;text-align:right;flex-shrink:0}
.bar-track{flex:1;height:8px;background:var(--bg4);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;width:0;transition:width .6s ease}
.bar-hp{background:linear-gradient(90deg,#c85050,#e87070)}
.bar-mp{background:linear-gradient(90deg,#3a5a9b,#5a88d8)}
.bar-val{font-size:10px;color:var(--tx2);width:60px;text-align:right;flex-shrink:0}
/* CONDITIONS */
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.badge{
  padding:3px 8px;border-radius:99px;font-size:10px;
  background:var(--bg4);border:1px solid var(--bg3);color:var(--tx2);
}
.badge.condition{border-color:rgba(200,130,40,.4);color:#d4903a;background:rgba(200,130,40,.1)}
.badge.injury{border-color:rgba(200,50,50,.4);color:#e07070;background:rgba(200,50,50,.1)}
.badge.empty{color:var(--tx3);font-style:italic}
/* ABILITY CARDS */
.ability-card{
  background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--r2);
  padding:10px;margin-bottom:7px;display:flex;gap:10px;align-items:flex-start;
}
.rank-badge{
  width:28px;height:28px;border-radius:4px;display:flex;align-items:center;
  justify-content:center;font-weight:900;font-size:13px;flex-shrink:0;
  border:1px solid currentColor;
}
.rank-S{color:#d4af37;background:rgba(212,175,55,.15)}
.rank-A{color:#c870a0;background:rgba(200,112,160,.15)}
.rank-B{color:#6090d0;background:rgba(96,144,208,.15)}
.rank-C{color:#60a870;background:rgba(96,168,112,.15)}
.rank-D{color:#8a8a8a;background:rgba(138,138,138,.15)}
.ability-info .ab-name{font-size:12px;font-weight:700;color:var(--tx);margin-bottom:3px}
.ability-info .ab-desc{font-size:11px;color:var(--tx2);line-height:1.5}
/* INVENTORY */
.inv-group{margin-bottom:10px}
.inv-type-label{
  font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--acc);
  padding:3px 0;border-bottom:1px solid var(--abd);margin-bottom:6px;
}
.inv-item{
  display:flex;align-items:center;gap:8px;padding:5px 8px;
  background:var(--bg3);border-radius:var(--r2);margin-bottom:4px;
}
.inv-qty{
  font-size:11px;font-weight:700;color:var(--acc);
  min-width:24px;text-align:center;
}
.inv-name{flex:1;font-size:12px;color:var(--tx);font-weight:600}
.inv-desc{font-size:10px;color:var(--tx3);margin-top:1px}
/* EQUIPMENT SLOTS */
.eq-slot{
  display:flex;gap:10px;align-items:center;padding:8px 10px;
  background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--r2);margin-bottom:6px;
}
.eq-slot-label{
  font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--tx3);
  width:68px;flex-shrink:0;text-align:right;
}
.eq-slot-line{width:1px;height:28px;background:var(--bd);flex-shrink:0}
.eq-item{flex:1}
.eq-name{font-size:12px;font-weight:700;color:var(--tx)}
.eq-desc{font-size:10px;color:var(--tx3);margin-top:2px}
.eq-cond{font-size:9px;padding:1px 6px;border-radius:99px;font-weight:700;margin-left:6px;display:inline-block}
.cond-pristine{color:#70d490;border:1px solid rgba(112,212,144,.4);background:rgba(112,212,144,.1)}
.cond-good{color:#8a9ab8;border:1px solid rgba(138,154,184,.4);background:rgba(138,154,184,.1)}
.cond-worn{color:#d9c089;border:1px solid rgba(217,192,137,.4);background:rgba(217,192,137,.1)}
.cond-damaged{color:#d4883a;border:1px solid rgba(212,136,58,.4);background:rgba(212,136,58,.1)}
.cond-broken{color:#c8506a;border:1px solid rgba(200,80,106,.4);background:rgba(200,80,106,.1)}
.eq-empty{font-size:11px;color:var(--tx3);font-style:italic}
/* CRAFTING */
.craft-section{margin-bottom:12px}
.craft-label{font-size:10px;color:var(--tx3);letter-spacing:.5px;margin-bottom:6px}
.craft-pills{display:flex;flex-wrap:wrap;gap:5px;min-height:34px}
.craft-pill{
  padding:4px 10px;border-radius:99px;font-size:11px;cursor:pointer;
  background:var(--bg3);border:1px solid var(--bg4);color:var(--tx2);
  transition:all .15s;user-select:none;
}
.craft-pill:hover{border-color:var(--acc);color:var(--acc)}
.craft-pill.selected{background:var(--abg);border-color:var(--acc);color:var(--acc);font-weight:700}
.craft-pill .qty{font-size:9px;color:inherit;opacity:.7}
.craft-selected{
  background:var(--bg3);border:1px dashed var(--abd);border-radius:var(--r2);
  padding:8px;min-height:36px;font-size:11px;color:var(--tx3);margin-bottom:8px;
}
.craft-selected.has-items{color:var(--tx2)}
.craft-intent{
  width:100%;background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--r2);
  color:var(--tx);padding:8px 10px;font-size:12px;font-family:var(--font);
  outline:none;resize:none;margin-bottom:8px;
}
.craft-intent:focus{border-color:var(--acc)}
.craft-intent::placeholder{color:var(--tx3)}
.btn-craft{
  width:100%;padding:10px;border-radius:var(--r2);font-size:11px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;cursor:pointer;
  background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc),#fff 20%));
  color:#0d0e10;border:none;transition:opacity .2s;
}
.btn-craft:hover{opacity:.85}
.btn-craft:disabled{opacity:.4;cursor:default}
/* RECIPES */
.recipe-card{
  background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--r2);
  padding:10px;margin-bottom:7px;
}
.recipe-header{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.recipe-name{flex:1;font-size:12px;font-weight:700;color:var(--tx)}
.recipe-quality{font-size:9px;font-weight:700;padding:2px 7px;border-radius:99px}
.q-excellent{color:#d4af37;border:1px solid rgba(212,175,55,.4);background:rgba(212,175,55,.1)}
.q-good{color:#70b870;border:1px solid rgba(112,184,112,.4);background:rgba(112,184,112,.1)}
.q-ok{color:#8a8aaa;border:1px solid rgba(138,138,170,.4);background:rgba(138,138,170,.1)}
.q-bad{color:#c87a3a;border:1px solid rgba(200,122,58,.4);background:rgba(200,122,58,.1)}
.q-failed{color:#a83838;border:1px solid rgba(168,56,56,.4);background:rgba(168,56,56,.1)}
.recipe-ingredients{font-size:10px;color:var(--tx3);margin-bottom:3px}
.recipe-result{font-size:11px;color:var(--tx2)}
.recipe-notes{font-size:10px;color:var(--tx3);font-style:italic;margin-top:3px}
.btn-del{
  padding:3px 8px;font-size:10px;border-radius:var(--r2);cursor:pointer;
  background:rgba(168,56,56,.15);border:1px solid rgba(168,56,56,.35);color:#c87070;
  flex-shrink:0;transition:all .15s;
}
.btn-del:hover{background:rgba(168,56,56,.3)}
.empty-state{text-align:center;padding:24px 0;color:var(--tx3);font-size:11px;letter-spacing:1px}
/* FOOTER */
.wf{
  border-top:1px solid var(--bd);padding:8px 14px;
  font-size:9px;color:var(--tx3);text-align:center;letter-spacing:1px;
  background:var(--bg2);text-transform:uppercase;
}
/* LANG TOGGLE */
.ln-toggle{
  float:right;font-size:9px;padding:2px 7px;border-radius:99px;cursor:pointer;
  background:var(--bg4);border:1px solid var(--bd);color:var(--tx3);letter-spacing:1px;
  user-select:none;transition:all .15s;
}
.ln-toggle:hover{color:var(--acc);border-color:var(--acc)}
</style>
</head>
<body>
<textarea id="raw" style="display:none;position:absolute;left:-9999px">$1</textarea>

<div class="win" id="win">
  <div class="wh" onclick="W.toggle()">
    <svg class="wh-sigil" id="hdr-sigil" viewBox="0 0 28 28"></svg>
    <div>
      <div class="wh-title" id="hdr-title">STATUS TRACKER</div>
      <div class="wh-name" id="hdr-name">—</div>
    </div>
    <div class="ln-toggle" id="lnBtn" onclick="event.stopPropagation();W.toggleLang()">EN</div>
    <div class="wh-toggle">▲</div>
  </div>
  <div class="wbody">
    <div class="tabs">
      <div class="tab active" onclick="W.tab(0)"><span id="t0">STAT</span></div>
      <div class="tab" onclick="W.tab(1)"><span id="t1">SKILL</span></div>
      <div class="tab" onclick="W.tab(2)"><span id="t2">ITEMS</span></div>
      <div class="tab" onclick="W.tab(3)"><span id="t3">GEAR</span></div>
      <div class="tab" onclick="W.tab(4)"><span id="t4">CRAFT</span></div>
      <div class="tab" onclick="W.tab(5)"><span id="t5">LOG</span></div>
    </div>
    <!-- STAT -->
    <div class="panel active" id="p0">
      <div class="igrid" id="info-grid"></div>
      <div class="sec" id="sec-vital">VITALS</div>
      <div class="bars" id="bars"></div>
      <div class="sec" id="sec-cond">CONDITIONS</div>
      <div class="badges" id="conditions"></div>
    </div>
    <!-- SKILLS -->
    <div class="panel" id="p1">
      <div class="sec" id="sec-skills">ABILITIES</div>
      <div id="abilities-list"></div>
    </div>
    <!-- ITEMS -->
    <div class="panel" id="p2">
      <div class="sec" id="sec-items">INVENTORY</div>
      <div id="inventory-list"></div>
    </div>
    <!-- GEAR -->
    <div class="panel" id="p3">
      <div class="sec" id="sec-gear">EQUIPMENT</div>
      <div id="gear-list"></div>
    </div>
    <!-- CRAFT -->
    <div class="panel" id="p4">
      <div class="sec" id="sec-craft">CRAFTING</div>
      <div class="craft-section">
        <div class="craft-label" id="lbl-ingredients">Select ingredients from inventory:</div>
        <div class="craft-pills" id="craft-pills"></div>
      </div>
      <div class="craft-section">
        <div class="craft-label" id="lbl-selected">Selected:</div>
        <div class="craft-selected" id="craft-selected-display">—</div>
        <textarea class="craft-intent" id="craft-intent" rows="2" placeholder="What are you trying to craft?"></textarea>
        <button class="btn-craft" id="btn-craft" onclick="W.doCraft()">⚒ CRAFT</button>
      </div>
    </div>
    <!-- LOG -->
    <div class="panel" id="p5">
      <div class="sec" id="sec-log">RECIPE LOG</div>
      <div id="recipes-list"></div>
    </div>
  </div>
  <div class="wf" id="footer">RUNETERRA STATUS SYSTEM</div>
</div>

<script>
var W=(function(){
  var S={lang:'en',data:{},craftSel:[]};

  var REGION_COLOR={
    demacia:'#4A70B0',noxus:'#9B2020',freljord:'#5FA8C8',ionia:'#9870C0',
    piltover:'#D4A830',zaun:'#4A8A60',shurima:'#C8A84B',ixtal:'#3A8A50',
    targon:'#7A8EC8',camavor:'#A83848',shadow_isles:'#2A8060',
    bilgewater:'#C87840',bandle:'#D4B870',void:'#8A4AC8'
  };

  var L={
    stat:['STAT','สถานะ'],skill:['SKILL','ทักษะ'],items:['ITEMS','ของ'],
    gear:['GEAR','อุปกรณ์'],craft:['CRAFT','คราฟ'],log:['LOG','บันทึก'],
    vital:['VITALS','พลังงาน'],cond:['CONDITIONS','สภาพ'],
    skills:['ABILITIES','ความสามารถ'],inv:['INVENTORY','กระเป๋า'],
    eq:['EQUIPMENT','อาวุธ/ชุด'],cr:['CRAFTING','คราฟ'],lg:['RECIPE LOG','บันทึกสูตร'],
    ingredients:['Select ingredients from inventory:','เลือกวัตถุดิบจากกระเป๋า:'],
    selected:['Selected:','เลือกแล้ว:'],
    intent_ph:['What are you trying to craft?','คุณต้องการคราฟอะไร?'],
    craft_btn:['⚒ CRAFT','⚒ คราฟ'],
    del:['DEL','ลบ'],
    no_ability:['No abilities recorded.','ไม่มีความสามารถ'],
    no_inv:['Inventory is empty.','กระเป๋าว่างเปล่า'],
    no_gear:['No equipment.','ไม่มีอุปกรณ์'],
    no_recipe:['No recipes logged yet.','ยังไม่มีสูตรที่บันทึก'],
    no_inv_craft:['No inventory items available.','ไม่มีวัตถุดิบในกระเป๋า'],
    sel_none:['—','—'],
    ingredients_lbl:['Ingredients:','วัตถุดิบ:'],
    result_lbl:['Result:','ผลลัพธ์:'],
    hp:['HP','HP'],mp:['MP','MP'],
    name:['Name','ชื่อ'],age:['Age','อายุ'],gender:['Gender','เพศ'],
    region:['Region','ภูมิภาค'],bg:['Background','ภูมิหลัง'],goal:['Goal','เป้าหมาย'],
    footer:['RUNETERRA STATUS SYSTEM','ระบบติดตามสถานะ รูนเทอร์รา']
  };

  function t(k){return S.lang==='th'?L[k][1]:L[k][0];}

  function hexToRgb(hex){
    var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    return r+','+g+','+b;
  }

  function applyTheme(col){
    var rgb=hexToRgb(col);
    var el=document.getElementById('win');
    el.style.setProperty('--acc',col);
    el.style.setProperty('--abg','rgba('+rgb+',.13)');
    el.style.setProperty('--abd','rgba('+rgb+',.28)');
    el.style.setProperty('--bd','rgba('+rgb+',.30)');
  }

  function sigil(r,col){
    var c=col||'#C89B3C';
    var s={
      demacia:'<polygon points="14,2 22,10 22,24 6,24 6,10" fill="none" stroke="'+c+'" stroke-width="1.5"/><line x1="14" y1="2" x2="14" y2="24" stroke="'+c+'" stroke-width="1"/><line x1="6" y1="14" x2="22" y2="14" stroke="'+c+'" stroke-width="1"/>',
      noxus:'<polygon points="14,3 24,25 4,25" fill="none" stroke="'+c+'" stroke-width="1.5"/><polygon points="14,9 20,22 8,22" fill="'+c+'" opacity=".3"/>',
      freljord:'<line x1="14" y1="2" x2="14" y2="26" stroke="'+c+'" stroke-width="1.5"/><line x1="2" y1="14" x2="26" y2="14" stroke="'+c+'" stroke-width="1.5"/><line x1="5.5" y1="5.5" x2="22.5" y2="22.5" stroke="'+c+'" stroke-width="1"/><line x1="22.5" y1="5.5" x2="5.5" y2="22.5" stroke="'+c+'" stroke-width="1"/><circle cx="14" cy="14" r="3" fill="'+c+'"/>',
      ionia:'<circle cx="14" cy="10" r="4" fill="'+c+'"/><circle cx="14" cy="18" r="4" fill="none" stroke="'+c+'" stroke-width="1.5"/><circle cx="14" cy="14" r="8" fill="none" stroke="'+c+'" stroke-width="1.2"/><circle cx="14" cy="10" r="1.5" fill="#0d0e10"/><circle cx="14" cy="18" r="1.5" fill="'+c+'"/>',
      piltover:'<circle cx="14" cy="14" r="8" fill="none" stroke="'+c+'" stroke-width="1.5"/><circle cx="14" cy="14" r="3" fill="'+c+'"/><line x1="14" y1="2" x2="14" y2="6" stroke="'+c+'" stroke-width="1.5"/><line x1="14" y1="22" x2="14" y2="26" stroke="'+c+'" stroke-width="1.5"/><line x1="2" y1="14" x2="6" y2="14" stroke="'+c+'" stroke-width="1.5"/><line x1="22" y1="14" x2="26" y2="14" stroke="'+c+'" stroke-width="1.5"/>',
      zaun:'<rect x="9" y="4" width="10" height="14" rx="5" fill="none" stroke="'+c+'" stroke-width="1.5"/><line x1="11" y1="18" x2="11" y2="24" stroke="'+c+'" stroke-width="1"/><line x1="17" y1="18" x2="17" y2="24" stroke="'+c+'" stroke-width="1"/><line x1="8" y1="22" x2="20" y2="22" stroke="'+c+'" stroke-width="1.5"/><circle cx="14" cy="10" r="2.5" fill="'+c+'" opacity=".5"/>',
      shurima:'<circle cx="14" cy="14" r="9" fill="none" stroke="'+c+'" stroke-width="1.2"/><polygon points="14,5 16.5,11.5 23,11.5 17.5,15.5 19.5,22 14,18 8.5,22 10.5,15.5 5,11.5 11.5,11.5" fill="'+c+'" opacity=".6"/>',
      ixtal:'<circle cx="14" cy="14" r="6" fill="none" stroke="'+c+'" stroke-width="1.5"/><ellipse cx="14" cy="8" rx="3" ry="5" fill="'+c+'" opacity=".5"/><ellipse cx="14" cy="20" rx="3" ry="5" fill="'+c+'" opacity=".5"/><ellipse cx="8" cy="14" rx="5" ry="3" fill="'+c+'" opacity=".5"/><ellipse cx="20" cy="14" rx="5" ry="3" fill="'+c+'" opacity=".5"/>',
      targon:'<polygon points="14,2 20,24 8,24" fill="none" stroke="'+c+'" stroke-width="1.5"/><circle cx="14" cy="8" r="2" fill="'+c+'"/><circle cx="10" cy="18" r="1.2" fill="'+c+'" opacity=".7"/><circle cx="18" cy="16" r="1" fill="'+c+'" opacity=".5"/>',
      camavor:'<circle cx="14" cy="10" r="7" fill="none" stroke="'+c+'" stroke-width="1.5"/><line x1="10" y1="7" x2="10" y2="3" stroke="'+c+'" stroke-width="1.5"/><line x1="14" y1="6" x2="14" y2="2" stroke="'+c+'" stroke-width="1.5"/><line x1="18" y1="7" x2="18" y2="3" stroke="'+c+'" stroke-width="1.5"/><line x1="14" y1="17" x2="14" y2="26" stroke="'+c+'" stroke-width="1.5"/>',
      shadow_isles:'<circle cx="14" cy="14" r="5" fill="none" stroke="'+c+'" stroke-width="1.5"/><circle cx="8" cy="10" r="2.5" fill="none" stroke="'+c+'" stroke-width="1"/><circle cx="20" cy="10" r="2.5" fill="none" stroke="'+c+'" stroke-width="1"/><circle cx="14" cy="22" r="2.5" fill="none" stroke="'+c+'" stroke-width="1"/><line x1="12" y1="12" x2="9.5" y2="11.5" stroke="'+c+'" stroke-width=".8"/><line x1="16" y1="12" x2="18.5" y2="11.5" stroke="'+c+'" stroke-width=".8"/><line x1="14" y1="19" x2="14" y2="16" stroke="'+c+'" stroke-width=".8"/>',
      bilgewater:'<line x1="14" y1="3" x2="14" y2="26" stroke="'+c+'" stroke-width="1.5"/><line x1="6" y1="9" x2="22" y2="9" stroke="'+c+'" stroke-width="1.5"/><path d="M6,9 Q4,14 6,19 Q10,22 14,26 Q18,22 22,19 Q24,14 22,9" fill="none" stroke="'+c+'" stroke-width="1"/>',
      bandle:'<ellipse cx="14" cy="22" rx="9" ry="3" fill="none" stroke="'+c+'" stroke-width="1"/><rect x="8" y="10" width="12" height="14" rx="2" fill="none" stroke="'+c+'" stroke-width="1.2"/><polygon points="14,2 22,10 6,10" fill="none" stroke="'+c+'" stroke-width="1.5"/><circle cx="14" cy="16" r="2" fill="'+c+'" opacity=".6"/>',
      void:'<ellipse cx="14" cy="14" rx="10" ry="10" fill="none" stroke="'+c+'" stroke-width="1.5"/><ellipse cx="14" cy="14" rx="5" ry="8" fill="'+c+'" opacity=".3"/><ellipse cx="14" cy="14" rx="8" ry="3" fill="'+c+'" opacity=".2"/><circle cx="14" cy="14" r="2.5" fill="'+c+'"/>'
    };
    var def='<circle cx="14" cy="14" r="9" fill="none" stroke="'+c+'" stroke-width="1.2"/><line x1="14" y1="5" x2="14" y2="23" stroke="'+c+'" stroke-width="1"/><line x1="5" y1="14" x2="23" y2="14" stroke="'+c+'" stroke-width="1"/>';
    return '<svg viewBox="0 0 28 28" class="wh-sigil">'+(s[r]||def)+'</svg>';
  }

  function esc(s){
    if(!s)return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function sendToChat(txt){
    setTimeout(function(){
      try{
        var w=window.parent||window;
        var ta=w.document.getElementById('send_textarea')||
               w.document.querySelector('textarea.chat-input,#textareaAutosize,textarea');
        if(ta){
          var d=Object.getOwnPropertyDescriptor(w.HTMLTextAreaElement.prototype,'value');
          if(d&&d.set)d.set.call(ta,txt);else ta.value=txt;
          ta.dispatchEvent(new Event('input',{bubbles:true}));
          setTimeout(function(){
            try{
              var sb=w.document.getElementById('send_but');
              if(sb)sb.click();
              else ta.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',keyCode:13,bubbles:true}));
            }catch(e){}
          },150);
          return;
        }
      }catch(e){}
      try{navigator.clipboard.writeText(txt);}catch(e){}
    },450);
  }

  function renderStat(){
    var d=S.data;
    var ln=S.lang==='th'?1:0;
    var col=d.theme_color||REGION_COLOR[d.region]||'#C89B3C';
    applyTheme(col);

    // header sigil
    document.getElementById('hdr-sigil').innerHTML=sigil(d.region,col).replace(/<svg[^>]*>/,'').replace(/<\/svg>/,'');
    document.getElementById('hdr-name').textContent=d.name||'—';
    document.getElementById('hdr-title').textContent='STATUS TRACKER';

    // tab labels
    document.getElementById('t0').textContent=t('stat');
    document.getElementById('t1').textContent=t('skill');
    document.getElementById('t2').textContent=t('items');
    document.getElementById('t3').textContent=t('gear');
    document.getElementById('t4').textContent=t('craft');
    document.getElementById('t5').textContent=t('log');

    // section labels
    document.getElementById('sec-vital').textContent=t('vital');
    document.getElementById('sec-cond').textContent=t('cond');
    document.getElementById('sec-skills').textContent=t('skills');
    document.getElementById('sec-items').textContent=t('inv');
    document.getElementById('sec-gear').textContent=t('eq');
    document.getElementById('sec-craft').textContent=t('cr');
    document.getElementById('sec-log').textContent=t('lg');
    document.getElementById('lbl-ingredients').textContent=t('ingredients');
    document.getElementById('lbl-selected').textContent=t('selected');
    document.getElementById('craft-intent').placeholder=t('intent_ph');
    document.getElementById('btn-craft').textContent=t('craft_btn');
    document.getElementById('footer').textContent=t('footer');

    // info grid
    var rows=[
      [t('name'),d.name||'—'],
      [t('age'),d.age||'—'],
      [t('gender'),d.gender||'—'],
      [t('region'),d.region||'—'],
      [t('bg'),d.background||'—'],
      [t('goal'),d.goal||'—']
    ];
    var gh=document.getElementById('info-grid');
    gh.innerHTML='';
    rows.forEach(function(r,i){
      var cls='icard'+(i>=4?' full':'');
      gh.innerHTML+='<div class="'+cls+'"><div class="icard-l">'+esc(r[0])+'</div><div class="icard-v">'+esc(r[1])+'</div></div>';
    });

    // bars
    var hp=d.hp||{cur:0,max:100};var mp=d.mana||{cur:0,max:100};
    var bh=document.getElementById('bars');
    bh.innerHTML='<div class="bar-row"><div class="bar-label">'+t('hp')+'</div><div class="bar-track"><div class="bar-fill bar-hp" id="bar-hp" data-pct="'+Math.min(100,Math.round(hp.cur/Math.max(1,hp.max)*100))+'"></div></div><div class="bar-val">'+hp.cur+'/'+hp.max+'</div></div>'+
    '<div class="bar-row"><div class="bar-label">'+t('mp')+'</div><div class="bar-track"><div class="bar-fill bar-mp" id="bar-mp" data-pct="'+Math.min(100,Math.round(mp.cur/Math.max(1,mp.max)*100))+'"></div></div><div class="bar-val">'+mp.cur+'/'+mp.max+'</div></div>';
    setTimeout(function(){
      ['bar-hp','bar-mp'].forEach(function(id){
        var el=document.getElementById(id);
        if(el)el.style.width=el.getAttribute('data-pct')+'%';
      });
    },100);

    // conditions
    var conds=d.conditions||[];var injs=d.injuries||[];
    var cb=document.getElementById('conditions');
    cb.innerHTML='';
    if(!conds.length&&!injs.length){
      cb.innerHTML='<span class="badge empty">'+esc(S.lang==='th'?'ปกติ':'Normal')+'</span>';
    } else {
      conds.forEach(function(c){cb.innerHTML+='<span class="badge condition">'+esc(c)+'</span>';});
      injs.forEach(function(c){cb.innerHTML+='<span class="badge injury">⚠ '+esc(c)+'</span>';});
    }
  }

  function renderSkills(){
    var d=S.data;var ab=d.abilities||[];
    var el=document.getElementById('abilities-list');
    if(!ab.length){el.innerHTML='<div class="empty-state">'+t('no_ability')+'</div>';return;}
    el.innerHTML=ab.map(function(a){
      var rk=a.rank||'D';
      return '<div class="ability-card"><div class="rank-badge rank-'+rk+'">'+esc(rk)+'</div>'+
        '<div class="ability-info"><div class="ab-name">'+esc(a.name)+'</div><div class="ab-desc">'+esc(a.desc)+'</div></div></div>';
    }).join('');
  }

  function renderInventory(){
    var d=S.data;var inv=d.inventory||[];
    var el=document.getElementById('inventory-list');
    if(!inv.length){el.innerHTML='<div class="empty-state">'+t('no_inv')+'</div>';return;}
    var groups={};
    inv.forEach(function(item){var tp=item.type||'Other';if(!groups[tp])groups[tp]=[];groups[tp].push(item);});
    var html='';
    Object.keys(groups).forEach(function(tp){
      html+='<div class="inv-group"><div class="inv-type-label">'+esc(tp)+'</div>';
      groups[tp].forEach(function(item){
        html+='<div class="inv-item"><div class="inv-qty">×'+esc(item.qty||1)+'</div>'+
          '<div><div class="inv-name">'+esc(item.name)+'</div>'+(item.desc?'<div class="inv-desc">'+esc(item.desc)+'</div>':'')+'</div></div>';
      });
      html+='</div>';
    });
    el.innerHTML=html;
  }

  function renderGear(){
    var d=S.data;var eq=d.equipment||[];
    var SLOTS=['Main Hand','Off Hand','Armor','Head','Feet','Accessory'];
    var el=document.getElementById('gear-list');
    if(!eq.length){el.innerHTML='<div class="empty-state">'+t('no_gear')+'</div>';return;}
    var slotMap={};eq.forEach(function(e){slotMap[e.slot]=e;});
    el.innerHTML=SLOTS.map(function(slot){
      var e=slotMap[slot];
      var cc=e?'<span class="eq-cond cond-'+(e.condition||'good')+'">'+esc(e.condition||'good')+'</span>':'';
      var content=e?
        '<div class="eq-name">'+esc(e.name)+cc+'</div>'+(e.desc?'<div class="eq-desc">'+esc(e.desc)+'</div>':''):
        '<div class="eq-empty">—</div>';
      return '<div class="eq-slot"><div class="eq-slot-label">'+esc(slot)+'</div><div class="eq-slot-line"></div><div class="eq-item">'+content+'</div></div>';
    }).join('');
  }

  function renderCraft(){
    var inv=S.data.inventory||[];
    var el=document.getElementById('craft-pills');
    if(!inv.length){el.innerHTML='<span class="badge empty">'+t('no_inv_craft')+'</span>';return;}
    el.innerHTML=inv.map(function(item,i){
      var sel=S.craftSel.indexOf(i)>=0?' selected':'';
      return '<div class="craft-pill'+sel+'" onclick="W.toggleCraft('+i+')" data-idx="'+i+'">'+
        esc(item.name)+' <span class="qty">×'+esc(item.qty||1)+'</span></div>';
    }).join('');
    renderCraftSelected();
  }

  function renderCraftSelected(){
    var inv=S.data.inventory||[];
    var el=document.getElementById('craft-selected-display');
    if(!S.craftSel.length){el.textContent=t('sel_none');el.classList.remove('has-items');return;}
    el.classList.add('has-items');
    el.textContent=S.craftSel.map(function(i){
      var item=inv[i];return item?item.name+' ×'+(item.qty||1):'?';
    }).join(' + ');
  }

  function renderRecipes(){
    var d=S.data;var rc=d.recipes||[];
    var el=document.getElementById('recipes-list');
    if(!rc.length){el.innerHTML='<div class="empty-state">'+t('no_recipe')+'</div>';return;}
    el.innerHTML=rc.map(function(r){
      var qc='q-'+(r.quality||'ok');
      return '<div class="recipe-card">'+
        '<div class="recipe-header">'+
          '<div class="recipe-name">'+esc(r.name)+'</div>'+
          '<span class="recipe-quality '+qc+'">'+esc(r.quality||'ok')+'</span>'+
          '<button class="btn-del" onclick="W.deleteRecipe('+r.id+',\''+esc(r.name)+'\')">'+t('del')+'</button>'+
        '</div>'+
        '<div class="recipe-ingredients">'+t('ingredients_lbl')+' '+esc((r.ingredients||[]).join(', '))+'</div>'+
        '<div class="recipe-result">'+t('result_lbl')+' '+esc(r.result||'—')+'</div>'+
        (r.notes?'<div class="recipe-notes">'+esc(r.notes)+'</div>':'')+
      '</div>';
    }).join('');
  }

  function renderAll(){
    renderStat();renderSkills();renderInventory();renderGear();renderCraft();renderRecipes();
  }

  function init(){
    var raw=document.getElementById('raw');
    if(raw&&raw.value&&raw.value.trim()&&raw.value.trim()!=='$1'){
      try{
        var txt=raw.value.trim();
        S.data=JSON.parse(txt);
        if(S.data.lang)S.lang=S.data.lang;
      }catch(e){S.data={};}
    }
    renderAll();
  }

  return {
    toggle:function(){document.getElementById('win').classList.toggle('closed');},
    toggleLang:function(){
      S.lang=S.lang==='en'?'th':'en';
      document.getElementById('lnBtn').textContent=S.lang==='en'?'EN':'TH';
      renderAll();
    },
    tab:function(n){
      document.querySelectorAll('.tab').forEach(function(t,i){t.classList.toggle('active',i===n);});
      document.querySelectorAll('.panel').forEach(function(p,i){p.classList.toggle('active',i===n);});
    },
    toggleCraft:function(idx){
      var pos=S.craftSel.indexOf(idx);
      if(pos>=0)S.craftSel.splice(pos,1);else S.craftSel.push(idx);
      renderCraft();
    },
    doCraft:function(){
      var inv=S.data.inventory||[];
      if(!S.craftSel.length){alert(S.lang==='th'?'เลือกวัตถุดิบก่อน':'Select ingredients first.');return;}
      var intent=document.getElementById('craft-intent').value.trim();
      if(!intent){alert(S.lang==='th'?'ระบุสิ่งที่ต้องการคราฟ':'Describe what you want to craft.');return;}
      var ingr=S.craftSel.map(function(i){var it=inv[i];return it?it.name+' ×'+(it.qty||1):'?';});
      var payload=JSON.stringify({ingredients:ingr,intent:intent});
      sendToChat('<'+'LOL_CRAFT>'+payload+'<'+'/LOL_CRAFT>');
      S.craftSel=[];
      document.getElementById('craft-intent').value='';
      renderCraft();
    },
    deleteRecipe:function(rid,rname){
      var payload=JSON.stringify({recipe_id:rid,recipe_name:rname});
      sendToChat('<'+'LOL_RECIPE_DELETE>'+payload+'<'+'/LOL_RECIPE_DELETE>');
    },
    init:init
  };
})();

W.init();
</script>
