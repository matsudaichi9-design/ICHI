<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LoL Status Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;font-family:'Segoe UI',system-ui,sans-serif;font-size:13px}
#lolstwin{--acc:#C89B3C;--abg:rgba(200,155,60,.13);--abd:rgba(200,155,60,.28);--bg:#0d0e10;--bg2:#14161a;--bg3:#1c1f25;--bg4:#242830;--tx:#d8c9a8;--tx2:#9a8f7a;--tx3:#5a5548;--bd:rgba(200,155,60,.30);--r:6px;--r2:3px;background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);max-width:520px;margin:0 auto;overflow:hidden;box-shadow:0 4px 32px rgba(0,0,0,.7);color:var(--tx)}
#lolstwin #lolstwhead{display:flex;align-items:center;gap:8px;padding:10px 14px;background:linear-gradient(135deg,var(--bg2),var(--bg3));border-bottom:1px solid var(--bd);cursor:pointer;user-select:none}
#lolstwin #lolstsigil{width:28px;height:28px;flex-shrink:0}
#lolstwin #lolsthdtxt{flex:1;min-width:0}
#lolstwin #lolsttitle{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--acc)}
#lolstwin #lolstnm{font-size:14px;font-weight:700;color:var(--tx);letter-spacing:.5px}
#lolstwin #lolstlnbtn{font-size:9px;padding:2px 7px;border-radius:99px;cursor:pointer;background:var(--bg4);border:1px solid var(--bd);color:var(--tx3);letter-spacing:1px;user-select:none;flex-shrink:0}
#lolstwin #lolstlnbtn:hover{color:var(--acc);border-color:var(--acc)}
#lolstwin #lolstchev{font-size:16px;color:var(--tx3);transition:transform .3s;flex-shrink:0}
#lolstwin.closed #lolstchev{transform:rotate(180deg)}
#lolstwin #lolstbody{max-height:2000px;overflow:hidden;transition:max-height .35s ease}
#lolstwin.closed #lolstbody{max-height:0}
#lolstwin #lolsttabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--bd)}
#lolstwin .lolst-tab{flex:1;padding:10px 2px;text-align:center;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--tx3);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
#lolstwin .lolst-tab:hover{color:var(--tx2)}
#lolstwin .lolst-tab.active{color:var(--acc);border-bottom-color:var(--acc);background:var(--abg)}
#lolstwin .lolst-panel{display:none;padding:14px}
#lolstwin .lolst-panel.active{display:block}
#lolstwin .sec{display:flex;align-items:center;gap:6px;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--acc);margin-bottom:8px}
#lolstwin .sec::before,#lolstwin .sec::after{content:'';flex:1;height:1px;background:var(--abd)}
#lolstwin .igrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
#lolstwin .icard{background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--r2);padding:7px 10px}
#lolstwin .icard-l{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--tx3);margin-bottom:2px}
#lolstwin .icard-v{font-size:12px;color:var(--tx);font-weight:600}
#lolstwin .icard.full{grid-column:1/-1}
#lolstwin .bars{margin-bottom:12px}
#lolstwin .bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
#lolstwin .bar-label{font-size:9px;letter-spacing:1px;color:var(--tx3);width:32px;text-align:right;flex-shrink:0}
#lolstwin .bar-track{flex:1;height:8px;background:var(--bg4);border-radius:4px;overflow:hidden}
#lolstwin .bar-fill{height:100%;border-radius:4px}
#lolstwin .bar-hp{background:linear-gradient(90deg,#c85050,#e87070)}
#lolstwin .bar-mp{background:linear-gradient(90deg,#3a5a9b,#5a88d8)}
#lolstwin .bar-val{font-size:10px;color:var(--tx2);width:60px;text-align:right;flex-shrink:0}
#lolstwin .badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
#lolstwin .badge{padding:3px 8px;border-radius:99px;font-size:10px;background:var(--bg4);border:1px solid var(--bg3);color:var(--tx2)}
#lolstwin .badge.condition{border-color:rgba(200,130,40,.4);color:#d4903a;background:rgba(200,130,40,.1)}
#lolstwin .badge.injury{border-color:rgba(200,50,50,.4);color:#e07070;background:rgba(200,50,50,.1)}
#lolstwin .badge.empty{color:var(--tx3);font-style:italic}
#lolstwin .ab-card{background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--r2);padding:10px;margin-bottom:7px;display:flex;gap:10px;align-items:flex-start}
#lolstwin .rank-badge{width:28px;height:28px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex-shrink:0;border:1px solid currentColor}
#lolstwin .rank-S{color:#d4af37;background:rgba(212,175,55,.15)}
#lolstwin .rank-A{color:#c870a0;background:rgba(200,112,160,.15)}
#lolstwin .rank-B{color:#6090d0;background:rgba(96,144,208,.15)}
#lolstwin .rank-C{color:#60a870;background:rgba(96,168,112,.15)}
#lolstwin .rank-D{color:#8a8a8a;background:rgba(138,138,138,.15)}
#lolstwin .ab-name{font-size:12px;font-weight:700;color:var(--tx);margin-bottom:3px}
#lolstwin .ab-desc{font-size:11px;color:var(--tx2);line-height:1.5}
#lolstwin .inv-group{margin-bottom:10px}
#lolstwin .inv-type-label{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--acc);padding:3px 0;border-bottom:1px solid var(--abd);margin-bottom:6px}
#lolstwin .inv-item{display:flex;align-items:flex-start;gap:8px;padding:5px 8px;background:var(--bg3);border-radius:var(--r2);margin-bottom:4px}
#lolstwin .inv-qty{font-size:11px;font-weight:700;color:var(--acc);min-width:24px;text-align:center;padding-top:1px}
#lolstwin .inv-info{flex:1;min-width:0}
#lolstwin .inv-name{font-size:12px;color:var(--tx);font-weight:600}
#lolstwin .inv-desc{font-size:10px;color:var(--tx3);margin-top:1px}
#lolstwin .eq-slot{display:flex;gap:10px;align-items:center;padding:8px 10px;background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--r2);margin-bottom:6px}
#lolstwin .eq-slot-label{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--tx3);width:68px;flex-shrink:0;text-align:right}
#lolstwin .eq-slot-line{width:1px;height:28px;background:var(--bd);flex-shrink:0}
#lolstwin .eq-item{flex:1;min-width:0}
#lolstwin .eq-name{font-size:12px;font-weight:700;color:var(--tx)}
#lolstwin .eq-desc{font-size:10px;color:var(--tx3);margin-top:2px}
#lolstwin .eq-cond{font-size:9px;padding:1px 6px;border-radius:99px;font-weight:700;margin-left:6px;display:inline-block}
#lolstwin .cond-pristine{color:#70d490;border:1px solid rgba(112,212,144,.4);background:rgba(112,212,144,.1)}
#lolstwin .cond-good{color:#8a9ab8;border:1px solid rgba(138,154,184,.4);background:rgba(138,154,184,.1)}
#lolstwin .cond-worn{color:#d9c089;border:1px solid rgba(217,192,137,.4);background:rgba(217,192,137,.1)}
#lolstwin .cond-damaged{color:#d4883a;border:1px solid rgba(212,136,58,.4);background:rgba(212,136,58,.1)}
#lolstwin .cond-broken{color:#c8506a;border:1px solid rgba(200,80,106,.4);background:rgba(200,80,106,.1)}
#lolstwin .eq-empty{font-size:11px;color:var(--tx3);font-style:italic}
#lolstwin .craft-lbl{font-size:10px;color:var(--tx3);letter-spacing:.5px;margin-bottom:6px}
#lolstwin .craft-pills{display:flex;flex-wrap:wrap;gap:5px;min-height:34px;margin-bottom:8px}
#lolstwin .craft-pill{padding:4px 10px;border-radius:99px;font-size:11px;cursor:pointer;background:var(--bg3);border:1px solid var(--bg4);color:var(--tx2);user-select:none}
#lolstwin .craft-pill:hover{border-color:var(--acc);color:var(--acc)}
#lolstwin .craft-pill.selected{background:var(--abg);border-color:var(--acc);color:var(--acc);font-weight:700}
#lolstwin .pill-qty{font-size:9px;opacity:.7}
#lolstwin .craft-sel-box{background:var(--bg3);border:1px dashed var(--abd);border-radius:var(--r2);padding:8px;min-height:36px;font-size:11px;color:var(--tx3);margin-bottom:8px}
#lolstwin .craft-sel-box.has-items{color:var(--tx2)}
#lolstwin .craft-intent{width:100%;background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--r2);color:var(--tx);padding:8px 10px;font-size:12px;font-family:inherit;outline:none;resize:none;margin-bottom:8px}
#lolstwin .craft-intent:focus{border-color:var(--acc)}
#lolstwin .craft-intent::placeholder{color:var(--tx3)}
#lolstwin .btn-craft{width:100%;padding:10px;border-radius:var(--r2);font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;background:linear-gradient(135deg,var(--acc),#e8c060);color:#0d0e10;border:none}
#lolstwin .recipe-card{background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--r2);padding:10px;margin-bottom:7px}
#lolstwin .recipe-hdr{display:flex;align-items:center;gap:8px;margin-bottom:5px}
#lolstwin .recipe-name{flex:1;font-size:12px;font-weight:700;color:var(--tx)}
#lolstwin .recipe-q{font-size:9px;font-weight:700;padding:2px 7px;border-radius:99px}
#lolstwin .q-excellent{color:#d4af37;border:1px solid rgba(212,175,55,.4);background:rgba(212,175,55,.1)}
#lolstwin .q-good{color:#70b870;border:1px solid rgba(112,184,112,.4);background:rgba(112,184,112,.1)}
#lolstwin .q-ok{color:#8a8aaa;border:1px solid rgba(138,138,170,.4);background:rgba(138,138,170,.1)}
#lolstwin .q-bad{color:#c87a3a;border:1px solid rgba(200,122,58,.4);background:rgba(200,122,58,.1)}
#lolstwin .q-failed{color:#a83838;border:1px solid rgba(168,56,56,.4);background:rgba(168,56,56,.1)}
#lolstwin .recipe-ingr{font-size:10px;color:var(--tx3);margin-bottom:3px}
#lolstwin .recipe-result{font-size:11px;color:var(--tx2)}
#lolstwin .recipe-notes{font-size:10px;color:var(--tx3);font-style:italic;margin-top:3px}
#lolstwin .btn-del{padding:3px 8px;font-size:10px;border-radius:var(--r2);cursor:pointer;background:rgba(168,56,56,.15);border:1px solid rgba(168,56,56,.35);color:#c87070;flex-shrink:0}
#lolstwin .empty-state{text-align:center;padding:24px 0;color:var(--tx3);font-size:11px;letter-spacing:1px}
#lolstwin #lolstfoot{border-top:1px solid var(--bd);padding:8px 14px;font-size:9px;color:var(--tx3);text-align:center;letter-spacing:1px;background:var(--bg2);text-transform:uppercase}
</style>
</head>
<body>
<textarea id="lolstraw" style="display:none;position:absolute;left:-9999px">$1</textarea>
<div id="lolstwin">
  <div id="lolstwhead">
    <svg id="lolstsigil" width="28" height="28" viewBox="0 0 28 28"></svg>
    <div id="lolsthdtxt">
      <div id="lolsttitle">STATUS TRACKER</div>
      <div id="lolstnm">—</div>
    </div>
    <div id="lolstlnbtn">EN</div>
    <div id="lolstchev">▲</div>
  </div>
  <div id="lolstbody">
    <div id="lolsttabs"></div>
    <div id="lolstpanes"></div>
  </div>
  <div id="lolstfoot">RUNETERRA STATUS SYSTEM</div>
</div>

<script>
(function(){
  function g(id){return document.getElementById(id);}
  function esc(v){if(v==null)return '';return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function pct(c,m){c=parseFloat(c);m=parseFloat(m);if(!(m>0))return 0;return Math.max(0,Math.min(100,Math.round(c/m*100)));}

  var rawEl=g('lolstraw');
  if(!rawEl)return;
  var raw=(rawEl.value||'').replace(/<\/?LOL_STATUS>/gi,'').trim();
  var d={};try{d=JSON.parse(raw);}catch(e){}

  var TH=(d.lang==='th');
  var sel=[];

  var RC={demacia:'#4A70B0',noxus:'#9B2020',freljord:'#5FA8C8',ionia:'#9870C0',piltover:'#D4A830',zaun:'#4A8A60',shurima:'#C8A84B',ixtal:'#3A8A50',targon:'#7A8EC8',camavor:'#A83848',shadow_isles:'#2A8060',bilgewater:'#C87840',bandle:'#D4B870',void:'#8A4AC8'};
  var acc=d.theme_color||RC[d.region]||'#C89B3C';

  function hexRgb(h){var n=parseInt((String(h||'').replace('#','').replace(/^(?:[0-9a-f]{3})$/i,function(x){return x[0]+x[0]+x[1]+x[1]+x[2]+x[2];}))||'C89B3C',16)||0xC89B3C;return ((n>>16)&255)+','+((n>>8)&255)+','+(n&255);}

  var win=g('lolstwin');
  if(!win)return;
  var rgb=hexRgb(acc);
  win.style.setProperty('--acc',acc);
  win.style.setProperty('--abg','rgba('+rgb+',.13)');
  win.style.setProperty('--abd','rgba('+rgb+',.28)');
  win.style.setProperty('--bd','rgba('+rgb+',.30)');

  var L={
    stat:['STAT','สถานะ'],skill:['SKILL','ทักษะ'],items:['ITEMS','ของ'],gear:['GEAR','อุปกรณ์'],craft:['CRAFT','คราฟ'],log:['LOG','บันทึก'],
    vital:['VITALS','พลังงาน'],cond:['CONDITIONS','สภาพ'],skills:['ABILITIES','ความสามารถ'],inv:['INVENTORY','กระเป๋า'],
    eq:['EQUIPMENT','อาวุธ/ชุด'],cr:['CRAFTING','คราฟ'],lg:['RECIPE LOG','บันทึกสูตร'],
    ing:['Select ingredients:','เลือกวัตถุดิบ:'],sel_lbl:['Selected:','เลือกแล้ว:'],
    iph:['What are you trying to craft?','คุณต้องการคราฟอะไร?'],
    cbtn:['⚒ CRAFT','⚒ คราฟ'],del:['DEL','ลบ'],
    no_ab:['No abilities recorded.','ไม่มีความสามารถ'],no_inv:['Inventory is empty.','กระเป๋าว่างเปล่า'],
    no_gear:['No equipment.','ไม่มีอุปกรณ์'],no_rec:['No recipes logged yet.','ยังไม่มีสูตรที่บันทึก'],
    no_craf:['No inventory items available.','ไม่มีวัตถุดิบในกระเป๋า'],
    none:['—','—'],ilbl:['Ingredients:','วัตถุดิบ:'],rlbl:['Result:','ผลลัพธ์:'],
    hp:['HP','HP'],mp:['MP','MP'],
    nm:['Name','ชื่อ'],ag:['Age','อายุ'],gd:['Gender','เพศ'],rg:['Region','ภูมิภาค'],bg:['Background','ภูมิหลัง'],gl:['Goal','เป้าหมาย'],
    foot:['RUNETERRA STATUS SYSTEM','ระบบติดตามสถานะ รูนเทอร์รา'],norm:['Normal','ปกติ']
  };
  function T(k){var a=L[k];if(!a)return k;return TH?a[1]:a[0];}

  function sigil(r){
    var c=acc;
    var s={
      demacia:'<polygon points="14,2 22,10 22,24 6,24 6,10" fill="none" stroke="'+c+'" stroke-width="1.5"/><line x1="14" y1="2" x2="14" y2="24" stroke="'+c+'" stroke-width="1"/><line x1="6" y1="14" x2="22" y2="14" stroke="'+c+'" stroke-width="1"/>',
      noxus:'<polygon points="14,3 24,25 4,25" fill="none" stroke="'+c+'" stroke-width="1.5"/><polygon points="14,9 20,22 8,22" fill="'+c+'" opacity=".3"/>',
      freljord:'<line x1="14" y1="2" x2="14" y2="26" stroke="'+c+'" stroke-width="1.5"/><line x1="2" y1="14" x2="26" y2="14" stroke="'+c+'" stroke-width="1.5"/><line x1="5.5" y1="5.5" x2="22.5" y2="22.5" stroke="'+c+'" stroke-width="1"/><line x1="22.5" y1="5.5" x2="5.5" y2="22.5" stroke="'+c+'" stroke-width="1"/><circle cx="14" cy="14" r="3" fill="'+c+'"/>',
      ionia:'<circle cx="14" cy="10" r="4" fill="'+c+'"/><circle cx="14" cy="18" r="4" fill="none" stroke="'+c+'" stroke-width="1.5"/><circle cx="14" cy="14" r="8" fill="none" stroke="'+c+'" stroke-width="1.2"/><circle cx="14" cy="10" r="1.5" fill="#0d0e10"/><circle cx="14" cy="18" r="1.5" fill="'+c+'"/>',
      piltover:'<circle cx="14" cy="14" r="8" fill="none" stroke="'+c+'" stroke-width="1.5"/><circle cx="14" cy="14" r="3" fill="'+c+'"/><line x1="14" y1="2" x2="14" y2="6" stroke="'+c+'" stroke-width="1.5"/><line x1="14" y1="22" x2="14" y2="26" stroke="'+c+'" stroke-width="1.5"/><line x1="2" y1="14" x2="6" y2="14" stroke="'+c+'" stroke-width="1.5"/><line x1="22" y1="14" x2="26" y2="14" stroke="'+c+'" stroke-width="1.5"/>',
      zaun:'<rect x="9" y="4" width="10" height="14" rx="5" fill="none" stroke="'+c+'" stroke-width="1.5"/><line x1="11" y1="18" x2="11" y2="24" stroke="'+c+'" stroke-width="1"/><line x1="17" y1="18" x2="17" y2="24" stroke="'+c+'" stroke-width="1"/><line x1="8" y1="22" x2="20" y2="22" stroke="'+c+'" stroke-width="1.5"/><circle cx="14" cy="10" r="2.5" fill="'+c+'" opacity=".5"/>',
      shurima:'<circle cx="14" cy="14" r="9" fill="none" stroke="'+c+'" stroke-width="1.2"/><polygon points="14,5 16.5,11.5 23,11.5 17.5,15.5 19.5,22 14,18 8.5,22 10.5,15.5 5,11.5 11.5,11.5" fill="'+c+'" opacity=".6"/>',
      ixtal:'<circle cx="14" cy="14" r="6" fill="none" stroke="'+c+'" stroke-width="1.5"/><ellipse cx="14" cy="8" rx="3" ry="5" fill="'+c+'" opacity=".5"/><ellipse cx="14" cy="20" rx="3" ry="5" fill="'+c+'" opacity=".5"/><ellipse cx="8" cy="14" rx="5" ry="3" fill="'+c+'" opacity=".5"/><ellipse cx="20" cy="14" rx="5" ry="3" fill="'+c+'" opacity=".5"/>',
      targon:'<polygon points="14,2 20,24 8,24" fill="none" stroke="'+c+'" stroke-width="1.5"/><circle cx="14" cy="8" r="2" fill="'+c+'"/><circle cx="10" cy="18" r="1.2" fill="'+c+'" opacity=".7"/><circle cx="18" cy="16" r="1" fill="'+c+'" opacity=".5"/>',
      camavor:'<circle cx="14" cy="10" r="7" fill="none" stroke="'+c+'" stroke-width="1.5"/><line x1="10" y1="7" x2="10" y2="3" stroke="'+c+'" stroke-width="1.5"/><line x1="14" y1="6" x2="14" y2="2" stroke="'+c+'" stroke-width="1.5"/><line x1="18" y1="7" x2="18" y2="3" stroke="'+c+'" stroke-width="1.5"/><line x1="14" y1="17" x2="14" y2="26" stroke="'+c+'" stroke-width="1.5"/>',
      shadow_isles:'<circle cx="14" cy="14" r="5" fill="none" stroke="'+c+'" stroke-width="1.5"/><circle cx="8" cy="10" r="2.5" fill="none" stroke="'+c+'" stroke-width="1"/><circle cx="20" cy="10" r="2.5" fill="none" stroke="'+c+'" stroke-width="1"/><circle cx="14" cy="22" r="2.5" fill="none" stroke="'+c+'" stroke-width="1"/><line x1="12" y1="12" x2="9.5" y2="11.5" stroke="'+c+'" stroke-width=".8"/><line x1="16" y1="12" x2="18.5" y2="11.5" stroke="'+c+'" stroke-width=".8"/><line x1="14" y1="19" x2="14" y2="16" stroke="'+c+'" stroke-width=".8"/>',
      bilgewater:'<line x1="14" y1="3" x2="14" y2="26" stroke="'+c+'" stroke-width="1.5"/><line x1="6" y1="9" x2="22" y2="9" stroke="'+c+'" stroke-width="1.5"/><path d="M6,9 Q4,14 6,19 Q10,22 14,26 Q18,22 22,19 Q24,14 22,9" fill="none" stroke="'+c+'" stroke-width="1"/>',
      bandle:'<ellipse cx="14" cy="22" rx="9" ry="3" fill="none" stroke="'+c+'" stroke-width="1"/><rect x="8" y="10" width="12" height="14" rx="2" fill="none" stroke="'+c+'" stroke-width="1.2"/><polygon points="14,2 22,10 6,10" fill="none" stroke="'+c+'" stroke-width="1.5"/><circle cx="14" cy="16" r="2" fill="'+c+'" opacity=".6"/>',
      void:'<ellipse cx="14" cy="14" rx="10" ry="10" fill="none" stroke="'+c+'" stroke-width="1.5"/><ellipse cx="14" cy="14" rx="5" ry="8" fill="'+c+'" opacity=".3"/><ellipse cx="14" cy="14" rx="8" ry="3" fill="'+c+'" opacity=".2"/><circle cx="14" cy="14" r="2.5" fill="'+c+'"/>'
    };
    var def='<circle cx="14" cy="14" r="9" fill="none" stroke="'+c+'" stroke-width="1.2"/><line x1="14" y1="5" x2="14" y2="23" stroke="'+c+'" stroke-width="1"/><line x1="5" y1="14" x2="23" y2="14" stroke="'+c+'" stroke-width="1"/>';
    return s[r]||def;
  }

  function pStat(){
    var hp=d.hp||{cur:0,max:100};var mp=d.mana||{cur:0,max:100};
    var hpP=pct(hp.cur,hp.max);var mpP=pct(mp.cur,mp.max);
    var rows=[[T('nm'),d.name],[T('ag'),d.age],[T('gd'),d.gender],[T('rg'),d.region],[T('bg'),d.background],[T('gl'),d.goal]];
    var gh='';
    rows.forEach(function(r,i){
      gh+='<div class="icard'+(i>=4?' full':'')+'"><div class="icard-l">'+esc(r[0])+'</div><div class="icard-v">'+esc(r[1]||'—')+'</div></div>';
    });
    var conds=d.conditions||[];var injs=d.injuries||[];
    var cb='';
    if(!conds.length&&!injs.length){cb='<span class="badge empty">'+esc(T('norm'))+'</span>';}
    else{
      conds.forEach(function(c){cb+='<span class="badge condition">'+esc(c)+'</span>';});
      injs.forEach(function(c){cb+='<span class="badge injury">⚠ '+esc(c)+'</span>';});
    }
    return '<div class="igrid">'+gh+'</div>'+
      '<div class="sec">'+T('vital')+'</div>'+
      '<div class="bars">'+
        '<div class="bar-row"><div class="bar-label">'+T('hp')+'</div><div class="bar-track"><div class="bar-fill bar-hp" style="width:'+hpP+'%"></div></div><div class="bar-val">'+esc(hp.cur)+'/'+esc(hp.max)+'</div></div>'+
        '<div class="bar-row"><div class="bar-label">'+T('mp')+'</div><div class="bar-track"><div class="bar-fill bar-mp" style="width:'+mpP+'%"></div></div><div class="bar-val">'+esc(mp.cur)+'/'+esc(mp.max)+'</div></div>'+
      '</div>'+
      '<div class="sec">'+T('cond')+'</div>'+
      '<div class="badges">'+cb+'</div>';
  }

  function pSkills(){
    var ab=d.abilities||[];
    if(!ab.length)return '<div class="empty-state">'+esc(T('no_ab'))+'</div>';
    return '<div class="sec">'+T('skills')+'</div>'+ab.map(function(a){
      var rk=a.rank||'D';
      return '<div class="ab-card"><div class="rank-badge rank-'+rk+'">'+esc(rk)+'</div><div><div class="ab-name">'+esc(a.name)+'</div><div class="ab-desc">'+esc(a.desc)+'</div></div></div>';
    }).join('');
  }

  function pItems(){
    var inv=d.inventory||[];
    if(!inv.length)return '<div class="sec">'+T('inv')+'</div><div class="empty-state">'+esc(T('no_inv'))+'</div>';
    var gr={};var order=[];
    inv.forEach(function(it){var tp=it.type||'Other';if(!gr[tp]){gr[tp]=[];order.push(tp);}gr[tp].push(it);});
    var h='<div class="sec">'+T('inv')+'</div>';
    order.forEach(function(tp){
      h+='<div class="inv-group"><div class="inv-type-label">'+esc(tp)+'</div>';
      gr[tp].forEach(function(it){
        h+='<div class="inv-item"><div class="inv-qty">×'+esc(it.qty||1)+'</div><div class="inv-info"><div class="inv-name">'+esc(it.name)+'</div>'+(it.desc?'<div class="inv-desc">'+esc(it.desc)+'</div>':'')+'</div></div>';
      });
      h+='</div>';
    });
    return h;
  }

  function pGear(){
    var eq=d.equipment||[];
    var h='<div class="sec">'+T('eq')+'</div>';
    if(!eq.length)return h+'<div class="empty-state">'+esc(T('no_gear'))+'</div>';
    var sm={};eq.forEach(function(e){sm[e.slot]=e;});
    ['Main Hand','Off Hand','Armor','Head','Feet','Accessory'].forEach(function(sl){
      var e=sm[sl];
      var cnt=e?'<div class="eq-name">'+esc(e.name)+'<span class="eq-cond cond-'+(e.condition||'good')+'">'+esc(e.condition||'good')+'</span></div>'+(e.desc?'<div class="eq-desc">'+esc(e.desc)+'</div>':''):'<div class="eq-empty">—</div>';
      h+='<div class="eq-slot"><div class="eq-slot-label">'+esc(sl)+'</div><div class="eq-slot-line"></div><div class="eq-item">'+cnt+'</div></div>';
    });
    return h;
  }

  function pCraft(){
    var inv=d.inventory||[];
    var selTxt=sel.length?sel.map(function(i){var it=inv[i];return it?it.name+' ×'+(it.qty||1):'?';}).join(' + '):T('none');
    var hasItems=sel.length>0;
    var pillsH=inv.length?inv.map(function(it,i){
      return '<div class="craft-pill'+(sel.indexOf(i)>=0?' selected':'')+'" data-idx="'+i+'">'+esc(it.name)+' <span class="pill-qty">×'+esc(it.qty||1)+'</span></div>';
    }).join(''):'<span class="badge empty">'+esc(T('no_craf'))+'</span>';
    return '<div class="sec">'+T('cr')+'</div>'+
      '<div class="craft-lbl">'+esc(T('ing'))+'</div>'+
      '<div class="craft-pills">'+pillsH+'</div>'+
      '<div class="craft-lbl">'+esc(T('sel_lbl'))+'</div>'+
      '<div class="craft-sel-box'+(hasItems?' has-items':'')+'">'+esc(selTxt)+'</div>'+
      '<textarea class="craft-intent" rows="2" placeholder="'+esc(T('iph'))+'"></textarea>'+
      '<button class="btn-craft">'+esc(T('cbtn'))+'</button>';
  }

  function pLog(){
    var rc=d.recipes||[];
    var h='<div class="sec">'+T('lg')+'</div>';
    if(!rc.length)return h+'<div class="empty-state">'+esc(T('no_rec'))+'</div>';
    return h+rc.map(function(r){
      return '<div class="recipe-card">'+
        '<div class="recipe-hdr"><div class="recipe-name">'+esc(r.name)+'</div><span class="recipe-q q-'+(r.quality||'ok')+'">'+esc(r.quality||'ok')+'</span><button class="btn-del" data-rid="'+esc(r.id)+'" data-rname="'+esc(r.name)+'">'+T('del')+'</button></div>'+
        '<div class="recipe-ingr">'+esc(T('ilbl'))+' '+esc((r.ingredients||[]).join(', '))+'</div>'+
        '<div class="recipe-result">'+esc(T('rlbl'))+' '+esc(r.result||'—')+'</div>'+
        (r.notes?'<div class="recipe-notes">'+esc(r.notes)+'</div>':'')+
      '</div>';
    }).join('');
  }

  function build(){
    var sg=g('lolstsigil');if(sg)sg.innerHTML=sigil(d.region);
    var nm=g('lolstnm');if(nm)nm.textContent=d.name||'—';
    var ln=g('lolstlnbtn');if(ln)ln.textContent=TH?'TH':'EN';
    var ft=g('lolstfoot');if(ft)ft.textContent=T('foot');

    var defs=[
      ['stat',T('stat'),pStat],
      ['skill',T('skill'),pSkills],
      ['items',T('items'),pItems],
      ['gear',T('gear'),pGear],
      ['craft',T('craft'),pCraft],
      ['log',T('log'),pLog]
    ];
    var tabsH='',panesH='',first=null;
    defs.forEach(function(t){
      if(!first)first=t[0];
      var isFirst=(first===t[0]);
      tabsH+='<div class="lolst-tab'+(isFirst?' active':'')+'" data-t="'+t[0]+'">'+esc(t[1])+'</div>';
      panesH+='<div class="lolst-panel'+(isFirst?' active':'')+'" data-p="'+t[0]+'">'+t[2]()+'</div>';
    });
    var tabs=g('lolsttabs');if(tabs)tabs.innerHTML=tabsH;
    var panes=g('lolstpanes');if(panes)panes.innerHTML=panesH;
  }

  build();

  function sendToChat(txt){
    setTimeout(function(){
      try{
        var w=window.parent||window;
        var ta=w.document.getElementById('send_textarea')||w.document.querySelector('textarea.chat-input,#textareaAutosize,textarea');
        if(ta){
          var dd=Object.getOwnPropertyDescriptor(w.HTMLTextAreaElement.prototype,'value');
          if(dd&&dd.set)dd.set.call(ta,txt);else ta.value=txt;
          ta.dispatchEvent(new Event('input',{bubbles:true}));
          setTimeout(function(){try{var sb=w.document.getElementById('send_but');if(sb)sb.click();else ta.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',keyCode:13,bubbles:true}));}catch(e){}},150);
          return;
        }
      }catch(e){}
      try{navigator.clipboard.writeText(txt);}catch(e){}
    },450);
  }

  var whead=g('lolstwhead');
  if(whead)whead.addEventListener('click',function(){win.classList.toggle('closed');});

  var lnbtn=g('lolstlnbtn');
  if(lnbtn)lnbtn.addEventListener('click',function(e){
    e.stopPropagation();
    TH=!TH;sel=[];build();
  });

  var tabs=g('lolsttabs');
  if(tabs)tabs.addEventListener('click',function(e){
    var tab=e.target.closest('.lolst-tab');
    if(!tab)return;
    var t=tab.getAttribute('data-t');
    Array.prototype.forEach.call(tabs.querySelectorAll('.lolst-tab'),function(x){x.classList.toggle('active',x===tab);});
    var panes=g('lolstpanes');
    if(panes)Array.prototype.forEach.call(panes.querySelectorAll('.lolst-panel'),function(p){p.classList.toggle('active',p.getAttribute('data-p')===t);});
  });

  var panes=g('lolstpanes');
  if(panes)panes.addEventListener('click',function(e){
    var pill=e.target.closest('.craft-pill');
    if(pill){
      var idx=parseInt(pill.getAttribute('data-idx'));
      var pos=sel.indexOf(idx);
      if(pos>=0)sel.splice(pos,1);else sel.push(idx);
      pill.classList.toggle('selected',sel.indexOf(idx)>=0);
      var box=panes.querySelector('.craft-sel-box');
      if(box){
        var inv=d.inventory||[];
        var txt=sel.length?sel.map(function(i){var it=inv[i];return it?it.name+' ×'+(it.qty||1):'?';}).join(' + '):T('none');
        box.textContent=txt;
        box.classList.toggle('has-items',sel.length>0);
      }
      return;
    }
    var craft=e.target.closest('.btn-craft');
    if(craft){
      var inv=d.inventory||[];
      if(!sel.length){alert(TH?'เลือกวัตถุดิบก่อน':'Select ingredients first.');return;}
      var intentEl=panes.querySelector('.craft-intent');
      var intent=intentEl?intentEl.value.trim():'';
      if(!intent){alert(TH?'ระบุสิ่งที่ต้องการคราฟ':'Describe what you want to craft.');return;}
      var ingr=sel.map(function(i){var it=inv[i];return it?it.name+' ×'+(it.qty||1):'?';});
      sendToChat('<'+'LOL_CRAFT>'+JSON.stringify({ingredients:ingr,intent:intent})+'<'+'/LOL_CRAFT>');
      sel=[];build();
      return;
    }
    var del=e.target.closest('.btn-del');
    if(del){
      var rid=parseInt(del.getAttribute('data-rid'));
      var rname=del.getAttribute('data-rname');
      sendToChat('<'+'LOL_RECIPE_DELETE>'+JSON.stringify({recipe_id:rid,recipe_name:rname})+'<'+'/LOL_RECIPE_DELETE>');
    }
  });
})();
</script>
</body>
</html>
