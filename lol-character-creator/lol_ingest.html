<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
<title>LoL Ingest Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;font-family:'Segoe UI',system-ui,sans-serif;font-size:13px}
#lolingwin{
  --acc:#C89B3C;--abg:rgba(200,155,60,.12);--abd:rgba(200,155,60,.28);
  --tclr:#C89B3C;--tclrb:rgba(200,155,60,.18);
  --bg:#07090d;--bg2:#0c0f16;--bg3:#12151e;--bg4:#1a1e28;
  --tx:#e4d8c0;--tx2:#9a9080;--tx3:#505048;
  --fh:Cinzel,'Palatino Linotype',Georgia,serif;
  background:var(--bg);border:1px solid rgba(255,255,255,.08);
  border-radius:10px;max-width:520px;margin:0 auto;overflow:hidden;
  box-shadow:0 8px 48px rgba(0,0,0,.85),0 0 0 1px rgba(0,0,0,.5);
  color:var(--tx);position:relative;
}
#lolingwin::before{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  border-radius:10px;border:1px solid var(--tclr);opacity:.35;
  box-shadow:inset 0 0 30px rgba(0,0,0,.4);
}

/* ─── TOP BANNER ─── */
#lolingbanner{
  padding:6px 16px;
  background:linear-gradient(90deg,var(--tclrb),transparent 60%);
  border-bottom:1px solid rgba(255,255,255,.05);
  display:flex;align-items:center;gap:8px;position:relative;z-index:1;
}
#lolingbanner::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,var(--tclr),transparent);opacity:.5;
}
#lolingbtitle{
  font-family:var(--fh);font-size:7.5px;letter-spacing:4px;text-transform:uppercase;
  color:var(--tclr);flex:1;
}
#lolingbtype{
  font-family:var(--fh);font-size:7.5px;letter-spacing:2px;text-transform:uppercase;
  padding:2px 8px;border-radius:99px;border:1px solid var(--tclr);
  color:var(--tclr);background:var(--tclrb);
}

/* ─── HEADER ─── */
#lolinghead{
  display:flex;align-items:center;gap:14px;padding:14px 16px 12px;
  background:linear-gradient(160deg,#0f1422 0%,var(--bg2) 100%);
  border-bottom:1px solid rgba(255,255,255,.05);position:relative;z-index:1;
}
#lolingico{
  width:52px;height:52px;flex-shrink:0;display:flex;align-items:center;
  justify-content:center;border-radius:50%;
  background:radial-gradient(circle,var(--tclrb) 0%,transparent 70%);
  border:1px solid var(--tclr);
  box-shadow:0 0 16px var(--tclrb),inset 0 0 10px rgba(0,0,0,.4);
}
#lolingico svg{filter:drop-shadow(0 0 5px var(--tclr))}
#lolinghdtxt{flex:1;min-width:0}
#lolingnm{
  font-family:var(--fh);font-size:17px;font-weight:700;color:#f4ead6;
  letter-spacing:.4px;margin-bottom:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#lolingmeta{
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:4px;
}
.loling-pill{
  font-family:var(--fh);font-size:8px;letter-spacing:1.5px;text-transform:uppercase;
  padding:2px 7px;border-radius:99px;border:1px solid rgba(255,255,255,.12);
  color:var(--tx3);background:rgba(255,255,255,.04);
}
.loling-pill.method{border-color:var(--abd);color:var(--tx2)}
#lolingchar{font-size:11px;color:var(--tx3)}

/* ─── FLAVOR TEXT ─── */
#lolingflavor{
  margin:12px 16px 0;padding:10px 13px;
  background:rgba(255,255,255,.025);
  border-left:2px solid var(--tclr);border-radius:0 4px 4px 0;
  font-size:11.5px;color:var(--tx2);font-style:italic;line-height:1.6;
  position:relative;z-index:1;
}
#lolingflavor::before{
  content:'"';font-family:Georgia,serif;font-size:28px;color:var(--tclr);
  opacity:.3;position:absolute;top:-4px;left:6px;line-height:1;
}

/* ─── BODY ─── */
#lolingbody{padding:14px 16px;position:relative;z-index:1}

/* ─── SECTION HEADER ─── */
.loling-sec{
  display:flex;align-items:center;gap:8px;margin-bottom:10px;
  font-family:var(--fh);font-size:8px;letter-spacing:3px;text-transform:uppercase;
  color:var(--tclr);
}
.loling-sec::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--tclr),transparent);opacity:.4}
.loling-sec-ico{font-style:normal;font-size:10px}

/* ─── EFFECT ROWS ─── */
.loling-effects{margin-bottom:16px}
.loling-efrow{
  display:flex;align-items:center;gap:10px;padding:7px 10px;
  border-radius:4px;margin-bottom:4px;border:1px solid transparent;
  transition:background .15s;
}
.loling-efrow:hover{background:rgba(255,255,255,.03)}
.loling-efrow.pos{background:rgba(60,168,80,.07);border-color:rgba(60,168,80,.2)}
.loling-efrow.neg{background:rgba(210,60,60,.07);border-color:rgba(210,60,60,.2)}
.loling-efrow.neu{background:rgba(160,160,120,.05);border-color:rgba(160,160,120,.15)}
.loling-efrow.unk{background:rgba(140,80,210,.07);border-color:rgba(140,80,210,.2)}
.loling-ef-ico{
  width:22px;height:22px;border-radius:4px;display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;font-family:var(--fh);
}
.pos .loling-ef-ico{color:#50c860;background:rgba(60,168,80,.15)}
.neg .loling-ef-ico{color:#e05060;background:rgba(210,60,60,.15)}
.neu .loling-ef-ico{color:#a09060;background:rgba(160,160,100,.12)}
.unk .loling-ef-ico{color:#a060e0;background:rgba(140,80,210,.15)}
.loling-ef-name{flex:1;font-size:12px;font-weight:600;color:var(--tx)}
.loling-ef-dur{
  font-family:var(--fh);font-size:8.5px;letter-spacing:.5px;color:var(--tx3);
  white-space:nowrap;padding:2px 7px;border-radius:99px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);
}
.pos .loling-ef-dur{color:#50c860;border-color:rgba(60,168,80,.25);background:rgba(60,168,80,.07)}
.neg .loling-ef-dur{color:#e05060;border-color:rgba(210,60,60,.25);background:rgba(210,60,60,.07)}

/* ─── NOTES ─── */
#lolingnotes{
  margin-top:4px;padding:10px 12px;
  background:var(--bg3);border-radius:4px;border:1px solid var(--bg4);
  font-size:11px;color:var(--tx3);line-height:1.6;
}
.loling-hidden{display:none}

/* ─── DIVIDER ─── */
.loling-div{
  height:1px;margin:2px 0 14px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);
}
</style>
</head>
<body>
<textarea id="lolingraw" style="display:none;position:absolute;left:-9999px">$1</textarea>
<div id="lolingwin">
  <div id="lolingbanner">
    <span id="lolingbtitle">SUBSTANCE ABSORBED</span>
    <span id="lolingbtype">—</span>
  </div>
  <div id="lolinghead">
    <div id="lolingico"><svg id="lolingsvg" width="30" height="30" viewBox="0 0 40 40"></svg></div>
    <div id="lolinghdtxt">
      <div id="lolingnm">—</div>
      <div id="lolingmeta"></div>
      <div id="lolingchar"></div>
    </div>
  </div>
  <div id="lolingflavor" class="loling-hidden"></div>
  <div id="lolingbody">
    <div id="lolingshort"></div>
    <div class="loling-div"></div>
    <div id="lolinglong"></div>
    <div id="lolingnotes" class="loling-hidden"></div>
  </div>
</div>
<script>
(function(){
  function g(id){return document.getElementById(id);}
  function esc(v){if(v==null)return '';return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

  var rawEl=g('lolingraw');if(!rawEl)return;
  var raw=(rawEl.value||'').replace(/<\/?LOL_INGEST>/gi,'').trim();
  var d={};try{d=JSON.parse(raw);}catch(e){}
  var TH=(d.lang==='th');

  var RC={demacia:'#4A70B0',noxus:'#9B2020',freljord:'#5FA8C8',ionia:'#9870C0',piltover:'#D4A830',zaun:'#4A8A60',shurima:'#C8A84B',ixtal:'#3A8A50',targon:'#7A8EC8',camavor:'#A83848',shadow_isles:'#2A8060',bilgewater:'#C87840',bandle:'#D4B870',void:'#8A4AC8'};
  var acc=d.theme_color||RC[d.region]||'#C89B3C';

  var TCLR={
    potion:'#4878e8',elixir:'#4878e8',
    food:'#48c058',herb:'#58b840',
    poison:'#c84040',venom:'#c04848',
    drug:'#c89030',reagent:'#40b0a8',
    magic:'#8850d0',curse:'#c03060',
    other:acc
  };
  var typeKey=(d.item_type||'other').toLowerCase();
  var tclr=TCLR[typeKey]||acc;

  function hexRgb(h){
    var s=String(h||'').replace('#','');
    if(s.length===3)s=s[0]+s[0]+s[1]+s[1]+s[2]+s[2];
    var n=parseInt(s,16)||0xC89B3C;
    return ((n>>16)&255)+','+((n>>8)&255)+','+(n&255);
  }

  var win=g('lolingwin');if(!win)return;
  var trgb=hexRgb(tclr);
  var argb=hexRgb(acc);
  win.style.setProperty('--acc',acc);
  win.style.setProperty('--abg','rgba('+argb+',.12)');
  win.style.setProperty('--abd','rgba('+argb+',.28)');
  win.style.setProperty('--tclr',tclr);
  win.style.setProperty('--tclrb','rgba('+trgb+',.16)');

  var ICONS={
    potion:'<circle cx="20" cy="27" r="10" fill="none" stroke="COL" stroke-width="1.8"/><rect x="15.5" y="13" width="9" height="8" rx="2" fill="none" stroke="COL" stroke-width="1.8"/><line x1="17" y1="9" x2="23" y2="9" stroke="COL" stroke-width="2"/><circle cx="16" cy="28" r="2.5" fill="COL" opacity=".55"/><circle cx="24" cy="24" r="1.5" fill="COL" opacity=".4"/><circle cx="20" cy="31" r="1.5" fill="COL" opacity=".3"/>',
    elixir:'<circle cx="20" cy="27" r="10" fill="none" stroke="COL" stroke-width="1.8"/><rect x="15.5" y="13" width="9" height="8" rx="2" fill="none" stroke="COL" stroke-width="1.8"/><line x1="17" y1="9" x2="23" y2="9" stroke="COL" stroke-width="2"/><polygon points="20,19 22,24 27,24 23,27 24.5,32 20,29 15.5,32 17,27 13,24 18,24" fill="COL" opacity=".4"/>',
    food:'<path d="M10 22 Q10 10 20 10 Q30 10 30 22 Q30 33 20 34 Q10 33 10 22Z" fill="none" stroke="COL" stroke-width="1.8"/><path d="M15 19 Q20 14 25 19" fill="none" stroke="COL" stroke-width="1.4"/><line x1="20" y1="10" x2="20" y2="34" stroke="COL" stroke-width="1" opacity=".5"/>',
    herb:'<line x1="20" y1="36" x2="20" y2="16" stroke="COL" stroke-width="2"/><path d="M20 28 Q14 22 10 14 Q16 12 20 22" fill="COL" opacity=".45"/><path d="M20 24 Q26 18 30 10 Q24 10 20 20" fill="COL" opacity=".45"/><path d="M20 33 Q13 32 11 27 Q15 25 20 31" fill="COL" opacity=".3"/>',
    poison:'<circle cx="20" cy="22" r="12" fill="none" stroke="COL" stroke-width="1.8"/><circle cx="20" cy="17" r="4.5" fill="COL" opacity=".45"/><rect x="16.5" y="21" width="7" height="7" rx="2" fill="COL" opacity=".35"/><circle cx="15" cy="30" r="2" fill="COL"/><circle cx="25" cy="30" r="2" fill="COL"/><line x1="15" y1="30" x2="25" y2="30" stroke="COL" stroke-width="1" opacity=".5"/>',
    venom:'<circle cx="20" cy="22" r="12" fill="none" stroke="COL" stroke-width="1.8"/><circle cx="20" cy="17" r="4.5" fill="COL" opacity=".45"/><rect x="16.5" y="21" width="7" height="7" rx="2" fill="COL" opacity=".35"/><circle cx="15" cy="30" r="2" fill="COL"/><circle cx="25" cy="30" r="2" fill="COL"/>',
    drug:'<polygon points="20,6 31,13 31,27 20,34 9,27 9,13" fill="none" stroke="COL" stroke-width="1.8"/><polygon points="20,12 27,17 27,25 20,29 13,25 13,17" fill="COL" opacity=".2"/><line x1="20" y1="6" x2="20" y2="34" stroke="COL" stroke-width="1" opacity=".45"/><line x1="9" y1="20" x2="31" y2="20" stroke="COL" stroke-width="1" opacity=".45"/>',
    reagent:'<circle cx="20" cy="20" r="11" fill="none" stroke="COL" stroke-width="1.8"/><circle cx="20" cy="20" r="5" fill="COL" opacity=".4"/><line x1="20" y1="9" x2="20" y2="31" stroke="COL" stroke-width="1" opacity=".4"/><line x1="9" y1="20" x2="31" y2="20" stroke="COL" stroke-width="1" opacity=".4"/><line x1="12.2" y1="12.2" x2="27.8" y2="27.8" stroke="COL" stroke-width="1" opacity=".3"/><line x1="27.8" y1="12.2" x2="12.2" y2="27.8" stroke="COL" stroke-width="1" opacity=".3"/>',
    magic:'<polygon points="20,5 22.8,14.5 33,14.5 24.5,20.5 27.5,30 20,24 12.5,30 15.5,20.5 7,14.5 17.2,14.5" fill="none" stroke="COL" stroke-width="1.8"/><circle cx="20" cy="20" r="3.5" fill="COL"/><circle cx="20" cy="10" r="1.5" fill="COL" opacity=".5"/><circle cx="28" cy="28" r="1" fill="COL" opacity=".4"/><circle cx="12" cy="28" r="1" fill="COL" opacity=".4"/>',
    curse:'<circle cx="20" cy="20" r="13" fill="none" stroke="COL" stroke-width="1.8"/><path d="M20 7 C28 7 33 13 33 20 S28 33 20 33 S7 27 7 20 S12 7 20 7" fill="none" stroke="COL" stroke-width="1" opacity=".5"/><path d="M20 13 C24 13 27 16 27 20 S24 27 20 27 S13 24 13 20" fill="none" stroke="COL" stroke-width="1" opacity=".5"/><circle cx="20" cy="20" r="3" fill="COL"/><circle cx="20" cy="10" r="1.5" fill="COL" opacity=".6"/><circle cx="10" cy="25" r="1.5" fill="COL" opacity=".6"/><circle cx="30" cy="25" r="1.5" fill="COL" opacity=".6"/>',
    other:'<circle cx="20" cy="20" r="12" fill="none" stroke="COL" stroke-width="1.8"/><line x1="20" y1="8" x2="20" y2="32" stroke="COL" stroke-width="1.5"/><line x1="8" y1="20" x2="32" y2="20" stroke="COL" stroke-width="1.5"/>'
  };

  var icoKey=typeKey in ICONS?typeKey:'other';
  var icoSvg=(ICONS[icoKey]||ICONS.other).replace(/COL/g,tclr);
  var svgEl=g('lolingsvg');if(svgEl)svgEl.innerHTML=icoSvg;

  var METHODS={
    consumed:TH?'กิน':'Consumed',inhaled:TH?'หายใจ':'Inhaled',
    injected:TH?'ฉีด':'Injected',applied:TH?'ทา':'Applied',
    cursed:TH?'สาป':'Cursed',absorbed:TH?'ดูดซึม':'Absorbed',
    drunk:TH?'ดื่ม':'Consumed',drank:TH?'ดื่ม':'Consumed'
  };
  var methodKey=(d.method||'consumed').toLowerCase();
  var methodLbl=METHODS[methodKey]||d.method||'Consumed';

  var TYPES={
    potion:TH?'ยา':'Potion',elixir:TH?'อมฤต':'Elixir',
    food:TH?'อาหาร':'Food',herb:TH?'สมุนไพร':'Herb',
    poison:TH?'พิษ':'Poison',venom:TH?'พิษ':'Venom',
    drug:TH?'ยา':'Drug',reagent:TH?'รีเอเจนต์':'Reagent',
    magic:TH?'เวทมนตร์':'Magic',curse:TH?'คำสาป':'Curse',
    other:TH?'สาร':'Substance'
  };
  var typeLbl=TYPES[typeKey]||d.item_type||'Substance';

  var btype=g('lolingbtype');if(btype)btype.textContent=typeLbl;
  var nm=g('lolingnm');if(nm)nm.textContent=d.item_name||'—';

  var meta=g('lolingmeta');
  if(meta)meta.innerHTML=
    '<span class="loling-pill method">'+esc(methodLbl)+'</span>'+
    '<span class="loling-pill">'+esc(typeLbl)+'</span>';

  var charEl=g('lolingchar');
  if(charEl)charEl.textContent=d.character||(TH?'ผู้รับสาร':'Character');

  var btitle=g('lolingbtitle');
  if(btitle)btitle.textContent=TH?'สารเข้าสู่ร่างกาย':'SUBSTANCE ABSORBED';

  var fl=g('lolingflavor');
  if(fl){
    if(d.flavor&&d.flavor.trim()){fl.textContent=d.flavor;fl.classList.remove('loling-hidden');}
    else{fl.classList.add('loling-hidden');}
  }

  var EFICON={positive:'▲',negative:'▼',neutral:'◆',unknown:'◈'};
  var EFCLS={positive:'pos',negative:'neg',neutral:'neu',unknown:'unk'};
  var EFLAB={
    positive:TH?'เสริม':'Benefit',negative:TH?'ลบ':'Adverse',
    neutral:TH?'กลาง':'Neutral',unknown:TH?'ไม่ทราบ':'Unknown'
  };

  function buildEffects(arr,titleKey,titleIco){
    if(!arr||!arr.length){
      return '<div class="loling-sec"><span class="loling-sec-ico">'+titleIco+'</span>'+esc(titleKey)+'</div>'+
        '<p style="font-size:11px;color:var(--tx3);font-style:italic;margin-bottom:4px">'+esc(TH?'ยังไม่ทราบผล':'No effects recorded')+'</p>';
    }
    var h='<div class="loling-sec"><span class="loling-sec-ico">'+titleIco+'</span>'+esc(titleKey)+'</div>'+
      '<div class="loling-effects">';
    arr.forEach(function(ef){
      var tp=(ef.type||'neutral').toLowerCase();
      var cls=EFCLS[tp]||'neu';
      var ico=EFICON[tp]||'◆';
      h+='<div class="loling-efrow '+cls+'">'+
        '<div class="loling-ef-ico">'+ico+'</div>'+
        '<div class="loling-ef-name">'+esc(ef.effect||'—')+'</div>'+
        '<div class="loling-ef-dur">'+esc(ef.duration||'—')+'</div>'+
      '</div>';
    });
    return h+'</div>';
  }

  var shortEl=g('lolingshort');
  if(shortEl)shortEl.innerHTML=buildEffects(d.short_effects,TH?'ผลระยะสั้น':'SHORT-TERM','⚡');

  var longEl=g('lolinglong');
  if(longEl)longEl.innerHTML=buildEffects(d.long_effects,TH?'ผลระยะยาว':'LONG-TERM','◈');

  var notesEl=g('lolingnotes');
  if(notesEl){
    if(d.notes&&d.notes.trim()){notesEl.textContent=d.notes;notesEl.classList.remove('loling-hidden');}
    else{notesEl.classList.add('loling-hidden');}
  }
})();
</script>
</body>
</html>
