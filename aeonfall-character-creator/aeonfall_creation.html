<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CODEX // CHARACTER INIT</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#050A14;--pan:#0A1628;--pan2:#0C1F3C;
  --az:#00CFFF;--azd:rgba(0,207,255,.14);--azg:rgba(0,207,255,.28);
  --gd:#C9993A;--gdd:rgba(201,153,58,.14);
  --tx:#B8D0EC;--mu:#4A6880;--bd:rgba(0,207,255,.1);
  --rd:#FF4560;--gr:#00E89A;
}
body{background:var(--bg);color:var(--tx);font-family:'Rajdhani',sans-serif;font-size:14px;line-height:1.5}

/* HDR */
.hdr{background:linear-gradient(135deg,#070E1D 0%,#0D2040 50%,#070E1D 100%);border-bottom:1px solid var(--bd);padding:11px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.ht{font-family:'Cinzel',serif;font-size:12px;color:var(--az);letter-spacing:4px}
.hs{font-size:10px;color:var(--mu);letter-spacing:2px}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--az);margin-right:5px;animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* BODY */
.body{max-width:640px;margin:0 auto;padding:18px 14px 36px}

/* SECTION */
.sec{margin-bottom:22px}
.sh{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:7px;border-bottom:1px solid var(--bd)}
.sn{font-size:9px;color:var(--az);letter-spacing:2px;font-weight:700;min-width:16px}
.st{font-family:'Cinzel',serif;font-size:11px;letter-spacing:3px;color:var(--tx)}
.sl{flex:1;height:1px;background:linear-gradient(90deg,var(--azd),transparent)}

/* INPUTS */
.row{display:flex;gap:10px;margin-bottom:10px}
.f{flex:1}
.f label{display:block;font-size:9px;color:var(--mu);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
.f input,.f textarea{width:100%;background:var(--pan);border:none;border-bottom:1px solid rgba(0,207,255,.2);color:var(--tx);font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:500;padding:7px 8px;outline:none;transition:border-color .2s,background .2s}
.f input:focus,.f textarea:focus{border-bottom-color:var(--az);background:var(--pan2)}
.f textarea{resize:vertical;min-height:72px}

/* RACE GRID */
.rg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
@media(max-width:440px){.rg{grid-template-columns:repeat(2,1fr)}}
.rc{background:var(--pan);border:1px solid var(--bd);padding:10px 9px;cursor:pointer;transition:all .18s;position:relative;overflow:hidden}
.rc:hover{border-color:var(--azg);background:var(--pan2)}
.rc.sel{border-color:var(--az);background:var(--pan2);box-shadow:0 0 14px rgba(0,207,255,.12)}
.rc.sel::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--az),transparent)}
.ri{font-size:16px;margin-bottom:5px}
.rn{font-family:'Cinzel',serif;font-size:10px;color:var(--tx);letter-spacing:1px;margin-bottom:2px}
.rtr{font-size:9px;color:var(--az);letter-spacing:1px;margin-bottom:3px}
.rst{font-size:9px;color:var(--gd);letter-spacing:1px}
.rdet{display:none;margin-top:8px;padding:9px 11px;background:var(--pan);border:1px solid var(--bd);border-left:2px solid var(--az);font-size:11px;color:var(--mu);line-height:1.5}

/* CLASS GRID */
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
@media(max-width:440px){.cg{grid-template-columns:repeat(2,1fr)}}
.cc{background:var(--pan);border:1px solid var(--bd);padding:10px 9px;cursor:pointer;transition:all .18s;position:relative;overflow:hidden}
.cc:hover{border-color:var(--gdd);background:var(--pan2)}
.cc.sel{border-color:var(--gd);background:var(--pan2);box-shadow:0 0 14px rgba(201,153,58,.12)}
.cc.sel::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gd),transparent)}
.ci{font-size:16px;margin-bottom:5px}
.cn{font-family:'Cinzel',serif;font-size:10px;color:var(--tx);letter-spacing:1px;margin-bottom:2px}
.cf{font-size:9px;color:var(--gd);letter-spacing:1px;margin-bottom:3px}
.cpt{font-size:9px;color:var(--mu);line-height:1.4}

/* STATS */
.pb{display:flex;align-items:baseline;gap:6px;margin-bottom:12px;font-size:10px;color:var(--mu);letter-spacing:1px}
.pn{font-size:22px;font-weight:700;color:var(--az);line-height:1;transition:color .2s}
.pn.warn{color:var(--rd)}
.sr{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.slb{width:30px;font-size:10px;font-weight:700;color:var(--mu);letter-spacing:2px}
.ss{flex:1;display:flex;gap:2px}
.sg{flex:1;height:14px;background:var(--pan);border:1px solid var(--bd);cursor:pointer;transition:background .1s,border-color .1s}
.sg.on{background:var(--az);border-color:var(--az)}
.sg:hover{border-color:var(--az)}
.sv{width:20px;text-align:right;font-size:13px;font-weight:700;color:var(--az)}

/* FACTIONS */
.fg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.fc{background:var(--pan);border:1px solid var(--bd);padding:9px 10px;cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:9px}
.fc:hover{background:var(--pan2)}
.fc.sel{border-color:rgba(201,153,58,.45);background:var(--pan2)}
.fi{font-size:18px;flex-shrink:0}
.fn{font-family:'Cinzel',serif;font-size:10px;color:var(--tx);letter-spacing:1px;margin-bottom:2px}
.frl{font-size:10px;color:var(--mu)}

/* SUBMIT */
.sub{margin-top:24px;padding-top:16px;border-top:1px solid var(--bd);display:flex;align-items:center;justify-content:flex-end;gap:12px}
.err{font-size:10px;color:var(--rd);letter-spacing:1px}
.btn{background:transparent;border:1px solid var(--az);color:var(--az);font-family:'Rajdhani',sans-serif;font-size:12px;font-weight:700;letter-spacing:3px;padding:9px 24px;cursor:pointer;text-transform:uppercase;transition:all .2s;position:relative}
.btn::before{content:'';position:absolute;top:-1px;left:-1px;width:8px;height:8px;border-top:1px solid var(--az);border-left:1px solid var(--az)}
.btn::after{content:'';position:absolute;bottom:-1px;right:-1px;width:8px;height:8px;border-bottom:1px solid var(--az);border-right:1px solid var(--az)}
.btn:hover{background:var(--azd);box-shadow:0 0 18px rgba(0,207,255,.18)}

/* OUTPUT */
.out-box{padding:16px;background:var(--pan);border:1px solid var(--az);box-shadow:0 0 24px rgba(0,207,255,.1)}
.out-t{font-family:'Cinzel',serif;font-size:12px;color:var(--az);letter-spacing:3px;margin-bottom:10px}
.out-ta{width:100%;background:#020810;border:1px solid var(--bd);color:var(--tx);font-family:monospace;font-size:11px;padding:8px;min-height:60px;resize:vertical;cursor:text}
.out-note{margin-top:8px;font-size:10px;color:var(--mu);letter-spacing:1px;line-height:1.6}
</style>
</head>
<body>
<textarea id="aeonraw" style="display:none">$1</textarea>
<div id="aeoncreate">

<div class="hdr">
  <span class="ht">AEONFALL — CODEX</span>
  <span class="hs"><span class="dot"></span>CHARACTER INITIALIZATION</span>
</div>

<div class="body">

  <!-- I: IDENTITY -->
  <div class="sec">
    <div class="sh"><span class="sn">Ⅰ</span><span class="st">IDENTITY</span><div class="sl"></div></div>
    <div class="row">
      <div class="f"><label>CHARACTER NAME</label><input id="fn" type="text" placeholder="Full name..."></div>
      <div class="f" style="flex:0 0 150px"><label>PLAYER HANDLE</label><input id="fh" type="text" placeholder="@username"></div>
    </div>
    <div class="row">
      <div class="f"><label>GENDER / APPEARANCE</label><input id="fg" type="text" placeholder="Female / Male / Androgynous..."></div>
      <div class="f" style="flex:0 0 90px"><label>AGE</label><input id="fa" type="text" placeholder="e.g. 24"></div>
      <div class="f" style="flex:0 0 110px"><label>LEVEL</label><input id="fl" type="number" placeholder="1" value="1" min="1" max="300"></div>
    </div>
    <div class="row">
      <div class="f"><label>APPEARANCE NOTES</label><input id="fap" type="text" placeholder="Distinctive features, hair, eyes..."></div>
    </div>
  </div>

  <!-- II: LINEAGE -->
  <div class="sec">
    <div class="sh"><span class="sn">Ⅱ</span><span class="st">LINEAGE</span><div class="sl"></div></div>
    <div class="rg" id="race-grid"></div>
    <div class="rdet" id="race-det"></div>
  </div>

  <!-- III: CLASS -->
  <div class="sec">
    <div class="sh"><span class="sn">Ⅲ</span><span class="st">CLASS</span><div class="sl"></div></div>
    <div class="cg" id="cls-grid"></div>
  </div>

  <!-- IV: ATTRIBUTES -->
  <div class="sec">
    <div class="sh"><span class="sn">Ⅳ</span><span class="st">ATTRIBUTES</span><div class="sl"></div></div>
    <div class="pb"><span class="pn" id="pool-n">12</span><span>POINTS REMAINING &nbsp;/&nbsp; 30 TOTAL</span></div>
    <div id="stat-rows"></div>
  </div>

  <!-- V: ALLEGIANCE -->
  <div class="sec">
    <div class="sh"><span class="sn">Ⅴ</span><span class="st">ALLEGIANCE</span><div class="sl"></div></div>
    <div class="fg" id="fac-grid"></div>
    <div class="row" style="margin-top:10px">
      <div class="f"><label>BOUND ANCHOR — CITY / LOCATION</label><input id="fanc" type="text" placeholder="e.g. Aurelan"></div>
    </div>
  </div>

  <!-- VI: THREAD -->
  <div class="sec">
    <div class="sh"><span class="sn">Ⅵ</span><span class="st">THREAD</span><div class="sl"></div></div>
    <div class="f" style="margin-bottom:10px"><label>SOUL HISTORY / BACKGROUND</label><textarea id="fth" placeholder="Who were you before the Severance? What drives you to keep fighting now?"></textarea></div>
    <div class="row">
      <div class="f" style="flex:0 0 200px"><label>SOUL EROSION %</label><input id="fer" type="number" placeholder="0" value="0" min="0" max="99"></div>
      <div class="f"><label>THREAD OBJECTIVE</label><input id="fobj" type="text" placeholder="Personal goal within Velmora..."></div>
    </div>
  </div>

  <!-- SUBMIT -->
  <div class="sub">
    <span class="err" id="err"></span>
    <button class="btn" onclick="inscribe()">INSCRIBE CHARACTER</button>
  </div>

</div>
</div>

<script>
var RACES=[
  {id:'human',    ico:'👤',nm:'Human',      tr:'Resolve',        st:'+STR +WIL', desc:'Fastest skill-learning, widest class access of any Lineage. Resolve trait slows Soul Erosion under stress. Most guild leaders are Human — not from power, but from versatility.'},
  {id:'sylvan',   ico:'🌿',nm:'Sylvan',     tr:'Greensense',     st:'+AGI +INT', desc:'Forest-born with Azure aether affinity. Greensense detects Sealed Zones early. High AGI & INT but longer Reknit Timers — they reform slowly and feel little Erosion.'},
  {id:'dwarrow',  ico:'⚒',nm:'Dwarrow',    tr:'Stonehold',      st:'+VIT +WIL', desc:'Highest VIT & WIL of any base race. Stonehold resists knockback and Erosion. Master craftsmen — the Soulforge responds best to their hands.'},
  {id:'ferran',   ico:'🐾',nm:'Ferran',     tr:'Primal Instinct',st:'+AGI +FAT', desc:'Beast-folk with peak AGI and keen senses. Primal Instinct flags ambushes and tracks bleeding prey. Fastest respawn of all races — but Erodes slightly quicker.'},
  {id:'tideborn', ico:'🌊',nm:'Tideborn',   tr:'Currentcall',    st:'+INT +VIT', desc:'Amphibious sea-folk. Currentcall channels water and tide aether. Essential for the Abyssal Verge and drowned dungeons no other race can survive unaided.'},
  {id:'emberkin', ico:'🔥',nm:'Emberkin',   tr:'Cinderheart',    st:'+STR +INT', desc:'Ash-skinned, fire-immune, Crimson-aether affinity. Cinderheart scales power as HP falls — deadliest at death\'s edge. Glass cannon; low VIT.'},
  {id:'gravewrought',ico:'💀',nm:'Gravewrought',tr:'Mortcradle', st:'+WIL +FAT', desc:'Half-dead. Mortcradle dramatically slows Erosion and shortens Reknit Timers. Cannot heal normally — only via Marrow or Essence. Outsiders fear them.'},
  {id:'aurach',   ico:'🪶',nm:'Aurach',     tr:'Skyclaim',       st:'+AGI +FAT', desc:'Winged skyborn. Skyclaim grants glide, reduced fall damage, and access to floating ruins and sky-locked trainers no other race can reach unaided.'},
  {id:'golemfolk',ico:'⚙',nm:'Golemfolk',  tr:'Coreheart',      st:'+VIT +STR', desc:'Living construct. Extreme VIT & STR, near-immune to poison and disease. Coreheart: no Erosion — instead they crack. Fully cracked means True Death. Tanks without equal.'},
];

var CLASSES=[
  {id:'warrior',ico:'⚔',nm:'Warrior', fc:'STR · VIT', pt:'Berserker / Sentinel / Weapon-Saint'},
  {id:'mage',   ico:'✨',nm:'Mage',    fc:'INT · FAT', pt:'Elementalist / Runeweaver / Voidcaller'},
  {id:'scout',  ico:'🏹',nm:'Scout',   fc:'AGI · FAT', pt:'Hunter / Trapsmith / Pathfinder'},
  {id:'acolyte',ico:'💫',nm:'Acolyte', fc:'WIL · INT', pt:'Cleric / Warden / Soulkeeper'},
  {id:'rogue',  ico:'🗡',nm:'Rogue',   fc:'AGI · FAT', pt:'Assassin / Nightblade / Cutpurse'},
  {id:'artisan',ico:'🔨',nm:'Artisan', fc:'INT · WIL', pt:'Soulsmith / Glyphwright / Architect'},
];

var FACTIONS=[
  {id:'concord',   ico:'🏛',nm:'Concord of Banners',rl:'Aurelan governance & law'},
  {id:'ashbound',  ico:'🌋',nm:'Ashbound',           rl:'Cinderwastes nomad traders'},
  {id:'pale-court',ico:'🕯',nm:'Pale Court',         rl:'Mirefen death-scholars'},
  {id:'verge',     ico:'🌑',nm:'Verge Expedition',   rl:'Abyssal Verge pioneers'},
  {id:'unwoven',   ico:'〰',nm:'Unwoven Hand',       rl:'Null cult (outlawed)'},
  {id:'none',      ico:'·', nm:'Unaffiliated',       rl:'No faction allegiance'},
];

var STAT_DEFS=[
  {id:'str',lb:'STR',nm:'STRENGTH'},
  {id:'agi',lb:'AGI',nm:'AGILITY'},
  {id:'vit',lb:'VIT',nm:'VITALITY'},
  {id:'int',lb:'INT',nm:'INTELLECT'},
  {id:'wil',lb:'WIL',nm:'WILLPOWER'},
  {id:'fat',lb:'FAT',nm:'FATE'},
];

var sv={str:3,agi:3,vit:3,int:3,wil:3,fat:3};
var POOL=30;
var selRace=null,selClass=null,selFac=null;

function used(){return sv.str+sv.agi+sv.vit+sv.int+sv.wil+sv.fat;}
function rem(){return POOL-used();}

function buildRaces(){
  document.getElementById('race-grid').innerHTML=RACES.map(function(r){
    return '<div class="rc" data-id="'+r.id+'" onclick="pickRace(\''+r.id+'\')">'+
      '<div class="ri">'+r.ico+'</div>'+
      '<div class="rn">'+r.nm+'</div>'+
      '<div class="rtr">'+r.tr+'</div>'+
      '<div class="rst">'+r.st+'</div>'+
    '</div>';
  }).join('');
}

function pickRace(id){
  selRace=id;
  document.querySelectorAll('.rc').forEach(function(el){el.classList.toggle('sel',el.dataset.id===id);});
  var r=RACES.find(function(x){return x.id===id;});
  var det=document.getElementById('race-det');
  det.style.display='block';
  det.textContent=r.desc;
}

function buildClasses(){
  document.getElementById('cls-grid').innerHTML=CLASSES.map(function(c){
    return '<div class="cc" data-id="'+c.id+'" onclick="pickClass(\''+c.id+'\')">'+
      '<div class="ci">'+c.ico+'</div>'+
      '<div class="cn">'+c.nm+'</div>'+
      '<div class="cf">'+c.fc+'</div>'+
      '<div class="cpt">'+c.pt+'</div>'+
    '</div>';
  }).join('');
}

function pickClass(id){
  selClass=id;
  document.querySelectorAll('.cc').forEach(function(el){el.classList.toggle('sel',el.dataset.id===id);});
}

function segsHtml(sid){
  var v=sv[sid],h='';
  for(var i=1;i<=10;i++){h+='<div class="sg'+(i<=v?' on':'')+'" onclick="setStat(\''+sid+'\','+i+')"></div>';}
  return h;
}

function buildStats(){
  document.getElementById('stat-rows').innerHTML=STAT_DEFS.map(function(s){
    return '<div class="sr">'+
      '<div class="slb">'+s.lb+'</div>'+
      '<div class="ss" id="sg-'+s.id+'">'+segsHtml(s.id)+'</div>'+
      '<div class="sv" id="sv-'+s.id+'">'+sv[s.id]+'</div>'+
    '</div>';
  }).join('');
}

function setStat(sid,val){
  var diff=val-sv[sid];
  if(diff>0&&rem()<diff)return;
  if(val<1)val=1;
  sv[sid]=val;
  document.getElementById('sg-'+sid).innerHTML=segsHtml(sid);
  document.getElementById('sv-'+sid).textContent=val;
  var r=rem();
  var pn=document.getElementById('pool-n');
  pn.textContent=r;
  pn.className='pn'+(r<0?' warn':'');
}

function buildFactions(){
  document.getElementById('fac-grid').innerHTML=FACTIONS.map(function(f){
    return '<div class="fc" data-id="'+f.id+'" onclick="pickFac(\''+f.id+'\')">'+
      '<div class="fi">'+f.ico+'</div>'+
      '<div><div class="fn">'+f.nm+'</div><div class="frl">'+f.rl+'</div></div>'+
    '</div>';
  }).join('');
}

function pickFac(id){
  selFac=id;
  document.querySelectorAll('.fc').forEach(function(el){el.classList.toggle('sel',el.dataset.id===id);});
}

function inscribe(){
  var err=document.getElementById('err');
  var name=document.getElementById('fn').value.trim();
  if(!name){err.textContent='// ERROR: Character name required';return;}
  if(!selRace){err.textContent='// ERROR: Lineage not selected';return;}
  if(!selClass){err.textContent='// ERROR: Class not selected';return;}
  err.textContent='';

  var race=RACES.find(function(r){return r.id===selRace;});
  var cls=CLASSES.find(function(c){return c.id===selClass;});
  var fac=selFac?FACTIONS.find(function(f){return f.id===selFac;}):FACTIONS[5];

  var data={
    name:name,
    handle:document.getElementById('fh').value.trim(),
    gender:document.getElementById('fg').value.trim(),
    age:document.getElementById('fa').value.trim(),
    level:parseInt(document.getElementById('fl').value)||1,
    appear:document.getElementById('fap').value.trim(),
    race:race.nm,raceIco:race.ico,raceTr:race.tr,
    class:cls.nm,classIco:cls.ico,classPt:cls.pt,
    stats:{str:sv.str,agi:sv.agi,vit:sv.vit,int:sv.int,wil:sv.wil,fat:sv.fat},
    faction:fac.nm,
    anchor:document.getElementById('fanc').value.trim()||'Aurelan',
    thread:document.getElementById('fth').value.trim(),
    erosion:Math.min(99,Math.max(0,parseInt(document.getElementById('fer').value)||0)),
    objective:document.getElementById('fobj').value.trim(),
  };

  var tag='<AEON_CONFIRM>'+JSON.stringify(data)+'</AEON_CONFIRM>';
  document.getElementById('aeoncreate').innerHTML=
    '<div class="hdr"><span class="ht">AEONFALL — CODEX</span><span class="hs"><span class="dot"></span>RECORD INSCRIBED</span></div>'+
    '<div class="body"><div class="out-box">'+
    '<div class="out-t">// CHARACTER INSCRIBED TO CODEX</div>'+
    '<textarea class="out-ta" readonly onclick="this.select()">'+tag+'</textarea>'+
    '<div class="out-note">Character data sealed. Send this output in your next message — the Codex will render the profile card.</div>'+
    '</div></div>';
}

(function(){
  buildRaces();buildClasses();buildStats();buildFactions();
  document.getElementById('pool-n').textContent=rem();
  var raw=document.getElementById('aeonraw');
  if(raw&&raw.value.trim()){
    var dec=document.createElement('textarea');
    dec.innerHTML=raw.value.trim();
    var txt=dec.value.trim();
    if(txt)try{
      var d=JSON.parse(txt);
      if(d.name)document.getElementById('fn').value=d.name;
      if(d.handle)document.getElementById('fh').value=d.handle;
      if(d.gender)document.getElementById('fg').value=d.gender;
      if(d.age)document.getElementById('fa').value=d.age;
      if(d.level)document.getElementById('fl').value=d.level;
      if(d.appear)document.getElementById('fap').value=d.appear;
      if(d.race){var r=RACES.find(function(x){return x.nm===d.race;});if(r)pickRace(r.id);}
      if(d.class){var c=CLASSES.find(function(x){return x.nm===d.class;});if(c)pickClass(c.id);}
      if(d.stats){['str','agi','vit','int','wil','fat'].forEach(function(k){if(d.stats[k])setStat(k,d.stats[k]);});}
      if(d.faction){var f=FACTIONS.find(function(x){return x.nm===d.faction;});if(f)pickFac(f.id);}
      if(d.anchor)document.getElementById('fanc').value=d.anchor;
      if(d.thread)document.getElementById('fth').value=d.thread;
      if(d.erosion!=null)document.getElementById('fer').value=d.erosion;
      if(d.objective)document.getElementById('fobj').value=d.objective;
    }catch(e){}
  }
})();
</script>
</body>
</html>
