<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
<title>KNY Relationship Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;font-family:'Segoe UI',system-ui,sans-serif;font-size:13px}
#knyrelwin{
  --acc:#8B6FAE;--abg:rgba(139,111,174,.12);--abd:rgba(139,111,174,.28);
  --bg:#07090c;--bg2:#0a0c10;--bg3:#0e1018;--bg4:#14161e;--bg5:#1a1c24;
  --tx:#e4d8c0;--tx2:#9a9080;--tx3:#505048;--bd:rgba(139,111,174,.25);
  --fh:Cinzel,'Palatino Linotype',Georgia,serif;
  background:var(--bg);border:1px solid var(--bd);border-radius:10px;
  max-width:520px;margin:0 auto;overflow:hidden;
  box-shadow:0 8px 48px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.04);
  color:var(--tx);
}
/* Header */
#knyrelwin #knyrelhead{
  display:flex;align-items:center;gap:10px;padding:11px 14px;
  background:linear-gradient(160deg,#0e0c1e 0%,#0a0a14 55%,#0c0c16 100%);
  border-bottom:1px solid var(--bd);cursor:pointer;user-select:none;position:relative;
}
#knyrelwin #knyrelhead::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--acc),transparent);opacity:.4;
}
#knyrelwin #knyrel-sigil{width:32px;height:32px;flex-shrink:0;filter:drop-shadow(0 0 6px var(--acc))}
#knyrelwin #knyrelhdtxt{flex:1;min-width:0}
#knyrelwin #knyreltitle{font-family:var(--fh);font-size:8px;letter-spacing:3px;text-transform:uppercase;color:var(--acc);opacity:.75;margin-bottom:2px}
#knyrelwin #knyrelnm{font-family:var(--fh);font-size:15px;font-weight:600;color:#f0e8d4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#knyrelwin #knyrelcount{font-family:var(--fh);font-size:9px;letter-spacing:1.5px;padding:3px 9px;border-radius:99px;background:var(--abg);border:1px solid var(--abd);color:var(--acc);flex-shrink:0}
#knyrelwin #knyrelchev{font-size:14px;color:var(--tx3);transition:transform .3s;flex-shrink:0}
#knyrelwin.closed #knyrelchev{transform:rotate(180deg)}
/* Body */
#knyrelwin #knyrelbody{max-height:4000px;overflow:hidden;transition:max-height .45s ease}
#knyrelwin.closed #knyrelbody{max-height:0}
#knyrelwin #knyrellist{padding:12px 13px;display:flex;flex-direction:column;gap:8px}
/* Cards */
#knyrelwin .knyrel-card{
  background:var(--bg3);border:1px solid var(--bg4);border-radius:6px;
  overflow:hidden;border-left:3px solid var(--tx3);
}
#knyrelwin .knyrel-view{padding:10px 12px}
#knyrelwin .knyrel-top{display:flex;align-items:center;gap:9px;margin-bottom:9px}
#knyrelwin .knyrel-cicon{
  width:30px;height:30px;flex-shrink:0;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(255,255,255,.1);background:var(--bg4);
}
#knyrelwin .knyrel-cinfo{flex:1;min-width:0}
#knyrelwin .knyrel-cname{font-family:var(--fh);font-size:12.5px;font-weight:600;color:var(--tx);letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#knyrelwin .knyrel-cfact{font-size:9px;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px;margin-top:1px}
#knyrelwin .knyrel-status{
  font-family:var(--fh);font-size:9px;letter-spacing:.5px;
  padding:3px 9px;border-radius:99px;border:1px solid rgba(255,255,255,.12);
  color:var(--tx2);white-space:nowrap;flex-shrink:0;
}
#knyrelwin .knyrel-lvlbadge{flex-shrink:0;text-align:center;min-width:50px}
#knyrelwin .knyrel-lvlnum{font-family:var(--fh);font-size:11px;font-weight:700;color:var(--acc)}
#knyrelwin .knyrel-lvllbl{font-size:7.5px;color:var(--tx3);letter-spacing:.5px;white-space:nowrap}
#knyrelwin .knyrel-acts{display:flex;gap:5px;flex-shrink:0}
/* Bars & Pips */
#knyrelwin .knyrel-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
#knyrelwin .knyrel-bar-track{flex:1;height:7px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden}
#knyrelwin .knyrel-bar-fill{height:100%;border-radius:4px;transition:width .5s ease}
#knyrelwin .knyrel-score-num{font-family:var(--fh);font-size:9px;color:var(--tx3);min-width:42px;text-align:right;flex-shrink:0}
#knyrelwin .knyrel-pips{display:flex;gap:3px;margin-bottom:8px}
#knyrelwin .knyrel-pip{flex:1;height:4px;border-radius:2px;background:var(--bg5)}
#knyrelwin .knyrel-pip.on{background:var(--acc)}
#knyrelwin .knyrel-note{font-size:10.5px;color:var(--tx3);line-height:1.55;font-style:italic;padding-top:6px;border-top:1px solid var(--bg4)}
/* Buttons */
#knyrelwin .knyrel-btn{
  font-family:var(--fh);font-size:8px;letter-spacing:1px;
  padding:4px 8px;border-radius:4px;cursor:pointer;transition:all .15s;
}
#knyrelwin .knyrel-btn-edit{background:rgba(139,111,174,.1);border:1px solid rgba(139,111,174,.3);color:var(--acc)}
#knyrelwin .knyrel-btn-edit:hover{background:rgba(139,111,174,.25);border-color:var(--acc)}
#knyrelwin .knyrel-btn-del{background:rgba(155,32,32,.1);border:1px solid rgba(155,32,32,.3);color:#c07070}
#knyrelwin .knyrel-btn-del:hover{background:rgba(155,32,32,.25)}
/* Edit form */
#knyrelwin .knyrel-edit{display:none;padding:12px 13px;background:var(--bg4);border-top:1px solid var(--bg5)}
#knyrelwin .knyrel-edit.on{display:block}
#knyrelwin .knyrel-edit-row{margin-bottom:10px}
#knyrelwin .knyrel-edit-lbl{font-family:var(--fh);font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:var(--tx3);margin-bottom:5px}
#knyrelwin .knyrel-edit-flex{display:flex;align-items:center;gap:9px}
#knyrelwin .knyrel-range{
  -webkit-appearance:none;width:100%;height:5px;
  background:var(--bg5);border-radius:3px;outline:none;cursor:pointer;border:none;
}
#knyrelwin .knyrel-range::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--acc);cursor:pointer;border:2px solid var(--bg);
  box-shadow:0 0 5px rgba(139,111,174,.5);
}
#knyrelwin .knyrel-range-val{font-family:var(--fh);font-size:11px;font-weight:700;color:var(--acc);min-width:26px;text-align:center}
#knyrelwin .knyrel-inp{
  width:100%;background:var(--bg3);border:1px solid var(--bg5);border-radius:4px;
  color:var(--tx);padding:7px 10px;font-family:inherit;font-size:12px;
  outline:none;transition:border-color .2s;
}
#knyrelwin .knyrel-inp:focus{border-color:var(--acc)}
#knyrelwin .knyrel-inp::placeholder{color:var(--tx3)}
#knyrelwin .knyrel-edit-btns{display:flex;gap:7px;margin-top:12px}
#knyrelwin .knyrel-btn-save{
  flex:1;padding:8px;font-family:var(--fh);font-size:9px;letter-spacing:2px;
  font-weight:700;cursor:pointer;border:none;border-radius:4px;
  background:linear-gradient(135deg,var(--acc),#b090d0);color:#07090c;
  transition:opacity .2s;
}
#knyrelwin .knyrel-btn-save:hover{opacity:.85}
#knyrelwin .knyrel-btn-cancel{
  padding:8px 14px;font-family:var(--fh);font-size:9px;letter-spacing:1px;
  cursor:pointer;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);
  color:var(--tx3);border-radius:4px;transition:background .15s;
}
#knyrelwin .knyrel-btn-cancel:hover{background:rgba(255,255,255,.08)}
/* Empty */
#knyrelwin .knyrel-empty{
  text-align:center;padding:32px 0;color:var(--tx3);
  font-size:10px;letter-spacing:2px;font-family:var(--fh);text-transform:uppercase;
}
#knyrelwin .knyrel-empty::before{content:'◈';display:block;font-size:22px;margin-bottom:10px;opacity:.2}
/* Footer */
#knyrelwin #knyrelfoot{
  border-top:1px solid rgba(255,255,255,.05);padding:7px 14px;
  font-family:var(--fh);font-size:8px;color:var(--tx3);
  text-align:center;letter-spacing:2px;background:var(--bg2);text-transform:uppercase;
}
</style>
</head>
<body>
<textarea id="knyrelraw" style="display:none;position:absolute;left:-9999px">$1</textarea>
<div id="knyrelwin">
  <div id="knyrelhead">
    <svg id="knyrel-sigil" width="32" height="32" viewBox="0 0 28 28"></svg>
    <div id="knyrelhdtxt">
      <div id="knyreltitle">絆録 · BOND REGISTRY</div>
      <div id="knyrelnm">—</div>
    </div>
    <div id="knyrelcount">0</div>
    <div id="knyrelchev">▲</div>
  </div>
  <div id="knyrelbody">
    <div id="knyrellist"></div>
  </div>
  <div id="knyrelfoot">鬼滅の刃 · BOND TRACKER</div>
</div>
<script>
(function(){
  function g(id){return document.getElementById(id);}
  function esc(v){if(v==null)return '';return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

  var rawEl=g('knyrelraw'); if(!rawEl)return;
  var raw=(rawEl.value||'').replace(/<\/?KNY_RELATION>/gi,'').trim();
  var d={}; try{var dec=document.createElement('textarea');dec.innerHTML=raw;d=JSON.parse(dec.value.trim());}catch(e){}
  var TH=(d.lang==='th');
  var relations=Array.isArray(d.relations)?d.relations:[];

  var FC={slayer:'#8B6FAE',hashira:'#C4A830',demon:'#9B2020',upper_moon:'#7A2060',lower_moon:'#9B4030',human:'#7A7860'};
  var charFk=(d.faction||'').toLowerCase().replace(/\s+/g,'_');
  var acc=d.charColor||FC[charFk]||'#8B6FAE';

  function hexRgb(h){var s=String(h||'').replace('#','');if(s.length===3)s=s[0]+s[0]+s[1]+s[1]+s[2]+s[2];var n=parseInt(s,16)||0;if(!n)n=0x8B6FAE;return ((n>>16)&255)+','+((n>>8)&255)+','+(n&255);}

  var win=g('knyrelwin'); if(!win)return;
  var rgb=hexRgb(acc);
  win.style.setProperty('--acc',acc);
  win.style.setProperty('--abg','rgba('+rgb+',.12)');
  win.style.setProperty('--abd','rgba('+rgb+',.28)');
  win.style.setProperty('--bd','rgba('+rgb+',.25)');

  function sigilBig(fk,c){
    var p={
      slayer:'<line x1="14" y1="3" x2="14" y2="25" stroke="'+c+'" stroke-width="2" stroke-linecap="round"/><line x1="7" y1="12" x2="21" y2="12" stroke="'+c+'" stroke-width="1.6" stroke-linecap="round"/><line x1="8" y1="9" x2="20" y2="15" stroke="'+c+'" stroke-width="1" opacity=".5" stroke-linecap="round"/>',
      hashira:'<rect x="11" y="3" width="6" height="18" rx="2" fill="none" stroke="'+c+'" stroke-width="1.6"/><line x1="5" y1="21" x2="23" y2="21" stroke="'+c+'" stroke-width="2"/><line x1="8" y1="21" x2="8" y2="26" stroke="'+c+'" stroke-width="1.4"/><line x1="20" y1="21" x2="20" y2="26" stroke="'+c+'" stroke-width="1.4"/>',
      demon:'<path d="M14 3 Q22 8 20 16 Q17 23 14 23 Q11 23 8 16 Q6 8 14 3Z" fill="none" stroke="'+c+'" stroke-width="1.5"/><path d="M10 10 L14 15 L18 10" fill="none" stroke="'+c+'" stroke-width="1.2" stroke-linecap="round"/><circle cx="14" cy="7" r="1.5" fill="'+c+'" opacity=".6"/>',
      upper_moon:'<path d="M10 4 Q5 14 10 24 Q7 22 5 14 Q7 6 10 4Z" fill="'+c+'" opacity=".6"/><circle cx="16" cy="14" r="9" fill="none" stroke="'+c+'" stroke-width="1.4"/><circle cx="16" cy="14" r="3" fill="none" stroke="'+c+'" stroke-width="1" opacity=".5"/>',
      lower_moon:'<path d="M11 4 Q6 14 11 24 Q8 22 7 14 Q8 6 11 4Z" fill="'+c+'" opacity=".5"/><circle cx="16" cy="14" r="8" fill="none" stroke="'+c+'" stroke-width="1.3"/>',
      human:'<circle cx="14" cy="10" r="5" fill="none" stroke="'+c+'" stroke-width="1.6"/><path d="M5 26 Q5 18 14 18 Q23 18 23 26" fill="none" stroke="'+c+'" stroke-width="1.6" stroke-linecap="round"/>'
    };
    var def='<circle cx="14" cy="14" r="9" fill="none" stroke="'+c+'" stroke-width="1.5"/><line x1="14" y1="5" x2="14" y2="23" stroke="'+c+'" stroke-width="1"/><line x1="5" y1="14" x2="23" y2="14" stroke="'+c+'" stroke-width="1"/>';
    return p[fk]||def;
  }

  function sigilSm(fk){
    var c=FC[fk]||'#808090';
    var p={
      slayer:'<line x1="8" y1="2" x2="8" y2="14" stroke="'+c+'" stroke-width="1.4" stroke-linecap="round"/><line x1="4" y1="7" x2="12" y2="7" stroke="'+c+'" stroke-width="1.2" stroke-linecap="round"/><line x1="5" y1="5" x2="11" y2="9" stroke="'+c+'" stroke-width=".8" opacity=".5" stroke-linecap="round"/>',
      hashira:'<rect x="6" y="2" width="4" height="10" rx="1" fill="none" stroke="'+c+'" stroke-width="1.2"/><line x1="3" y1="12" x2="13" y2="12" stroke="'+c+'" stroke-width="1.4"/><line x1="5" y1="12" x2="5" y2="14" stroke="'+c+'" stroke-width="1"/><line x1="11" y1="12" x2="11" y2="14" stroke="'+c+'" stroke-width="1"/>',
      demon:'<path d="M8 2 Q13 5 12 10 Q10 14 8 14 Q6 14 4 10 Q3 5 8 2Z" fill="none" stroke="'+c+'" stroke-width="1.2"/><path d="M6 6 L8 9 L10 6" fill="none" stroke="'+c+'" stroke-width="1" stroke-linecap="round"/>',
      upper_moon:'<path d="M6 3 Q3 8 6 13 Q4 12 3 8 Q4 4 6 3Z" fill="'+c+'" opacity=".6"/><circle cx="9" cy="8" r="5" fill="none" stroke="'+c+'" stroke-width="1.1"/>',
      lower_moon:'<path d="M7 3 Q4 8 7 13 Q5 12 4 8 Q5 4 7 3Z" fill="'+c+'" opacity=".5"/><circle cx="9" cy="8" r="4.5" fill="none" stroke="'+c+'" stroke-width="1"/>',
      human:'<circle cx="8" cy="5.5" r="2.8" fill="none" stroke="'+c+'" stroke-width="1.2"/><path d="M3 14 Q3 10 8 10 Q13 10 13 14" fill="none" stroke="'+c+'" stroke-width="1.2" stroke-linecap="round"/>'
    };
    var def='<circle cx="8" cy="8" r="5" fill="none" stroke="'+c+'" stroke-width="1.2"/>';
    return '<svg width="16" height="16" viewBox="0 0 16 16">'+(p[fk]||def)+'</svg>';
  }

  function scoreColor(s){
    if(s>=90)return '#ffd700';if(s>=70)return '#50d870';
    if(s>=50)return '#50a860';if(s>=30)return '#c89030';return '#707080';
  }

  function lvlInfo(l){
    var en=['Unknown','Stranger','Stranger','Acquaintance','Acquaintance','Ally','Ally','Trusted','Trusted','Soul Bound','Beyond Death'];
    var th=['ไม่ทราบ','คนแปลกหน้า','คนแปลกหน้า','คนรู้จัก','คนรู้จัก','พันธมิตร','พันธมิตร','ไว้วางใจ','ไว้วางใจ','ผูกพัน','เหนือความตาย'];
    return TH?th[Math.max(0,Math.min(10,l||0))]:en[Math.max(0,Math.min(10,l||0))];
  }

  function statusColor(st){
    var s=(st||'').toLowerCase();
    if(/enemy|foe|hostile|demon|อสูร|ศัตรู|คู่แค้น|oni/.test(s))return '#d04848';
    if(/rival|adversary|คู่ปรับ/.test(s))return '#c87030';
    if(/ally|comrade|partner|fellow|สหาย|เพื่อนร่วมรบ|พันธมิตร/.test(s))return '#50a860';
    if(/lover|love|beloved|คนรัก|ที่รัก/.test(s))return '#d060b0';
    if(/mentor|master|hashira|เสาหลัก|อาจารย์/.test(s))return '#c4a830';
    return '#808090';
  }

  var FL={slayer:'Slayer Corps',hashira:'Hashira',demon:'Demon',upper_moon:'Upper Moon',lower_moon:'Lower Moon',human:'Human'};
  var FLT={slayer:'นักล่า',hashira:'เสาหลัก',demon:'อสูร',upper_moon:'Upper Moon',lower_moon:'Lower Moon',human:'มนุษย์'};

  function buildCard(rel){
    var sc=Math.max(0,Math.min(100,rel.score||0));
    var lv=Math.max(0,Math.min(10,rel.level||0));
    var sclr=scoreColor(sc);
    var stclr=statusColor(rel.status||'');
    var fk2=(rel.faction||'').toLowerCase().replace(/\s+/g,'_');
    var pips='';for(var i=1;i<=10;i++){pips+='<div class="knyrel-pip'+(i<=lv?' on':'')+'"></div>';}
    var noteHtml=rel.note?('<div class="knyrel-note">'+esc(rel.note)+'</div>'):'';
    var fctxt=TH?(FLT[fk2]||rel.faction||'—'):(FL[fk2]||rel.faction||'—');
    return '<div class="knyrel-card" data-rid="'+esc(String(rel.id))+'" style="border-left-color:'+sclr+'">'+
      '<div class="knyrel-view">'+
        '<div class="knyrel-top">'+
          '<div class="knyrel-cicon">'+sigilSm(fk2)+'</div>'+
          '<div class="knyrel-cinfo">'+
            '<div class="knyrel-cname">'+esc(rel.name||'—')+'</div>'+
            '<div class="knyrel-cfact">'+esc(fctxt)+'</div>'+
          '</div>'+
          '<div class="knyrel-status" style="border-color:'+stclr+'44;color:'+stclr+'">'+esc(rel.status||'—')+'</div>'+
          '<div class="knyrel-lvlbadge">'+
            '<div class="knyrel-lvlnum" style="color:'+acc+'">Lv.'+lv+'</div>'+
            '<div class="knyrel-lvllbl">'+esc(lvlInfo(lv))+'</div>'+
          '</div>'+
          '<div class="knyrel-acts">'+
            '<button class="knyrel-btn knyrel-btn-edit">'+(TH?'แก้':'EDIT')+'</button>'+
            '<button class="knyrel-btn knyrel-btn-del">'+(TH?'ลบ':'DEL')+'</button>'+
          '</div>'+
        '</div>'+
        '<div class="knyrel-bar-row">'+
          '<div class="knyrel-bar-track"><div class="knyrel-bar-fill" style="width:'+sc+'%;background:'+sclr+';box-shadow:0 0 8px '+sclr+'88"></div></div>'+
          '<div class="knyrel-score-num">'+sc+' / 100</div>'+
        '</div>'+
        '<div class="knyrel-pips" style="--acc:'+acc+'">'+pips+'</div>'+
        noteHtml+
      '</div>'+
      '<div class="knyrel-edit">'+
        '<div class="knyrel-edit-row">'+
          '<div class="knyrel-edit-lbl">'+(TH?'คะแนนความสัมพันธ์ (0-100)':'Score (0–100)')+'</div>'+
          '<div class="knyrel-edit-flex">'+
            '<input type="range" class="knyrel-range knyrel-inp-score" min="0" max="100" value="'+sc+'">'+
            '<span class="knyrel-range-val knyrel-scval" style="color:'+acc+'">'+sc+'</span>'+
          '</div>'+
        '</div>'+
        '<div class="knyrel-edit-row">'+
          '<div class="knyrel-edit-lbl">'+(TH?'ระดับความสัมพันธ์ (0-10)':'Level (0–10)')+'</div>'+
          '<div class="knyrel-edit-flex">'+
            '<input type="range" class="knyrel-range knyrel-inp-lvl" min="0" max="10" value="'+lv+'">'+
            '<span class="knyrel-range-val knyrel-lvval" style="color:'+acc+'">'+lv+'</span>'+
          '</div>'+
        '</div>'+
        '<div class="knyrel-edit-row">'+
          '<div class="knyrel-edit-lbl">'+(TH?'สถานะความสัมพันธ์':'Relationship Status')+'</div>'+
          '<input type="text" class="knyrel-inp knyrel-inp-status" value="'+esc(rel.status||'')+'" placeholder="'+(TH?'เช่น: พันธมิตร, ศัตรู, คนรัก':'e.g. Comrade, Rival, Lover')+'">'+
        '</div>'+
        '<div class="knyrel-edit-row">'+
          '<div class="knyrel-edit-lbl">'+(TH?'บันทึก':'Note')+'</div>'+
          '<input type="text" class="knyrel-inp knyrel-inp-note" value="'+esc(rel.note||'')+'" placeholder="'+(TH?'บันทึกสั้นๆ...':'Short note...')+'">'+
        '</div>'+
        '<div class="knyrel-edit-btns">'+
          '<button class="knyrel-btn-save">'+(TH?'◆ บันทึก':'◆ SAVE CHANGES')+'</button>'+
          '<button class="knyrel-btn-cancel">'+(TH?'ยกเลิก':'CANCEL')+'</button>'+
        '</div>'+
      '</div>'+
    '</div>';
  }

  function sendToChat(txt){
    setTimeout(function(){
      try{
        var w=window.parent||window;
        var ta=w.document.getElementById('send_textarea')||w.document.querySelector('#textareaAutosize,textarea.chat-input,textarea');
        if(ta){
          var dd=Object.getOwnPropertyDescriptor(w.HTMLTextAreaElement.prototype,'value');
          if(dd&&dd.set)dd.set.call(ta,txt);else ta.value=txt;
          ta.dispatchEvent(new Event('input',{bubbles:true}));
          setTimeout(function(){
            try{var sb=w.document.getElementById('send_but');if(sb)sb.click();else ta.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',keyCode:13,bubbles:true}));}catch(e){}
          },150);
          return;
        }
      }catch(e){}
      try{navigator.clipboard.writeText(txt);}catch(e){}
    },450);
  }

  function build(){
    var sg=g('knyrel-sigil');
    if(sg)sg.innerHTML=sigilBig(charFk,acc);
    var nm=g('knyrelnm');
    if(nm)nm.textContent=d.charName||'—';
    var ct=g('knyrelcount');
    if(ct)ct.textContent=relations.length+(TH?' คน':(' Bond'+(relations.length!==1?'s':'')));
    var ft=g('knyrelfoot');
    if(ft)ft.textContent=TH?'鬼滅の刃 · บันทึกสายสัมพันธ์':'鬼滅の刃 · BOND TRACKER';
    var list=g('knyrellist');
    if(!list)return;
    if(!relations.length){
      list.innerHTML='<div class="knyrel-empty">'+(TH?'ยังไม่มีสายสัมพันธ์บันทึกไว้':'No bonds recorded yet')+'</div>';
      return;
    }
    list.innerHTML=relations.map(buildCard).join('');
    // Set pip colors per card based on acc
    list.querySelectorAll('.knyrel-pip.on').forEach(function(p){p.style.background=acc;});
    list.querySelectorAll('.knyrel-range').forEach(function(r){
      r.style.setProperty('--acc',acc);
    });
  }

  build();

  var hd=g('knyrelhead');
  if(hd)hd.addEventListener('click',function(){g('knyrelwin').classList.toggle('closed');});

  var list=g('knyrellist');
  if(list){
    list.addEventListener('click',function(e){
      var card=e.target.closest('.knyrel-card'); if(!card)return;
      var rid=card.getAttribute('data-rid');
      var rel=null;for(var i=0;i<relations.length;i++){if(String(relations[i].id)===String(rid)){rel=relations[i];break;}}

      if(e.target.classList.contains('knyrel-btn-edit')){
        var ed=card.querySelector('.knyrel-edit');
        if(ed)ed.classList.toggle('on');
        return;
      }
      if(e.target.classList.contains('knyrel-btn-cancel')){
        var ed2=card.querySelector('.knyrel-edit');
        if(ed2)ed2.classList.remove('on');
        return;
      }
      if(e.target.classList.contains('knyrel-btn-save')){
        var sc=parseInt(card.querySelector('.knyrel-inp-score').value)||0;
        var lv=parseInt(card.querySelector('.knyrel-inp-lvl').value)||0;
        var st=card.querySelector('.knyrel-inp-status').value||'';
        var nt=card.querySelector('.knyrel-inp-note').value||'';
        var payload={id:parseInt(rid),name:rel?rel.name:'',faction:rel?rel.faction:'',score:sc,level:lv,status:st,note:nt,lang:d.lang||'en',charColor:acc};
        sendToChat('<'+'KNY_RELATION_EDIT>'+JSON.stringify(payload)+'<'+'/KNY_RELATION_EDIT>');
        var ed3=card.querySelector('.knyrel-edit');
        if(ed3)ed3.classList.remove('on');
        return;
      }
      if(e.target.classList.contains('knyrel-btn-del')){
        var nm2=rel?rel.name:'';
        var fk3=rel?(rel.faction||''):'';
        var msg=TH?('ลบสายสัมพันธ์กับ '+nm2+'?'):('Remove bond with '+nm2+'?');
        if(confirm(msg)){
          sendToChat('<'+'KNY_RELATION_DELETE>'+JSON.stringify({id:parseInt(rid),name:nm2,faction:fk3,lang:d.lang||'en'})+'<'+'/KNY_RELATION_DELETE>');
        }
        return;
      }
    });

    list.addEventListener('input',function(e){
      var card=e.target.closest('.knyrel-card'); if(!card)return;
      if(e.target.classList.contains('knyrel-inp-score')){
        var d2=card.querySelector('.knyrel-scval');if(d2)d2.textContent=e.target.value;
      }
      if(e.target.classList.contains('knyrel-inp-lvl')){
        var d3=card.querySelector('.knyrel-lvval');if(d3)d3.textContent=e.target.value;
      }
    });
  }
})();
</script>
</body>
</html>
